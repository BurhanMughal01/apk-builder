<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — APKForge</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-container { min-height: 100vh; display: grid; place-items: center; padding: 100px 24px 40px; }
    .auth-card { width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-lg); }
    .auth-tabs { display: flex; gap: 8px; background: var(--bg-alt); padding: 4px; border-radius: var(--radius-sm); margin-bottom: 32px; }
    .auth-tab { flex: 1; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.9375rem; color: var(--text-muted); transition: all var(--t-fast); }
    .auth-tab.active { background: var(--bg-card); color: var(--text); box-shadow: var(--shadow-sm); }
    .social-btn { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; cursor: pointer; color: var(--text); }
    .social-btn:hover { border-color: var(--primary); }
    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--text-muted); font-size: 0.8125rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:32px">
        <a href="/" class="nav-logo" style="justify-content:center">
          <div class="nav-logo-icon">⚡</div>
          <span>APKForge</span>
        </a>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" type="button">Login</button>
        <button class="auth-tab" data-tab="signup" type="button">Sign Up</button>
      </div>

      <button class="social-btn" id="googleBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <div class="divider">or</div>

      <form id="loginForm">
        <div class="form-group">
          <label class="label">Email</label>
          <input type="email" class="input" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label class="label">Password</label>
          <input type="password" class="input" id="loginPassword" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
      </form>

      <form id="signupForm" style="display:none">
        <div class="form-group">
          <label class="label">Full Name</label>
          <input type="text" class="input" id="signupName" required>
        </div>
        <div class="form-group">
          <label class="label">Email</label>
          <input type="email" class="input" id="signupEmail" required>
        </div>
        <div class="form-group">
          <label class="label">Password</label>
          <input type="password" class="input" id="signupPassword" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
      </form>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script>
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const isLogin = tab.dataset.tab === 'login';
        document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
        document.getElementById('signupForm').style.display = isLogin ? 'none' : 'block';
      };
    });

    document.getElementById('googleBtn').onclick = async () => {
      try { await Auth.signInWithGoogle(); }
      catch (e) { alert(e.message); }
    };

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Logging in...';
      try {
        await Auth.signIn(
          document.getElementById('loginEmail').value,
          document.getElementById('loginPassword').value
        );
        location.href = '/dashboard.html';
      } catch (err) {
        alert(err.message);
        btn.disabled = false; btn.textContent = 'Login';
      }
    };

    document.getElementById('signupForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Creating...';
      try {
        await Auth.signUp(
          document.getElementById('signupEmail').value,
          document.getElementById('signupPassword').value,
          document.getElementById('signupName').value
        );
        alert('✅ Account created! Email verify کریں، پھر login کریں۔');
        document.querySelector('[data-tab=login]').click();
      } catch (err) {
        alert(err.message);
      }
      btn.disabled = false; btn.textContent = 'Create Account';
    };
  </script>
</body>
</html>
