<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML to APK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.box{background:#1a1a2e;border-radius:20px;padding:30px;max-width:420px;width:100%;border:1px solid rgba(243,156,18,.2)}
h1{color:#f39c12;text-align:center;margin-bottom:8px;font-size:24px}
p{color:#8899aa;text-align:center;font-size:13px;margin-bottom:20px}
label{display:block;color:#8899aa;font-size:13px;margin-bottom:6px;margin-top:14px}
input[type=text]{width:100%;padding:12px;background:#0a0a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:15px}
.file{padding:24px;border:2px dashed #444;border-radius:10px;text-align:center;cursor:pointer;color:#8899aa;display:block}
.file input{display:none}
.fname{color:#2ecc71;font-size:13px;margin-top:8px;display:none;text-align:center}
button{width:100%;padding:15px;background:#f39c12;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer}
button:disabled{opacity:.5}
.msg{margin-top:16px;padding:16px;border-radius:10px;text-align:center;font-size:14px;display:none;line-height:1.7}
.msg.show{display:block}
.info{background:rgba(52,152,219,.15);color:#5dade2;border:1px solid rgba(52,152,219,.3)}
.ok{background:rgba(46,204,113,.15);color:#2ecc71;border:1px solid rgba(46,204,113,.3)}
.err{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3)}
a.big{display:block;margin-top:14px;padding:16px;background:#2ecc71;color:#fff;text-decoration:none;border-radius:10px;font-weight:700;font-size:16px;text-align:center}
a.sec{background:#f39c12;margin-top:8px;font-size:14px;padding:12px}
.counter{font-size:28px;font-weight:800;color:#f39c12;display:block;margin:10px 0}
</style>
</head>
<body>
<div class="box">
<h1>🚀 HTML to APK</h1>
<p>Apni HTML ko Android app mein badlein</p>

<label>App ka Naam</label>
<input type="text" id="name" value="My App" placeholder="e.g. Snake Game">

<label>HTML File</label>
<label class="file" for="file">
📁 Click karke HTML select karein
<input type="file" id="file" accept=".html,.htm">
</label>
<div class="fname" id="fname"></div>

<button id="go" onclick="build()">🚀 Build APK</button>

<div class="msg" id="msg"></div>
</div>

<script>
const API = 'https://apk-builder-api.buisch2314.workers.dev';
const RELEASES = 'https://github.com/BurhanMughal01/apk-builder/releases';

document.getElementById('file').onchange = e => {
    const f = document.getElementById('fname');
    f.textContent = '✅ ' + e.target.files[0].name;
    f.style.display = 'block';
};

function show(html, type) {
    const m = document.getElementById('msg');
    m.className = 'msg show ' + type;
    m.innerHTML = html;
}

async function build() {
    const file = document.getElementById('file').files[0];
    const appName = document.getElementById('name').value.trim() || 'My App';

    if (!file) return show('⚠️ Pehle HTML file select karein', 'err');

    document.getElementById('go').disabled = true;
    show('📤 Upload ho rahi hai...', 'info');

    const fd = new FormData();
    fd.append('htmlfile', file);
    fd.append('appName', appName);

    try {
        const r = await fetch(API, { method: 'POST', body: fd });
        const d = await r.json();

        if (!r.ok) throw new Error(d.error || 'Upload failed');

        let sec = 90;
        show(
            '✅ <b>Upload ho gayi!</b><br><br>' +
            '⏳ APK ban rahi hai...<br>' +
            '<span class="counter">' + sec + '</span>' +
            'second',
            'info'
        );

        const timer = setInterval(() => {
            sec--;
            if (sec <= 0) {
                clearInterval(timer);

                show(
                    '🎉 <b>APK Ready!</b><br><br>' +
                    'Neeche <b>Open Releases</b> button dabayein<br>' +
                    'Aur <b>sab se nayi</b> APK download karein.<br><br>' +
                    '<b>App Name:</b> ' + appName,
                    'ok'
                );

                const btn = document.createElement('a');
                btn.href = RELEASES;
                btn.className = 'big';
                btn.textContent = '⬇️ Open Releases';
                btn.target = '_blank';
                document.getElementById('msg').appendChild(btn);

                const tip = document.createElement('div');
                tip.style.marginTop = '10px';
                tip.style.fontSize = '12px';
                tip.style.color = '#8899aa';
                tip.innerHTML = 'Tip: Sab se upar wali release download karein';
                document.getElementById('msg').appendChild(tip);

                document.getElementById('go').disabled = false;
                return;
            }
            show(
                '✅ <b>Upload ho gayi!</b><br><br>' +
                '⏳ APK ban rahi hai...<br>' +
                '<span class="counter">' + sec + '</span>' +
                'second',
                'info'
            );
        }, 1000);

    } catch (e) {
        show('❌ Error: ' + e.message, 'err');
        document.getElementById('go').disabled = false;
    }
}
</script>
</body>
</html>
