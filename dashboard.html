<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — APKForge</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .dashboard-container { max-width: 1200px; margin: 100px auto 60px; padding: 0 24px; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 40px; padding: 24px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--primary); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn { position: relative; width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--bg-alt); display: grid; place-items: center; font-size: 1.25rem; cursor: pointer; border: 1px solid var(--border); color: var(--text); }
    .notif-badge { position: absolute; top: 4px; right: 4px; min-width: 20px; height: 20px; padding: 0 5px; background: var(--danger); color: white; border-radius: 10px; font-size: 0.7rem; font-weight: 700; display: grid; place-items: center; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; transition: all var(--t); }
    .stat-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .stat-value { font-size: 2rem; font-weight: 800; font-family: 'Space Grotesk', sans-serif; margin-bottom: 4px; background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-label { font-size: 0.875rem; color: var(--text-muted); }
    .progress { margin-top: 12px; height: 6px; background: var(--bg-alt); border-radius: 3px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--grad-primary); transition: width 0.3s; }
    .progress-bar.warning { background: var(--warning); }
    .progress-bar.danger { background: var(--danger); }
    .quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 40px 0; }
    .action-card { display: flex; align-items: center; gap: 16px; padding: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); transition: all var(--t); cursor: pointer; }
    .action-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .action-icon { width: 48px; height: 48px; border-radius: var(--radius); background: var(--grad-primary); display: grid; place-items: center; font-size: 1.5rem; flex-shrink: 0; }
    .action-card h3 { font-size: 1rem; margin-bottom: 2px; }
    .action-card p { font-size: 0.8125rem; color: var(--text-muted); }
    .builds-list { display: grid; gap: 12px; }
    .build-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .build-icon { width: 48px; height: 48px; border-radius: var(--radius); display: grid; place-items: center; font-size: 1.5rem; background: var(--bg-alt); }
    .build-status { padding: 4px 12px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: white; }
    .build-status.queued { background: #64748b; }
    .build-status.building { background: #f59e0b; }
    .build-status.success { background: #10b981; }
    .build-status.failed { background: #ef4444; }
    .live-indicator { color: var(--success); font-size: 0.7em; animation: pulseDot 2s infinite; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .drawer { position: fixed; top: 0; right: 0; width: 400px; max-width: 100%; height: 100vh; background: var(--bg-card); border-left: 1px solid var(--border); z-index: 200; box-shadow: var(--shadow-xl); transition: transform var(--t); overflow-y: auto; }
    .drawer.hidden { transform: translateX(100%); }
    .drawer-header { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-card); z-index: 1; }
    .notif-list { padding: 16px; }
    .notif-item { padding: 16px; border-radius: var(--radius-sm); margin-bottom: 8px; background: var(--bg-alt); }
    .notif-item.unread { background: rgba(5,150,105,0.08); border-left: 3px solid var(--primary); }
    .notif-item h4 { font-size: 0.9375rem; margin-bottom: 4px; }
    .notif-item p { font-size: 0.8125rem; color: var(--text-muted); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <div class="header-left">
        <img id="userAvatar" class="avatar" src="" alt="">
        <div>
          <h2 id="userName" style="margin-bottom:4px">Loading...</h2>
          <span id="userPlan" class="badge" style="font-size:0.75rem;padding:4px 12px;background:var(--grad-primary);color:white;border-radius:9999px;font-weight:700">Free</span>
        </div>
      </div>
      <div class="header-right">
        <button id="notifBtn" class="icon-btn" type="button">
          🔔<span id="notifCount" class="notif-badge hidden">0</span>
        </button>
        <button onclick="Auth.signOut()" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>

    <section class="grid grid-4" style="margin-bottom:40px">
      <div class="stat-card">
        <div class="stat-value" id="statBuildsUsed">-</div>
        <div class="stat-label">Builds Used</div>
        <div class="progress"><div id="usageProgress" class="progress-bar" style="width:0"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statTotalBuilds">-</div>
        <div class="stat-label">Total Builds</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statSuccessRate">-</div>
        <div class="stat-label">Success Rate</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statPlan">-</div>
        <div class="stat-label">Current Plan</div>
        <a href="pricing.html" class="btn btn-primary btn-sm" style="margin-top:12px">Upgrade</a>
      </div>
    </section>

    <section class="quick-actions">
      <a href="build.html" class="action-card">
        <div class="action-icon">🚀</div>
        <div>
          <h3>New Build</h3>
          <p>نیا APK بنائیں</p>
        </div>
      </a>
      <a href="history.html" class="action-card">
        <div class="action-icon">📦</div>
        <div>
          <h3>My Builds</h3>
          <p>تمام builds دیکھیں</p>
        </div>
      </a>
      <a href="build.html?template=calculator" class="action-card">
        <div class="action-icon">🎨</div>
        <div>
          <h3>Templates</h3>
          <p>10 ready templates</p>
        </div>
      </a>
      <a href="pricing.html" class="action-card">
        <div class="action-icon">🎁</div>
        <div>
          <h3>Upgrade</h3>
          <p>مزید builds حاصل کریں</p>
        </div>
      </a>
    </section>

    <section>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="font-size:1.5rem">Recent Builds <span class="live-indicator">●</span></h2>
        <a href="history.html" class="btn btn-ghost btn-sm">View all →</a>
      </div>
      <div id="buildsList" class="builds-list">
        <div style="text-align:center;padding:40px;color:var(--text-muted)">Loading builds...</div>
      </div>
    </section>
  </div>

  <aside id="notifDrawer" class="drawer hidden">
    <div class="drawer-header">
      <h3>Notifications</h3>
      <button onclick="toggleNotifDrawer()" class="icon-btn" type="button">✕</button>
    </div>
    <div id="notifList" class="notif-list">
      <p style="text-align:center;padding:40px;color:var(--text-muted)">Loading...</p>
    </div>
  </aside>

  <script src="supabase.js"></script>
  <script>
    let currentUser, profile, buildChannel, notifChannel;

    async function init() {
      currentUser = await Auth.requireAuth();
      if (!currentUser) return;

      profile = await Profile.get(currentUser.id);
      renderProfile();
      await loadBuilds();
      await loadNotifications();
      subscribeRealtime();
      updateStats();
    }

    function renderProfile() {
      document.getElementById('userName').textContent = profile.full_name || 'User';
      document.getElementById('userAvatar').src = profile.avatar_url ||
        'https://ui-avatars.com/api/?name=' + encodeURIComponent(profile.full_name || 'U') + '&background=059669&color=fff';
      document.getElementById('userPlan').textContent = (profile.plan || 'free').toUpperCase();
    }

    async function loadBuilds() {
      const builds = await Builds.list(currentUser.id, 10);
      renderBuilds(builds);
    }

    function renderBuilds(builds) {
      const el = document.getElementById('buildsList');
      if (!builds.length) {
        el.innerHTML = '<div style="text-align:center;padding:40px" class="card"><div style="font-size:3rem;margin-bottom:16px">📦</div><h3>ابھی کوئی build نہیں</h3><p style="margin:16px 0;color:var(--text-muted)">اپنی پہلی APK بنائیں!</p><a href="build.html" class="btn btn-primary">Build Now</a></div>';
        return;
      }
      el.innerHTML = builds.map(b => `
        <div class="build-item">
          <div style="display:flex;align-items:center;gap:16px;flex:1;min-width:250px">
            <div class="build-icon">${statusIcon(b.status)}</div>
            <div>
              <h4 style="margin-bottom:4px">${esc(b.app_name)}</h4>
              <div style="font-size:0.8125rem;color:var(--text-muted)">${esc(b.package_name)} · ${timeAgo(b.created_at)}</div>
            </div>
          </div>
          <div style="display:flex;gap:12px;align-items:center">
            <span class="build-status ${b.status}">${b.status}</span>
            ${b.apk_url ? '<a href="' + b.apk_url + '" class="btn btn-primary btn-sm" download>⬇ Download</a>' : ''}
          </div>
        </div>
      `).join('');
    }

    function statusIcon(s) {
      return { queued: '⏳', building: '🔨', success: '✅', failed: '❌', cancelled: '🚫' }[s] || '❓';
    }

    async function updateStats() {
      const builds = await Builds.list(currentUser.id, 1000);
      const successCount = builds.filter(b => b.status === 'success').length;
      document.getElementById('statBuildsUsed').textContent = profile.builds_used + ' / ' + profile.builds_limit;
      document.getElementById('statTotalBuilds').textContent = builds.length;
      document.getElementById('statSuccessRate').textContent = builds.length ? Math.round((successCount / builds.length) * 100) + '%' : '—';
      document.getElementById('statPlan').textContent = (profile.plan || 'free').toUpperCase();
      const pct = Math.min(100, (profile.builds_used / profile.builds_limit) * 100);
      const bar = document.getElementById('usageProgress');
      bar.style.width = pct + '%';
      bar.className = 'progress-bar' + (pct > 80 ? ' danger' : pct > 50 ? ' warning' : '');
    }

    function subscribeRealtime() {
      buildChannel = Builds.subscribeToUserBuilds(currentUser.id, (payload) => {
        const status = payload.new ? payload.new.status : 'update';
        showToast('Build ' + status, status === 'success' ? 'success' : 'info');
        loadBuilds();
        updateStats();
      });
      notifChannel = Notifications.subscribe(currentUser.id, (notif) => {
        loadNotifications();
        showToast(notif.title, 'info');
      });
    }

    async function loadNotifications() {
      const unread = await Notifications.list(currentUser.id, true);
      const badge = document.getElementById('notifCount');
      badge.textContent = unread.length;
      badge.classList.toggle('hidden', unread.length === 0);

      const all = await Notifications.list(currentUser.id);
      document.getElementById('notifList').innerHTML = all.length ? all.map(n => `
        <div class="notif-item ${n.is_read ? '' : 'unread'}">
          <h4>${esc(n.title)}</h4>
          <p>${esc(n.message || '')}</p>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:8px">${timeAgo(n.created_at)}</div>
        </div>
      `).join('') : '<p style="text-align:center;padding:40px;color:var(--text-muted)">کوئی notification نہیں</p>';
    }

    function toggleNotifDrawer() {
      document.getElementById('notifDrawer').classList.toggle('hidden');
    }

    document.getElementById('notifBtn').onclick = toggleNotifDrawer;

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function timeAgo(date) {
      const s = Math.floor((Date.now() - new Date(date)) / 1000);
      if (s < 60) return 'ابھی';
      if (s < 3600) return Math.floor(s/60) + 'm ago';
      if (s < 86400) return Math.floor(s/3600) + 'h ago';
      return Math.floor(s/86400) + 'd ago';
    }

    window.addEventListener('beforeunload', () => {
      if (buildChannel) buildChannel.unsubscribe();
      if (notifChannel) notifChannel.unsubscribe();
    });

    init().catch(err => { console.error(err); alert('Error: ' + err.message); });
  </script>
</body>
</html>
