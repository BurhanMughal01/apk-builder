<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Ramadan Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a1a;--bg-card:#0f1e3d;--bg-elev:#1a2d54;--bg-input:#0a1228;
  --text:#fef3c7;--text-muted:#fcd34d;--text-subtle:#a16207;
  --primary:#fbbf24;--primary-dark:#f59e0b;--accent:#4f46e5;--green:#10b981;
  --gold-grad:linear-gradient(135deg,#fbbf24,#f59e0b);
  --indigo-grad:linear-gradient(135deg,#4f46e5,#7c3aed);
  --border:rgba(251,191,36,0.2);--border-hover:rgba(251,191,36,0.5);
  --shadow:0 4px 24px rgba(0,0,0,0.5);
  --shadow-glow:0 0 30px rgba(251,191,36,0.3);
  --nav-h:64px;--header-h:60px;
}
[data-theme="light"]{
  --bg:#fefce8;--bg-card:#ffffff;--bg-elev:#fef3c7;--bg-input:#ffffff;
  --text:#1e1b4b;--text-muted:#b45309;--text-subtle:#fbbf24;
  --border:rgba(180,83,9,0.2);--border-hover:rgba(180,83,9,0.4);
  --shadow:0 4px 24px rgba(30,27,75,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  transition:background .3s,color .3s;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 20% 10%,rgba(251,191,36,0.1),transparent 40%),radial-gradient(circle at 80% 90%,rgba(79,70,229,0.12),transparent 40%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

.header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:rgba(5,10,26,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:12px;z-index:50;
}
[data-theme="light"] .header{background:rgba(254,252,232,0.95)}
.header-title{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--gold-grad);display:grid;place-items:center;font-size:18px;box-shadow:0 4px 14px rgba(251,191,36,0.5)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text-muted);transition:all .2s}
.icon-btn:active{background:var(--bg-card);color:var(--primary)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.main{position:fixed;top:var(--header-h);bottom:var(--nav-h);left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.main::-webkit-scrollbar{width:0}
.view{display:none;padding:16px;min-height:100%}
.view.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* HERO COUNTDOWN */
.countdown-hero{
  background:linear-gradient(135deg,#0f1e3d 0%,#1e1b4b 50%,#312e81 100%);
  border-radius:24px;padding:28px 20px;margin-bottom:16px;
  position:relative;overflow:hidden;text-align:center;
  box-shadow:0 8px 30px rgba(79,70,229,0.4);
}
.countdown-hero::before{
  content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;
  border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.3),transparent 70%);
}
.countdown-hero::after{
  content:'🌙';position:absolute;top:20px;right:20px;font-size:48px;opacity:0.5;
  filter:drop-shadow(0 0 20px rgba(251,191,36,0.5));
}
.hero-label{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:rgba(254,243,199,0.85);margin-bottom:10px;font-weight:700;position:relative;z-index:1}
.hero-number{font-family:'Amiri',serif;font-size:72px;font-weight:800;color:var(--primary);line-height:1;margin-bottom:6px;position:relative;z-index:1;text-shadow:0 4px 20px rgba(251,191,36,0.4)}
.hero-sub{font-size:15px;color:rgba(254,243,199,0.9);margin-bottom:16px;position:relative;z-index:1;font-weight:600}
.hero-hijri{display:inline-block;padding:6px 14px;background:rgba(251,191,36,0.15);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--primary);font-weight:700;position:relative;z-index:1}

/* TIME CARDS */
.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.time-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:18px;padding:18px;text-align:center;
  position:relative;overflow:hidden;
}
.time-card.sehri{border-left:4px solid #6366f1}
.time-card.iftar{border-left:4px solid #f59e0b}
.time-icon{font-size:28px;margin-bottom:8px}
.time-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-subtle);font-weight:700;margin-bottom:6px}
.time-value{font-size:26px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;margin-bottom:4px}
.time-sub{font-size:11px;color:var(--text-muted)}

/* SECTION */
.section-title{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;padding-left:4px;display:flex;align-items:center;gap:8px}
.section-title svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}

/* PROGRESS */
.progress-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:18px;padding:18px;margin-bottom:20px;
}
.progress-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.progress-text{font-size:14px;font-weight:700}
.progress-count{font-size:14px;font-weight:800;color:var(--primary)}
.progress-bar{height:10px;background:var(--bg-elev);border-radius:5px;overflow:hidden;margin-bottom:10px}
.progress-fill{height:100%;background:var(--gold-grad);border-radius:5px;transition:width .4s;box-shadow:0 0 12px rgba(251,191,36,0.6)}
.progress-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.progress-stat{text-align:center}
.progress-stat-val{font-size:18px;font-weight:800;color:var(--primary);line-height:1;margin-bottom:2px}
.progress-stat-label{font-size:9px;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.5px;font-weight:700}

/* DAYS GRID */
.days-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px}
.day-cell{
  aspect-ratio:1;border-radius:12px;
  background:var(--bg-card);border:2px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;cursor:pointer;
  transition:all .2s;color:var(--text-muted);
  position:relative;
}
.day-cell:active{transform:scale(0.92)}
.day-cell.done{background:var(--gold-grad);color:#050a1a;border-color:transparent;box-shadow:0 4px 14px rgba(251,191,36,0.5)}
.day-cell.today{border-color:var(--primary);box-shadow:0 0 0 3px rgba(251,191,36,0.2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(251,191,36,0.2)}50%{box-shadow:0 0 0 6px rgba(251,191,36,0.1)}}
.day-cell.done::after{content:'✓';position:absolute;bottom:2px;font-size:9px;font-weight:900}
.day-cell.past{opacity:0.4}

/* DUAS */
.daily-card{
  background:linear-gradient(135deg,rgba(251,191,36,0.08),rgba(79,70,229,0.08));
  border:1px solid var(--border);border-radius:18px;
  padding:20px;margin-bottom:20px;
}
.daily-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--primary);font-weight:800;margin-bottom:12px;text-align:center}
.daily-arabic{font-family:'Amiri',serif;font-size:22px;line-height:1.9;text-align:center;color:var(--text);margin-bottom:12px;direction:rtl}
.daily-trans{font-size:13px;color:var(--text-muted);text-align:center;line-height:1.7;font-style:italic;padding-top:12px;border-top:1px solid var(--border)}

/* SETTINGS */
.settings-group{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:16px;gap:12px;border-bottom:1px solid var(--border);flex-direction:column;align-items:stretch}
.setting-row:last-child{border-bottom:none}
.setting-info{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.setting-info svg{width:20px;height:20px;stroke:var(--primary);fill:none;stroke-width:2;flex-shrink:0}
.setting-label{font-size:14px;font-weight:600}
.setting-sub{font-size:11px;color:var(--text-subtle);margin-top:2px}
.input-field{
  width:100%;padding:12px 14px;background:var(--bg-input);border:1px solid var(--border);
  border-radius:12px;color:var(--text);font-size:14px;outline:none;margin-bottom:10px;
}
.input-field:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(251,191,36,0.15)}
.btn-primary{
  width:100%;padding:14px;background:var(--gold-grad);color:#050a1a;
  border-radius:12px;font-weight:800;font-size:14px;font-family:inherit;
  box-shadow:0 4px 14px rgba(251,191,36,0.4);
}
.btn-primary:active{transform:scale(0.98)}
.btn-secondary{
  width:100%;padding:14px;background:var(--bg-elev);color:var(--text);
  border-radius:12px;font-weight:600;font-size:14px;font-family:inherit;
  border:1px solid var(--border);
}
.btn-secondary:active{transform:scale(0.98)}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  background:rgba(15,30,61,0.95);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(3,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom);
}
[data-theme="light"] .bottom-nav{background:rgba(255,255,255,0.95)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-subtle);font-size:10px;font-weight:600;padding:8px}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--primary)}

.loading{text-align:center;padding:60px 20px;color:var(--text-subtle)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-glow);border:1px solid var(--border-hover);opacity:0;transition:all .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body data-theme="dark">

<header class="header">
  <div class="header-title">
    <div class="logo">🌙</div>
    <span id="headerTitle">Ramadan Tracker</span>
  </div>
  <button class="icon-btn" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
</header>

<main class="main" id="mainArea">

  <div class="view active" id="view-tracker">
    <div id="trackerContent">
      <div class="loading"><div class="spinner"></div><p>Loading Ramadan info...</p></div>
    </div>
  </div>

  <div class="view" id="view-settings">
    <h2 style="font-size:20px;font-weight:700;margin-bottom:16px">Settings</h2>

    <div class="settings-group">
      <div class="setting-row">
        <div class="setting-info">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <div>
            <div class="setting-label">City</div>
            <div class="setting-sub" id="citySub">Karachi, Pakistan</div>
          </div>
        </div>
        <input type="text" id="cityInput" class="input-field" placeholder="Enter city name">
        <button class="btn-primary" onclick="saveCity()">Save City</button>
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
          <div>
            <div class="setting-label">Reset Progress</div>
            <div class="setting-sub">Clear all 30 days tracker</div>
          </div>
        </div>
        <button class="btn-secondary" onclick="resetAll()" style="color:#ef4444;border-color:rgba(239,68,68,0.3)">Reset All</button>
      </div>
    </div>

    <div style="text-align:center;padding:20px 0;font-size:12px;color:var(--text-subtle);line-height:1.8">
      Track your Ramadan journey<br>
      Sehri & Iftar times by Aladhan API<br><br>
      Made with ❤️ for the Ummah<br>
      <strong style="color:var(--primary)">APKForge</strong> · v1.0.0
    </div>
  </div>

</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-view="tracker" onclick="switchView('tracker')">
    <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
    <span>Tracker</span>
  </button>
  <button class="nav-item" data-view="settings" onclick="switchView('settings')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    <span>Settings</span>
  </button>
</nav>

<div class="toast" id="toast"><span id="toastText">Saved</span></div>

<script>
let state={theme:'dark',lat:24.8607,lng:67.0011,city:'Karachi',country:'Pakistan',tracker:{},ramadanStart:null,ramadanDay:null,sehri:null,iftar:null,hijriMonth:null,hijriYear:null,timer:null};
function init(){loadState();applyTheme();loadRamadanInfo();}
function loadState(){try{const s=localStorage.getItem('ramadan_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.lat=p.lat||24.8607;state.lng=p.lng||67.0011;state.city=p.city||'Karachi';state.country=p.country||'Pakistan';state.tracker=p.tracker||{};}}catch(e){}updateCityUI();}
function saveState(){try{localStorage.setItem('ramadan_v1',JSON.stringify({theme:state.theme,lat:state.lat,lng:state.lng,city:state.city,country:state.country,tracker:state.tracker}));}catch(e){}}
function updateCityUI(){const el=document.getElementById('citySub');if(el)el.textContent=state.city+', '+state.country;}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const icon=document.getElementById('themeIcon');if(icon){if(state.theme==='dark'){icon.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{icon.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

async function loadRamadanInfo(){
  const now=new Date();
  const dd=String(now.getDate()).padStart(2,'0');
  const mm=String(now.getMonth()+1).padStart(2,'0');
  const yyyy=now.getFullYear();
  try{
    const url='https://api.aladhan.com/v1/gToH/'+dd+'-'+mm+'-'+yyyy;
    const res=await fetch(url);
    const data=await res.json();
    if(data.data&&data.data.hijri){
      const h=data.data.hijri;
      state.hijriMonth=parseInt(h.month.number);
      state.hijriYear=parseInt(h.year);
      state.ramadanDay=parseInt(h.day);
    }
  }catch(e){console.log(e);}
  await loadTimes();
  renderTracker();
}

async function loadTimes(){
  const now=new Date();
  const dd=String(now.getDate()).padStart(2,'0');
  const mm=String(now.getMonth()+1).padStart(2,'0');
  const yyyy=now.getFullYear();
  const dateStr=dd+'-'+mm+'-'+yyyy;
  try{
    const url='https://api.aladhan.com/v1/timings/'+dateStr+'?latitude='+state.lat+'&longitude='+state.lng+'&method=1';
    const res=await fetch(url);
    const data=await res.json();
    if(data.data&&data.data.timings){
      state.sehri=data.data.timings.Fajr;
      state.iftar=data.data.timings.Maghrib;
    }
  }catch(e){state.sehri='04:30';state.iftar='18:15';}
}

function renderTracker(){
  const now=new Date();
  const isRamadan=state.hijriMonth===9;
  const ramadanDay=isRamadan?state.ramadanDay:null;
  let nextRamadanDays=0;
  if(!isRamadan){
    let year=state.hijriYear;
    if(state.hijriMonth>=9)year++;
    nextRamadanDays=Math.max(0,(9-state.hijriMonth)*30);
  }
  let html='';
  if(isRamadan){
    html+='<div class="countdown-hero"><div class="hero-label">Ramadan Day</div><div class="hero-number">'+ramadanDay+'</div><div class="hero-sub">of 30 days</div><div class="hero-hijri">🌙 '+state.hijriYear+' AH</div></div>';
  }else{
    html+='<div class="countdown-hero"><div class="hero-label">Ramadan Countdown</div><div class="hero-number">~'+nextRamadanDays+'</div><div class="hero-sub">days remaining</div><div class="hero-hijri">🌙 Prepare for Ramadan</div></div>';
  }
  html+='<div class="section-title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Today\\'s Timings</div>';
  html+='<div class="time-grid"><div class="time-card sehri"><div class="time-icon">🌌</div><div class="time-label">Sehri Ends</div><div class="time-value">'+(state.sehri||'--:--')+'</div><div class="time-sub">Fajr time</div></div><div class="time-card iftar"><div class="time-icon">🌅</div><div class="time-label">Iftar Time</div><div class="time-value">'+(state.iftar||'--:--')+'</div><div class="time-sub">Maghrib time</div></div></div>';
  html+='<div class="section-title"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>30-Day Tracker</div>';
  const totalDone=Object.values(state.tracker).filter(v=>v).length;
  const percent=Math.round((totalDone/30)*100);
  html+='<div class="progress-card"><div class="progress-head"><span class="progress-text">Fasts Completed</span><span class="progress-count">'+totalDone+' / 30</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+percent+'%"></div></div><div class="progress-stats"><div class="progress-stat"><div class="progress-stat-val">'+totalDone+'</div><div class="progress-stat-label">Done</div></div><div class="progress-stat"><div class="progress-stat-val">'+(30-totalDone)+'</div><div class="progress-stat-label">Remaining</div></div><div class="progress-stat"><div class="progress-stat-val">'+percent+'%</div><div class="progress-stat-label">Progress</div></div></div></div>';
  html+='<div class="days-grid">';
  for(let i=1;i<=30;i++){
    const done=state.tracker[i];
    const isToday=ramadanDay===i;
    const isPast=ramadanDay&&i<ramadanDay;
    let cls='day-cell';
    if(done)cls+=' done';
    if(isToday)cls+=' today';
    if(isPast&&!done)cls+=' past';
    html+='<div class="'+cls+'" onclick="toggleDay('+i+')">'+i+'</div>';
  }
  html+='</div>';
  html+='<div class="daily-card"><div class="daily-title">✨ Ramadan Dua</div><div class="daily-arabic">اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي</div><div class="daily-trans">"O Allah, You are Most Forgiving, and You love forgiveness; so forgive me."<br><span style="color:var(--text-subtle);font-size:11px">— Tirmidhi 3513</span></div></div>';
  document.getElementById('trackerContent').innerHTML=html;
}

function toggleDay(day){
  state.tracker[day]=!state.tracker[day];
  if(state.tracker[day]&&navigator.vibrate)navigator.vibrate(30);
  saveState();
  renderTracker();
  if(state.tracker[day])showToast('Day '+day+' marked ✓');
}

async function saveCity(){
  const input=document.getElementById('cityInput');
  const city=input.value.trim();
  if(!city){showToast('Enter a city name');return;}
  showToast('Searching...');
  try{
    const url='https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(city)+'&limit=1';
    const res=await fetch(url,{headers:{'Accept':'application/json'}});
    const data=await res.json();
    if(!data||data.length===0){showToast('City not found');return;}
    const place=data[0];
    state.city=place.display_name.split(',')[0];
    state.country=place.display_name.split(',').slice(-1)[0].trim();
    state.lat=parseFloat(place.lat);
    state.lng=parseFloat(place.lon);
    saveState();
    updateCityUI();
    input.value='';
    showToast('City updated');
    await loadTimes();
    renderTracker();
  }catch(e){showToast('Search failed');}
}

function resetAll(){
  if(!confirm('Reset all 30 days tracker?'))return;
  state.tracker={};
  saveState();
  renderTracker();
  showToast('Progress reset');
}

function switchView(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);});
  const titles={tracker:'Ramadan Tracker',settings:'Settings'};
  document.getElementById('headerTitle').textContent=titles[view]||'Ramadan Tracker';
  document.getElementById('mainArea').scrollTo({top:0});
}

let toastTimer;function showToast(msg){const t=document.getElementById('toast');document.getElementById('toastText').textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}
init();

</script>
</body>
</html>
