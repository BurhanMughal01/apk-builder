<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Alphabet Learning</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#1a0a2e;--card:#2d1450;--elev:#3d1e6b;--text:#fef3c7;--muted:#fcd34d;--sub:#a855f7;--pri:#fbbf24;--pink:#ec4899;--blue:#06b6d4;--green:#10b981;--red:#ef4444;--grad:linear-gradient(135deg,#fbbf24,#f97316);--bdr:rgba(251,191,36,0.25);--glow:0 0 30px rgba(251,191,36,0.5)}
[data-theme="light"]{--bg:#fffbeb;--card:#fff;--elev:#fef3c7;--text:#451a03;--muted:#92400e;--sub:#fbbf24;--bdr:rgba(180,83,9,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(251,191,36,0.1),transparent 40%),radial-gradient(circle at 80% 90%,rgba(168,85,247,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(26,10,46,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(255,251,235,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.main::-webkit-scrollbar{width:0}
.big-letter-card{background:linear-gradient(135deg,rgba(251,191,36,0.2),rgba(236,72,153,0.15));border:2px solid var(--bdr);border-radius:32px;padding:24px;width:100%;max-width:440px;text-align:center;box-shadow:var(--glow);position:relative;overflow:hidden}
.big-letter-card::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.3),transparent 70%)}
.big-letter{font-size:160px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;position:relative;z-index:1;text-shadow:0 8px 40px rgba(251,191,36,0.5)}
.big-emoji{font-size:72px;margin:12px 0;position:relative;z-index:1}
.big-word{font-size:22px;font-weight:900;color:var(--text);text-transform:uppercase;letter-spacing:2px;position:relative;z-index:1}
.big-word span{color:var(--pri)}
.nav-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:440px}
.nav-btn{padding:16px;border-radius:16px;background:var(--elev);color:var(--text);font-size:20px;font-weight:900;font-family:inherit;border:1px solid var(--bdr);transition:all .2s}
.nav-btn:active{transform:scale(0.95)}
.nav-btn.play{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(251,191,36,0.4);font-size:22px}
.alphabet-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;max-width:440px}
.letter-cell{aspect-ratio:1;background:var(--card);border:1px solid var(--bdr);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--text);cursor:pointer;transition:all .15s;font-family:inherit}
.letter-cell:active{transform:scale(0.9)}
.letter-cell.current{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(251,191,36,0.5)}
.letter-cell.learned{background:rgba(16,185,129,0.2);color:var(--green);border-color:var(--green)}
.letter-cell.learned.current{background:var(--grad);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px;text-align:center}
.stat-v{font-size:22px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes letterPop{0%{transform:scale(0.8);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.big-letter.animate{animation:letterPop 0.4s}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">🔤</div><span>Learn ABC</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="big-letter-card">
<div class="big-letter" id="bigLetter">A</div>
<div class="big-emoji" id="bigEmoji">🍎</div>
<div class="big-word" id="bigWord">A for <span>Apple</span></div>
</div>

<div class="nav-row">
<button class="nav-btn" onclick="prevLetter()">◀</button>
<button class="nav-btn play" onclick="playSound()">🔊</button>
<button class="nav-btn" onclick="nextLetter()">▶</button>
</div>

<div class="stats">
<div class="stat"><div class="stat-v" id="stLearned">0/26</div><div class="stat-l">Learned</div></div>
<div class="stat"><div class="stat-v" id="stCurrent">A</div><div class="stat-l">Current</div></div>
</div>

<div class="alphabet-grid" id="grid"></div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<script>
const ALPHABET=[
{a:'A',e:'🍎',w:'Apple'},{a:'B',e:'🐻',w:'Bear'},{a:'C',e:'🐱',w:'Cat'},{a:'D',e:'🐶',w:'Dog'},
{a:'E',e:'🐘',w:'Elephant'},{a:'F',e:'🐟',w:'Fish'},{a:'G',e:'🦒',w:'Giraffe'},{a:'H',e:'🏠',w:'House'},
{a:'I',e:'🍦',w:'Ice cream'},{a:'J',e:'🍯',w:'Jam'},{a:'K',e:'🦘',w:'Kangaroo'},{a:'L',e:'🦁',w:'Lion'},
{a:'M',e:'🐒',w:'Monkey'},{a:'N',e:'📓',w:'Notebook'},{a:'O',e:'🐙',w:'Octopus'},{a:'P',e:'🐧',w:'Penguin'},
{a:'Q',e:'👸',w:'Queen'},{a:'R',e:'🌈',w:'Rainbow'},{a:'S',e:'☀️',w:'Sun'},{a:'T',e:'🌳',w:'Tree'},
{a:'U',e:'☂️',w:'Umbrella'},{a:'V',e:'🎻',w:'Violin'},{a:'W',e:'🐋',w:'Whale'},{a:'X',e:'🎁',w:'Xmas box'},
{a:'Y',e:'🧶',w:'Yarn'},{a:'Z',e:'🦓',w:'Zebra'}
];
let state={theme:'dark',index:0,learned:[]};
let ttm,audioCtx=null;
function init(){loadState();applyTheme();render();}
function loadState(){try{const s=localStorage.getItem('abc_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.index=p.index||0;state.learned=p.learned||[];}}catch(e){}}
function saveState(){try{localStorage.setItem('abc_v1',JSON.stringify({theme:state.theme,index:state.index,learned:state.learned}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function render(){
  const item=ALPHABET[state.index];
  const bl=document.getElementById('bigLetter');
  bl.textContent=item.a;
  bl.classList.remove('animate');
  void bl.offsetWidth;
  bl.classList.add('animate');
  document.getElementById('bigEmoji').textContent=item.e;
  document.getElementById('bigWord').innerHTML=item.a+' for <span>'+item.w+'</span>';
  if(!state.learned.includes(item.a)){state.learned.push(item.a);saveState();}
  document.getElementById('stLearned').textContent=state.learned.length+'/26';
  document.getElementById('stCurrent').textContent=item.a;
  const grid=document.getElementById('grid');
  grid.innerHTML=ALPHABET.map((l,i)=>{
    const cls=['letter-cell'];
    if(i===state.index)cls.push('current');
    else if(state.learned.includes(l.a))cls.push('learned');
    return '<button class="'+cls.join(' ')+'" onclick="jumpTo('+i+')">'+l.a+'</button>';
  }).join('');
}

function nextLetter(){state.index=(state.index+1)%26;render();saveState();playSound(true);if(navigator.vibrate)navigator.vibrate(15);}
function prevLetter(){state.index=(state.index-1+26)%26;render();saveState();playSound(true);if(navigator.vibrate)navigator.vibrate(15);}
function jumpTo(i){state.index=i;render();saveState();playSound(true);if(navigator.vibrate)navigator.vibrate(15);}

function playSound(skipSpeak){
  const item=ALPHABET[state.index];
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=440;o.type='sine';
    g.gain.setValueAtTime(0.1,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);
    o.start();o.stop(audioCtx.currentTime+0.15);
  }catch(e){}
  if('speechSynthesis' in window&&!skipSpeak){
    const u=new SpeechSynthesisUtterance(item.a+' for '+item.w);
    u.rate=0.8;u.pitch=1.2;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }
  if(!skipSpeak)showToast(item.a+' for '+item.w);
}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
