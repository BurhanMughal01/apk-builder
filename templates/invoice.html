<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Invoice Generator</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#0a0e1a;--card:#151b2e;--elev:#1e2744;--text:#e2e8f0;--muted:#94a3b8;--sub:#64748b;--pri:#3b82f6;--green:#10b981;--red:#ef4444;--gold:#fbbf24;--grad:linear-gradient(135deg,#3b82f6,#6366f1);--bdr:rgba(59,130,246,0.2);--glow:0 0 30px rgba(59,130,246,0.3)}
[data-theme="light"]{--bg:#f8fafc;--card:#fff;--elev:#f1f5f9;--text:#0f172a;--muted:#475569;--sub:#94a3b8;--bdr:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(59,130,246,0.06),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,14,26,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(248,250,252,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px}
.main::-webkit-scrollbar{width:0}
.invoice{background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:20px;margin-bottom:14px}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.inv-title{font-size:28px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
.inv-num{font-size:12px;color:var(--sub);font-weight:700;margin-top:4px}
.inv-date{text-align:right;font-size:11px;color:var(--sub);line-height:1.6}
.inv-date strong{color:var(--text);font-size:14px;display:block}
.section-lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--pri);font-weight:800;margin-bottom:8px;margin-top:16px}
.field{margin-bottom:10px}
.field-lbl{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.inp{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--bdr);border-radius:10px;color:var(--text);font-size:13px;font-weight:600}
.inp:focus{border-color:var(--pri)}
textarea.inp{resize:none;min-height:60px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.items-table{margin-top:14px;border:1px solid var(--bdr);border-radius:12px;overflow:hidden}
.item-row{display:grid;grid-template-columns:1fr 60px 80px 80px 30px;gap:6px;padding:8px 10px;border-bottom:1px solid var(--bdr);align-items:center}
.item-row:last-child{border-bottom:none}
.item-row.head{background:var(--elev);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--sub);font-weight:800}
.item-cell{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-cell.num{text-align:right;font-variant-numeric:tabular-nums}
.item-del{width:24px;height:24px;border-radius:6px;background:rgba(239,68,68,0.1);color:#fca5a5;display:grid;place-items:center}
.item-del svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5}
.item-input{background:transparent;border:1px solid transparent;padding:4px;border-radius:6px;color:var(--text);font-size:12px;font-weight:700;width:100%;font-family:inherit;outline:none}
.item-input:focus{background:var(--bg);border-color:var(--pri)}
.item-input.num{text-align:right}
.totals{background:var(--elev);border-radius:12px;padding:14px;margin-top:14px}
.total-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--muted);font-weight:600}
.total-row.grand{font-size:18px;font-weight:900;color:var(--text);border-top:1px solid var(--bdr);padding-top:12px;margin-top:6px}
.total-row.grand span:last-child{color:var(--green)}
.tax-input{width:60px;padding:4px 6px;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;color:var(--text);font-size:12px;text-align:center;font-family:inherit;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{padding:14px;border-radius:12px;background:var(--elev);color:var(--text);font-size:13px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bdr)}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(59,130,246,0.4)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn-block{grid-column:span 2}
.add-item{padding:10px;border-radius:10px;background:var(--elev);color:var(--pri);font-size:12px;font-weight:800;font-family:inherit;border:1px dashed var(--pri);width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.add-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">🧾</div><span>Invoice Generator</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="invoice" id="invoice">
<div class="inv-head">
<div><div class="inv-title">INVOICE</div><div class="inv-num"># <span id="invNum">INV-2026-001</span></div></div>
<div class="inv-date"><strong id="invDate">—</strong>Issue Date<br><strong id="invDue">—</strong>Due Date</div>
</div>

<div class="two-col">
<div class="field"><div class="field-lbl">Your Business</div><input type="text" class="inp" id="fromName" placeholder="Business name"></div>
<div class="field"><div class="field-lbl">Client Name</div><input type="text" class="inp" id="toName" placeholder="Client name"></div>
</div>
<div class="two-col">
<div class="field"><div class="field-lbl">Your Email</div><input type="email" class="inp" id="fromEmail" placeholder="you@email.com"></div>
<div class="field"><div class="field-lbl">Client Email</div><input type="email" class="inp" id="toEmail" placeholder="client@email.com"></div>
</div>
<div class="field"><div class="field-lbl">Your Address</div><textarea class="inp" id="fromAddr" placeholder="Street, City, Country"></textarea></div>
<div class="field"><div class="field-lbl">Client Address</div><textarea class="inp" id="toAddr" placeholder="Street, City, Country"></textarea></div>

<div class="section-lbl">Items</div>
<div class="items-table">
<div class="item-row head"><div>Description</div><div style="text-align:right">Qty</div><div style="text-align:right">Price</div><div style="text-align:right">Total</div><div></div></div>
<div id="itemsList"></div>
</div>
<button class="add-item" onclick="addItem()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add Item</button>

<div class="totals">
<div class="total-row"><span>Subtotal</span><span id="subtotal">0.00</span></div>
<div class="total-row"><span>Tax <input type="number" class="tax-input" id="taxRate" value="0" min="0" max="100" oninput="calc()">%</span><span id="taxAmt">0.00</span></div>
<div class="total-row"><span>Discount</span><span><input type="number" class="tax-input" id="discount" value="0" min="0" oninput="calc()"></span></div>
<div class="total-row grand"><span>Total</span><span id="grandTotal">0.00</span></div>
</div>

<div class="field" style="margin-top:14px"><div class="field-lbl">Notes</div><textarea class="inp" id="notes" placeholder="Thank you for your business!"></textarea></div>

<div class="actions">
<button class="btn primary btn-block" onclick="shareInvoice()"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>Share Invoice</button>
<button class="btn" onclick="copyInvoice()"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy Text</button>
<button class="btn" onclick="resetInv()"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>New</button>
</div>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Copied</span></div>

<script>
let state={theme:'dark',items:[],invNum:'INV-2026-001'};
let ttm;
function init(){loadState();applyTheme();setupDates();genInvNum();addItem('Service',1,0);render();}
function loadState(){try{const s=localStorage.getItem('inv_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.invNum=p.invNum;}}catch(e){}}
function saveState(){try{localStorage.setItem('inv_v1',JSON.stringify({theme:state.theme,invNum:state.invNum}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function setupDates(){
  const today=new Date();
  const due=new Date(today.getTime()+30*86400000);
  const fmt=d=>d.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});
  document.getElementById('invDate').textContent=fmt(today);
  document.getElementById('invDue').textContent=fmt(due);
}
function genInvNum(){
  if(!state.invNum){state.invNum='INV-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*999)+1).padStart(3,'0');}
  document.getElementById('invNum').textContent=state.invNum;
}

function addItem(desc,qty,price){
  state.items.push({id:Date.now()+Math.random(),desc:desc||'',qty:qty||1,price:price||0});
  render();
}
function removeItem(id){state.items=state.items.filter(i=>i.id!==id);render();calc();}
function updateItem(id,field,val){
  const item=state.items.find(i=>String(i.id)===String(id));
  if(!item)return;
  if(field==='qty')item.qty=parseFloat(val)||0;
  else if(field==='price')item.price=parseFloat(val)||0;
  else item.desc=val;
  calc();
}

function render(){
  const list=document.getElementById('itemsList');
  list.innerHTML=state.items.map(it=>'<div class="item-row"><input class="item-input" value="'+esc(it.desc)+'" placeholder="Description" oninput="updateItem(\''+it.id+'\',\'desc\',this.value)"><input class="item-input num" type="number" value="'+it.qty+'" min="0" oninput="updateItem(\''+it.id+'\',\'qty\',this.value)"><input class="item-input num" type="number" value="'+it.price+'" min="0" step="0.01" oninput="updateItem(\''+it.id+'\',\'price\',this.value)"><div class="item-cell num" id="lt-'+it.id+'">'+(it.qty*it.price).toFixed(2)+'</div><button class="item-del" onclick="removeItem(\''+it.id+'\')"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>').join('');
  calc();
}

function calc(){
  let sub=0;
  state.items.forEach(it=>{
    const line=it.qty*it.price;
    sub+=line;
    const el=document.getElementById('lt-'+it.id);
    if(el)el.textContent=line.toFixed(2);
  });
  const tax=parseFloat(document.getElementById('taxRate').value)||0;
  const disc=parseFloat(document.getElementById('discount').value)||0;
  const taxAmt=sub*tax/100;
  const total=sub+taxAmt-disc;
  document.getElementById('subtotal').textContent=sub.toFixed(2);
  document.getElementById('taxAmt').textContent=taxAmt.toFixed(2);
  document.getElementById('grandTotal').textContent=total.toFixed(2);
}

function buildText(){
  const from=document.getElementById('fromName').value||'Your Business';
  const fromEmail=document.getElementById('fromEmail').value||'';
  const fromAddr=document.getElementById('fromAddr').value||'';
  const to=document.getElementById('toName').value||'Client';
  const toEmail=document.getElementById('toEmail').value||'';
  const toAddr=document.getElementById('toAddr').value||'';
  const date=document.getElementById('invDate').textContent;
  const due=document.getElementById('invDue').textContent;
  const notes=document.getElementById('notes').value||'';
  const tax=document.getElementById('taxRate').value||0;
  const disc=document.getElementById('discount').value||0;
  let txt='INVOICE '+state.invNum+'\nIssue: '+date+' | Due: '+due+'\n\n';
  txt+='FROM: '+from+'\n'+(fromEmail?'Email: '+fromEmail+'\n':'')+(fromAddr?fromAddr+'\n':'')+'\n';
  txt+='TO: '+to+'\n'+(toEmail?'Email: '+toEmail+'\n':'')+(toAddr?toAddr+'\n':'')+'\n';
  txt+='ITEMS:\n';
  let sub=0;
  state.items.forEach(it=>{const line=it.qty*it.price;sub+=line;txt+='• '+it.desc+' × '+it.qty+' × '+it.price.toFixed(2)+' = '+line.toFixed(2)+'\n';});
  const taxAmt=sub*(parseFloat(tax)/100);
  const total=sub+taxAmt-parseFloat(disc);
  txt+='\nSubtotal: '+sub.toFixed(2)+'\n';
  txt+='Tax ('+tax+'%): '+taxAmt.toFixed(2)+'\n';
  txt+='Discount: '+parseFloat(disc).toFixed(2)+'\n';
  txt+='TOTAL: '+total.toFixed(2)+'\n';
  if(notes)txt+='\nNotes: '+notes;
  return txt;
}

function copyInvoice(){
  const txt=buildText();
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>showToast('Copied to clipboard'));}
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('Copied');}catch(e){}document.body.removeChild(ta);}
}

function shareInvoice(){
  const txt=buildText();
  if(navigator.share){navigator.share({title:'Invoice '+state.invNum,text:txt}).catch(()=>{});}
  else copyInvoice();
}

function resetInv(){
  if(!confirm('Create new invoice? Current data will be cleared.'))return;
  document.getElementById('fromName').value='';
  document.getElementById('fromEmail').value='';
  document.getElementById('fromAddr').value='';
  document.getElementById('toName').value='';
  document.getElementById('toEmail').value='';
  document.getElementById('toAddr').value='';
  document.getElementById('notes').value='';
  document.getElementById('taxRate').value=0;
  document.getElementById('discount').value=0;
  state.items=[{id:Date.now(),desc:'Service',qty:1,price:0}];
  state.invNum='INV-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*999)+1).padStart(3,'0');
  saveState();genInvNum();render();showToast('New invoice');
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
init();
</script></body></html>
