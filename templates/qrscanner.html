<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>QR Scanner</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#0a1410;--card:#14251e;--elev:#1e3d30;--text:#d1fae5;--muted:#6ee7b7;--sub:#059669;--pri:#10b981;--red:#ef4444;--blue:#3b82f6;--gold:#fbbf24;--grad:linear-gradient(135deg,#10b981,#06b6d4);--bdr:rgba(16,185,129,0.25);--glow:0 0 30px rgba(16,185,129,0.4)}
[data-theme="light"]{--bg:#f0fdf4;--card:#fff;--elev:#dcfce7;--text:#052e16;--muted:#15803d;--sub:#86efac;--bdr:rgba(22,163,74,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(16,185,129,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,20,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(240,253,244,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.main::-webkit-scrollbar{width:0}
.scanner-box{width:100%;max-width:400px;aspect-ratio:1;background:var(--card);border:2px solid var(--bdr);border-radius:24px;position:relative;overflow:hidden;box-shadow:var(--glow)}
#video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.scan-overlay{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}
.scan-frame{width:70%;aspect-ratio:1;border:3px solid var(--pri);border-radius:20px;position:relative;box-shadow:0 0 30px rgba(16,185,129,0.6)}
.scan-frame::before,.scan-frame::after{content:'';position:absolute;width:30px;height:30px;border:3px solid var(--pri)}
.scan-frame::before{top:-3px;left:-3px;border-right:none;border-bottom:none;border-radius:20px 0 0 0}
.scan-frame::after{bottom:-3px;right:-3px;border-left:none;border-top:none;border-radius:0 0 20px 0}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--pri),transparent);animation:scanline 2s infinite;box-shadow:0 0 10px var(--pri)}
@keyframes scanline{0%{top:15%}50%{top:85%}100%{top:15%}}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--sub)}
.placeholder-icon{font-size:64px;margin-bottom:12px;opacity:0.5}
.placeholder-text{font-size:13px;line-height:1.6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px}
.btn{padding:15px;border-radius:14px;background:var(--elev);color:var(--text);font-size:13px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bdr);transition:all .2s}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(16,185,129,0.4)}
.btn.red{background:rgba(239,68,68,0.15);color:#fca5a5;border-color:rgba(239,68,68,0.3)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.result-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px;display:none;animation:fadeIn .3s}
.result-card.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.result-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:8px}
.result-type{display:inline-block;padding:3px 8px;border-radius:6px;background:rgba(16,185,129,0.15);color:var(--pri);font-size:10px;font-weight:800;margin-left:8px;letter-spacing:0.5px}
.result-text{font-size:14px;font-weight:600;color:var(--text);word-break:break-all;line-height:1.6;padding:12px;background:var(--bg);border-radius:10px;margin-bottom:12px;max-height:120px;overflow-y:auto}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.history-title{width:100%;max-width:400px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:8px 4px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.history-title button{font-size:11px;color:var(--red);font-weight:700;text-transform:none;letter-spacing:0}
.history{width:100%;max-width:400px;display:flex;flex-direction:column;gap:8px}
.hist-item{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;transition:all .2s;cursor:pointer}
.hist-item:active{transform:scale(0.98)}
.hist-icon{width:36px;height:36px;border-radius:10px;background:var(--elev);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.hist-info{flex:1;min-width:0}
.hist-text{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.hist-time{font-size:10px;color:var(--sub)}
.hist-del{width:28px;height:28px;border-radius:8px;background:rgba(239,68,68,0.1);color:#fca5a5;display:grid;place-items:center;flex-shrink:0}
.hist-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.empty{text-align:center;padding:30px 20px;color:var(--sub);font-size:12px;background:var(--card);border:1px dashed var(--bdr);border-radius:14px;width:100%;max-width:400px}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">📱</div><span>QR Scanner</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="scanner-box" id="scannerBox">
<div class="placeholder" id="placeholder"><div class="placeholder-icon">📷</div><div class="placeholder-text">Tap "Start Camera"<br>to scan a QR code</div></div>
<video id="video" playsinline autoplay muted style="display:none"></video>
<div class="scan-overlay" id="scanOverlay" style="display:none"><div class="scan-frame"><div class="scan-line"></div></div></div>
<canvas id="canvas" style="display:none"></canvas>
</div>

<div class="actions">
<button class="btn primary" id="startBtn" onclick="startCamera()"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>Start Camera</button>
<button class="btn" onclick="document.getElementById('fileInput').click()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Upload Image</button>
</div>
<input type="file" id="fileInput" accept="image/*" hidden onchange="scanImage(this.files[0])">

<div class="result-card" id="resultCard">
<div class="result-label">Scan Result<span class="result-type" id="resultType">TEXT</span></div>
<div class="result-text" id="resultText"></div>
<div class="result-actions">
<button class="btn" onclick="copyResult()"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy</button>
<button class="btn primary" id="openBtn" onclick="openResult()"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>Open</button>
</div>
</div>

<div class="history-title" id="historyTitle" style="display:none"><span>Recent Scans</span><button onclick="clearHistory()">Clear All</button></div>
<div class="history" id="history"></div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
let state={theme:'dark',history:[],stream:null,scanning:false,lastResult:null};
let ttm;
function init(){loadState();applyTheme();renderHistory();}
function loadState(){try{const s=localStorage.getItem('qr_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.history=p.history||[];}}catch(e){}}
function saveState(){try{localStorage.setItem('qr_v1',JSON.stringify({theme:state.theme,history:state.history}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

async function startCamera(){
  if(state.scanning){stopCamera();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    state.stream=stream;
    const video=document.getElementById('video');
    video.srcObject=stream;
    video.style.display='block';
    document.getElementById('placeholder').style.display='none';
    document.getElementById('scanOverlay').style.display='grid';
    document.getElementById('startBtn').innerHTML='<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>Stop Camera';
    document.getElementById('startBtn').classList.add('red');
    state.scanning=true;
    video.onloadedmetadata=()=>video.play();
    requestAnimationFrame(scanLoop);
  }catch(err){
    showToast('Camera access denied');
    console.error(err);
  }
}
function stopCamera(){
  if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null;}
  document.getElementById('video').style.display='none';
  document.getElementById('placeholder').style.display='flex';
  document.getElementById('scanOverlay').style.display='none';
  document.getElementById('startBtn').innerHTML='<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>Start Camera';
  document.getElementById('startBtn').classList.remove('red');
  state.scanning=false;
}

function scanLoop(){
  if(!state.scanning)return;
  const video=document.getElementById('video');
  const canvas=document.getElementById('canvas');
  if(video.readyState===video.HAVE_ENOUGH_DATA){
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    try{
      const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
      if(window.jsQR){
        const code=window.jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'dontInvert'});
        if(code&&code.data){
          onScanSuccess(code.data);
          return;
        }
      }
    }catch(e){}
  }
  requestAnimationFrame(scanLoop);
}

function scanImage(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.getElementById('canvas');
      canvas.width=img.width;canvas.height=img.height;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      try{
        const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
        if(window.jsQR){
          const code=window.jsQR(imgData.data,imgData.width,imgData.height);
          if(code&&code.data){onScanSuccess(code.data);}
          else showToast('No QR found in image');
        }else showToast('Scanner loading...');
      }catch(err){showToast('Cannot read image');}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  document.getElementById('fileInput').value='';
}

function onScanSuccess(data){
  if(state.scanning)stopCamera();
  state.lastResult=data;
  document.getElementById('resultText').textContent=data;
  let type='TEXT',emoji='📄';
  if(/^https?:\/\//i.test(data)){type='URL';emoji='🔗';}
  else if(/^mailto:/i.test(data)){type='EMAIL';emoji='✉️';}
  else if(/^tel:/i.test(data)){type='PHONE';emoji='📱';}
  else if(/^WIFI:/i.test(data)){type='WIFI';emoji='📶';}
  else if(/^BEGIN:VCARD/i.test(data)){type='CONTACT';emoji='👤';}
  document.getElementById('resultType').textContent=type;
  document.getElementById('resultCard').classList.add('show');
  const openBtn=document.getElementById('openBtn');
  if(type==='URL'){openBtn.style.display='flex';}
  else if(type==='PHONE'){openBtn.style.display='flex';}
  else if(type==='EMAIL'){openBtn.style.display='flex';}
  else{openBtn.style.display='none';}
  // Add to history
  state.history.unshift({id:Date.now(),data:data,type:type,emoji:emoji,time:new Date().toISOString()});
  if(state.history.length>20)state.history=state.history.slice(0,20);
  saveState();renderHistory();
  if(navigator.vibrate)navigator.vibrate([50,30,50]);
  showToast('QR detected! ✓');
}

function copyResult(){
  if(!state.lastResult)return;
  if(navigator.clipboard){navigator.clipboard.writeText(state.lastResult).then(()=>showToast('Copied'));}
}
function openResult(){
  if(!state.lastResult)return;
  const d=state.lastResult;
  if(/^https?:\/\//i.test(d)){window.open(d,'_blank');}
  else if(/^tel:/i.test(d)){window.location.href=d;}
  else if(/^mailto:/i.test(d)){window.location.href=d;}
}

function renderHistory(){
  const el=document.getElementById('history');
  const title=document.getElementById('historyTitle');
  if(!state.history.length){el.innerHTML='';title.style.display='none';return;}
  title.style.display='flex';
  el.innerHTML=state.history.map(h=>'<div class="hist-item" onclick="showHist(\''+String(h.id)+'\')"><div class="hist-icon">'+h.emoji+'</div><div class="hist-info"><div class="hist-text">'+esc(h.data)+'</div><div class="hist-time">'+timeAgo(h.time)+'</div></div><button class="hist-del" onclick="event.stopPropagation();delHist(\''+String(h.id)+'\')"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>').join('');
}
function showHist(id){
  const h=state.history.find(x=>String(x.id)===String(id));
  if(!h)return;
  state.lastResult=h.data;
  document.getElementById('resultText').textContent=h.data;
  document.getElementById('resultType').textContent=h.type;
  document.getElementById('resultCard').classList.add('show');
  const openBtn=document.getElementById('openBtn');
  openBtn.style.display=(h.type==='URL'||h.type==='PHONE'||h.type==='EMAIL')?'flex':'none';
  showToast('Loaded from history');
}
function delHist(id){state.history=state.history.filter(h=>String(h.id)!==String(id));saveState();renderHistory();}
function clearHistory(){if(!confirm('Clear all history?'))return;state.history=[];saveState();renderHistory();showToast('Cleared');}
function timeAgo(iso){const diff=Date.now()-new Date(iso).getTime();const s=Math.floor(diff/1000);if(s<60)return'just now';const m=Math.floor(s/60);if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
window.addEventListener('beforeunload',()=>{if(state.stream)state.stream.getTracks().forEach(t=>t.stop());});
init();
</script></body></html>
