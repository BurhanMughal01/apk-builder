<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Notes</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#1a1611;--card:#2a231a;--elev:#3d342a;--text:#f5ede1;--muted:#c4b5a0;--sub:#8b7a63;--pri:#f59e0b;--gold:linear-gradient(135deg,#fbbf24,#f59e0b);--bdr:rgba(245,158,11,0.2);--shadow:0 4px 24px rgba(0,0,0,0.5)}
[data-theme="light"]{--bg:#fef9f3;--card:#fff;--elev:#fef3c7;--text:#451a03;--muted:#92400e;--sub:#d97706;--bdr:rgba(146,64,14,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;background-image:radial-gradient(circle at 20% 10%,rgba(245,158,11,0.06),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(26,22,17,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(254,249,243,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:all .2s}
.ib:active{background:var(--card);color:var(--pri)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:18px}
.search{padding:0 16px 12px;margin-top:60px}
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px 16px}
.sb svg{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:2}
.sb input{flex:1;background:none;border:none;color:var(--text);font-size:14px}
.sb input::placeholder{color:var(--sub)}
.main{position:fixed;top:118px;bottom:0;left:0;right:0;overflow-y:auto;padding:0 16px 16px}
.main::-webkit-scrollbar{width:0}
.note{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;transition:all .2s;cursor:pointer}
.note:active{transform:scale(0.98)}
.note-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.note-t{font-size:15px;font-weight:700;flex:1;line-height:1.3;word-wrap:break-word}
.note-star{color:var(--pri);font-size:16px;flex-shrink:0}
.note-b{font-size:13px;color:var(--muted);line-height:1.5;max-height:60px;overflow:hidden;word-wrap:break-word}
.note-f{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr);font-size:11px;color:var(--sub)}
.note-actions{display:flex;gap:6px}
.mini-btn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--elev);color:var(--muted)}
.mini-btn:active{transform:scale(0.9)}
.mini-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:0.5}
.empty h3{font-size:16px;color:var(--muted);margin-bottom:6px}
.empty p{font-size:13px}
.fab{position:fixed;bottom:24px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--gold);color:#1a1611;display:grid;place-items:center;box-shadow:0 8px 24px rgba(245,158,11,0.5);z-index:100;transition:all .3s}
.fab:active{transform:scale(0.9) rotate(90deg)}
.fab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.editor{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
.editor.show{display:flex}
.ed-bar{height:60px;padding:0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bdr)}
.ed-bar .ib{color:var(--pri)}
.ed-title{flex:1;background:none;border:none;color:var(--text);font-size:16px;font-weight:700;padding:8px 0}
.ed-title::placeholder{color:var(--sub)}
.ed-body{flex:1;width:100%;padding:16px;background:none;border:none;color:var(--text);font-size:15px;line-height:1.7;resize:none}
.ed-body::placeholder{color:var(--sub)}
.ed-foot{height:50px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--bdr);font-size:12px;color:var(--sub)}
.ed-save{padding:8px 20px;background:var(--gold);color:#1a1611;border-radius:20px;font-weight:700;font-size:13px}
.ed-save:active{transform:scale(0.95)}
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr">
<div class="hdr-t"><div class="logo">📝</div><span>My Notes</span></div>
<button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
</header>

<div class="search">
<div class="sb">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
<input type="text" id="searchInput" placeholder="Search notes..." oninput="render()">
</div>
</div>

<div class="main" id="mainArea"></div>

<button class="fab" onclick="newNote()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="editor" id="editor">
<div class="ed-bar">
<button class="ib" onclick="closeEditor()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
<input type="text" class="ed-title" id="edTitle" placeholder="Note title...">
<button class="ib" onclick="toggleStarEditor()" id="starBtn"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
</div>
<textarea class="ed-body" id="edBody" placeholder="Start writing..."></textarea>
<div class="ed-foot">
<span id="edInfo">0 words</span>
<button class="ed-save" onclick="saveNote()">Save</button>
</div>
</div>

<div class="tt" id="toast"><span id="tt-txt">Saved</span></div>

<script>
let state={theme:'dark',notes:[],editing:null};
let ttm;
function init(){loadState();applyTheme();render();}
function loadState(){try{const s=localStorage.getItem('notes_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.notes=p.notes||[];}}catch(e){}}
function saveState(){try{localStorage.setItem('notes_v1',JSON.stringify({theme:state.theme,notes:state.notes}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function render(){
  const el=document.getElementById('mainArea');
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  let notes=state.notes.slice().sort((a,b)=>(b.star?1:0)-(a.star?1:0)||b.updated-a.updated);
  if(q)notes=notes.filter(n=>(n.title||'').toLowerCase().includes(q)||(n.body||'').toLowerCase().includes(q));
  if(notes.length===0){
    el.innerHTML='<div class="empty"><div class="empty-icon">📝</div><h3>'+(q?'No results':'No notes yet')+'</h3><p>'+(q?'Try a different search':'Tap + to create your first note')+'</p></div>';
    return;
  }
  el.innerHTML=notes.map(n=>{
    const words=(n.body||'').trim().split(/\s+/).filter(w=>w).length;
    const preview=(n.body||'').slice(0,120)||'(empty)';
    return '<div class="note" onclick="openEditor('+n.id+')"><div class="note-h"><div class="note-t">'+(n.title||'Untitled')+'</div>'+(n.star?'<span class="note-star">★</span>':'')+'</div><div class="note-b">'+preview+'</div><div class="note-f"><span>'+timeAgo(n.updated)+' · '+words+' words</span><div class="note-actions"><button class="mini-btn" onclick="event.stopPropagation();deleteNote('+n.id+')"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button></div></div></div>';
  }).join('');
}

function timeAgo(ts){if(!ts)return'';const d=Date.now()-ts;const m=Math.floor(d/60000);if(m<1)return'Just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';const dy=Math.floor(h/24);if(dy<7)return dy+'d ago';return new Date(ts).toLocaleDateString();}

function newNote(){
  state.editing={id:Date.now(),title:'',body:'',star:false,updated:Date.now()};
  document.getElementById('edTitle').value='';
  document.getElementById('edBody').value='';
  document.getElementById('starBtn').style.color='var(--muted)';
  document.getElementById('editor').classList.add('show');
  setTimeout(()=>document.getElementById('edTitle').focus(),100);
  updateWords();
}

function openEditor(id){
  const n=state.notes.find(x=>x.id===id);
  if(!n)return;
  state.editing={...n};
  document.getElementById('edTitle').value=n.title||'';
  document.getElementById('edBody').value=n.body||'';
  document.getElementById('starBtn').style.color=n.star?'var(--pri)':'var(--muted)';
  document.getElementById('editor').classList.add('show');
  updateWords();
}

function closeEditor(){
  const t=document.getElementById('edTitle').value.trim();
  const b=document.getElementById('edBody').value.trim();
  if(state.editing&&(t||b)){
    saveNote(true);
  }else{
    document.getElementById('editor').classList.remove('show');
    state.editing=null;
  }
}

function saveNote(keepOpen){
  if(!state.editing)return;
  const t=document.getElementById('edTitle').value.trim();
  const b=document.getElementById('edBody').value.trim();
  if(!t&&!b){showToast('Empty note');return;}
  const idx=state.notes.findIndex(n=>n.id===state.editing.id);
  const note={...state.editing,title:t||'Untitled',body:b,updated:Date.now()};
  if(idx>-1)state.notes[idx]=note;
  else state.notes.push(note);
  saveState();
  if(!keepOpen){
    document.getElementById('editor').classList.remove('show');
    state.editing=null;
    render();
  }
  showToast('Saved');
}

function toggleStarEditor(){
  if(!state.editing)return;
  state.editing.star=!state.editing.star;
  document.getElementById('starBtn').style.color=state.editing.star?'var(--pri)':'var(--muted)';
  saveNote(true);
}

function deleteNote(id){
  if(!confirm('Delete this note?'))return;
  state.notes=state.notes.filter(n=>n.id!==id);
  saveState();
  render();
  showToast('Deleted');
}

function updateWords(){
  const b=document.getElementById('edBody').value;
  const w=b.trim().split(/\s+/).filter(x=>x).length;
  const c=b.length;
  document.getElementById('edInfo').textContent=w+' words · '+c+' chars';
}
document.getElementById('edBody').addEventListener('input',updateWords);

function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
init();
</script></body></html>
