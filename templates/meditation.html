<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Meditation</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#041a1a;--card:#0a2e2e;--elev:#124a4a;--text:#ccfbf1;--muted:#5eead4;--sub:#0d9488;--pri:#14b8a6;--blue:#06b6d4;--purple:#a855f7;--grad:linear-gradient(135deg,#14b8a6,#06b6d4);--bdr:rgba(20,184,166,0.25);--glow:0 0 40px rgba(20,184,166,0.4)}
[data-theme="light"]{--bg:#f0fdfa;--card:#fff;--elev:#ccfbf1;--text:#042f2e;--muted:#0f766e;--sub:#5eead4;--bdr:rgba(15,118,110,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 50% 50%,rgba(20,184,166,0.08),transparent 60%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(4,26,26,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(240,253,250,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.main::-webkit-scrollbar{width:0}
.zen-circle{position:relative;width:min(280px,80vw);height:min(280px,80vw);margin:20px 0;display:flex;align-items:center;justify-content:center}
.zen-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--bdr);transition:all 2s}
.zen-ring.r2{inset:20px;border-color:rgba(20,184,166,0.15)}
.zen-ring.r3{inset:40px;border-color:rgba(20,184,166,0.1)}
.zen-ring.r4{inset:60px;border-color:rgba(20,184,166,0.08)}
.zen-core{width:60%;height:60%;border-radius:50%;background:radial-gradient(circle at 40% 40%,var(--elev),var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--glow),inset 0 0 60px rgba(20,184,166,0.15);animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.zen-val{font-size:56px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;font-variant-numeric:tabular-nums}
.zen-lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:2px;font-weight:800;margin-top:6px}
.breathe-hint{font-size:14px;color:var(--muted);font-weight:700;text-align:center;letter-spacing:1px;text-transform:uppercase;height:24px;transition:all .5s}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:400px}
.btn{padding:20px;border-radius:18px;background:var(--elev);color:var(--text);font-size:15px;font-weight:900;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bdr);transition:all .2s}
.btn:active{transform:scale(0.96)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(20,184,166,0.4)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.section-title{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;width:100%;max-width:400px;padding-left:4px;margin-top:8px}
.durations{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:400px}
.dur-btn{padding:14px 6px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;color:var(--text);font-size:14px;font-weight:800;font-family:inherit;transition:all .2s}
.dur-btn:active{transform:scale(0.95)}
.dur-btn.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(20,184,166,0.4)}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;max-width:400px}
.mode-btn{padding:14px 8px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;color:var(--text);font-family:inherit;transition:all .2s;display:flex;flex-direction:column;gap:3px;align-items:center}
.mode-btn:active{transform:scale(0.95)}
.mode-btn.active{background:var(--grad);color:#fff;border-color:transparent}
.mode-emoji{font-size:22px}
.mode-name{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:400px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:14px;text-align:center}
.stat-v{font-size:22px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">🧘</div><span>Meditation</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="zen-circle">
<div class="zen-ring"></div>
<div class="zen-ring r2"></div>
<div class="zen-ring r3"></div>
<div class="zen-ring r4"></div>
<div class="zen-core">
<div class="zen-val" id="timeVal">5:00</div>
<div class="zen-lbl">Remaining</div>
</div>
</div>

<div class="breathe-hint" id="breatheHint">Ready to begin</div>

<div class="controls">
<button class="btn primary" id="mainBtn" onclick="toggle()">
<svg viewBox="0 0 24 24" id="btnIcon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
<span id="btnText">Start</span>
</button>
<button class="btn" onclick="reset()">
<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
Reset
</button>
</div>

<div class="section-title">Duration</div>
<div class="durations">
<button class="dur-btn" data-d="180" onclick="setDuration(180)">3m</button>
<button class="dur-btn active" data-d="300" onclick="setDuration(300)">5m</button>
<button class="dur-btn" data-d="600" onclick="setDuration(600)">10m</button>
<button class="dur-btn" data-d="900" onclick="setDuration(900)">15m</button>
</div>

<div class="section-title">Breathing Mode</div>
<div class="modes">
<button class="mode-btn active" data-m="calm" onclick="setMode('calm')"><span class="mode-emoji">😌</span><span class="mode-name">Calm</span></button>
<button class="mode-btn" data-m="box" onclick="setMode('box')"><span class="mode-emoji">⬜</span><span class="mode-name">Box</span></button>
<button class="mode-btn" data-m="deep" onclick="setMode('deep')"><span class="mode-emoji">💨</span><span class="mode-name">Deep</span></button>
</div>

<div class="stats">
<div class="stat"><div class="stat-v" id="stSessions">0</div><div class="stat-l">Sessions</div></div>
<div class="stat"><div class="stat-v" id="stTotal">0m</div><div class="stat-l">Total Time</div></div>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<script>
const MODES={
calm:{inhale:4,hold1:0,exhale:6,hold2:0,label:'Calm'},
box:{inhale:4,hold1:4,exhale:4,hold2:4,label:'Box'},
deep:{inhale:6,hold1:2,exhale:8,hold2:0,label:'Deep'}
};
let state={theme:'dark',duration:300,remaining:300,mode:'calm',phase:'inhale',phaseTime:0,remainingPhase:0,running:false,interval:null,sessions:0,totalTime:0,completed:false};
let ttm,audioCtx=null;
function init(){loadState();applyTheme();render();}
function loadState(){try{const s=localStorage.getItem('med_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.duration=p.duration||300;state.mode=p.mode||'calm';state.sessions=p.sessions||0;state.totalTime=p.totalTime||0;}}catch(e){}state.remaining=state.duration;}
function saveState(){try{localStorage.setItem('med_v1',JSON.stringify({theme:state.theme,duration:state.duration,mode:state.mode,sessions:state.sessions,totalTime:state.totalTime}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function setDuration(sec){
  if(state.running)stop();
  state.duration=sec;state.remaining=sec;state.completed=false;
  document.querySelectorAll('.dur-btn').forEach(b=>b.classList.toggle('active',+b.dataset.d===sec));
  render();saveState();
}
function setMode(m){
  state.mode=m;state.phase='inhale';state.remainingPhase=MODES[m].inhale;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.m===m));
  renderMode();saveState();
}
function toggle(){if(state.running)stop();else start();}

function start(){
  if(state.completed){state.remaining=state.duration;state.completed=false;}
  state.running=true;
  document.getElementById('btnText').textContent='Pause';
  document.getElementById('btnIcon').innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  state.remainingPhase=MODES[state.mode].inhale;state.phase='inhale';
  if(state.interval)clearInterval(state.interval);
  state.interval=setInterval(tick,1000);
  playTone(432,0.3);
}

function stop(){
  state.running=false;
  if(state.interval)clearInterval(state.interval);
  state.interval=null;
  document.getElementById('btnText').textContent=state.completed?'Restart':'Start';
  document.getElementById('btnIcon').innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
  document.getElementById('breatheHint').textContent='Paused';
}

function reset(){
  stop();
  state.remaining=state.duration;state.completed=false;
  state.phase='inhale';state.remainingPhase=MODES[state.mode].inhale;
  render();showToast('Reset');
}

function tick(){
  state.remaining--;
  state.remainingPhase--;
  if(state.remaining<=0){finish();return;}
  if(state.remainingPhase<=0){
    const m=MODES[state.mode];
    if(state.phase==='inhale'){
      if(m.hold1>0){state.phase='hold1';state.remainingPhase=m.hold1;}
      else{state.phase='exhale';state.remainingPhase=m.exhale;}
    }else if(state.phase==='hold1'){state.phase='exhale';state.remainingPhase=m.exhale;}
    else if(state.phase==='exhale'){
      if(m.hold2>0){state.phase='hold2';state.remainingPhase=m.hold2;}
      else{state.phase='inhale';state.remainingPhase=m.inhale;}
    }else{state.phase='inhale';state.remainingPhase=m.inhale;}
    playTone(432,0.15);
    if(navigator.vibrate)navigator.vibrate(50);
  }
  render();renderMode();
}

function render(){
  const m=Math.floor(state.remaining/60);const s=state.remaining%60;
  document.getElementById('timeVal').textContent=m+':'+String(s).padStart(2,'0');
  document.getElementById('stSessions').textContent=state.sessions;
  document.getElementById('stTotal').textContent=Math.round(state.totalTime/60)+'m';
}

function renderMode(){
  if(!state.running)return;
  const labels={inhale:'Breathe In',hold1:'Hold',exhale:'Breathe Out',hold2:'Hold'};
  const hint=document.getElementById('breatheHint');
  hint.textContent=labels[state.phase];
  hint.style.opacity=state.phase==='inhale'||state.phase==='exhale'?'1':'0.7';
}

function finish(){
  stop();
  state.completed=true;
  state.sessions++;
  state.totalTime+=state.duration;
  saveState();
  playTone(528,0.5);
  setTimeout(()=>playTone(660,0.5),300);
  setTimeout(()=>playTone(784,0.8),600);
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);
  document.getElementById('breatheHint').textContent='🎉 Complete!';
  showToast('Meditation complete');
  render();
}

function playTone(freq,dur){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(0.1,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
init();
</script></body></html>
