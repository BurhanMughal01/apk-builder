<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Spelling Bee</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#1a1204;--card:#2d1f08;--elev:#4a320d;--text:#fef3c7;--muted:#fcd34d;--sub:#a16207;--pri:#fbbf24;--orange:#f97316;--red:#ef4444;--green:#10b981;--grad:linear-gradient(135deg,#fbbf24,#f59e0b);--bdr:rgba(251,191,36,0.25);--glow:0 0 30px rgba(251,191,36,0.4)}
[data-theme="light"]{--bg:#fffbeb;--card:#fff;--elev:#fef3c7;--text:#451a03;--muted:#92400e;--sub:#fbbf24;--bdr:rgba(180,83,9,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(251,191,36,0.1),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(26,18,4,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(255,251,235,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.main::-webkit-scrollbar{width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:440px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px;text-align:center}
.stat-v{font-size:22px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.diff-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:5px;width:100%;max-width:440px}
.diff-btn{padding:11px;border-radius:10px;font-size:12px;font-weight:800;color:var(--muted);text-align:center;transition:all .2s}
.diff-btn.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(251,191,36,0.4)}
.question-card{background:linear-gradient(135deg,rgba(251,191,36,0.2),rgba(249,115,22,0.1));border:1px solid var(--bdr);border-radius:24px;padding:24px;width:100%;max-width:440px;text-align:center;box-shadow:var(--glow);position:relative}
.q-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:2px;font-weight:800;margin-bottom:12px}
.q-word{font-size:20px;font-weight:800;color:var(--text);margin-bottom:16px;line-height:1.5}
.play-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--grad);color:#fff;border-radius:50px;font-size:14px;font-weight:800;font-family:inherit;box-shadow:0 4px 14px rgba(251,191,36,0.4)}
.play-btn:active{transform:scale(0.95)}
.play-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.hint-text{font-size:12px;color:var(--sub);margin-top:12px;font-style:italic}
.answer-section{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.inp-letter{width:100%;padding:20px;background:var(--card);border:2px solid var(--bdr);border-radius:16px;color:var(--text);font-size:28px;font-weight:900;text-align:center;letter-spacing:8px;text-transform:uppercase;transition:all .2s}
.inp-letter:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(251,191,36,0.15)}
.inp-letter.correct{border-color:var(--green);background:rgba(16,185,129,0.15);color:var(--green)}
.inp-letter.wrong{border-color:var(--red);background:rgba(239,68,68,0.15);color:var(--red);animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.btn{padding:16px;border-radius:14px;background:var(--elev);color:var(--text);font-size:14px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bdr);transition:all .2s}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(251,191,36,0.4)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.feedback{font-size:16px;font-weight:900;text-align:center;height:24px;margin-top:6px}
.feedback.ok{color:var(--green)}
.feedback.no{color:var(--red)}
.progress-row{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:700;padding:0 4px}
.progress-bar{width:100%;max-width:440px;height:6px;background:var(--card);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--grad);border-radius:3px;transition:width .3s;box-shadow:0 0 12px rgba(251,191,36,0.6)}
.overlay{position:fixed;inset:0;background:rgba(26,18,4,0.9);backdrop-filter:blur(10px);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.overlay.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ov-emoji{font-size:80px;margin-bottom:16px;animation:bounce 0.6s}
@keyframes bounce{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.ov-title{font-size:32px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.ov-sub{font-size:15px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.ov-btn{padding:16px 40px;border-radius:14px;background:var(--grad);color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 20px rgba(251,191,36,0.4)}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">🐝</div><span>Spelling Bee</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="stats">
<div class="stat"><div class="stat-v" id="stScore">0</div><div class="stat-l">Score</div></div>
<div class="stat"><div class="stat-v" id="stStreak">0</div><div class="stat-l">Streak</div></div>
<div class="stat"><div class="stat-v" id="stBest">0</div><div class="stat-l">Best</div></div>
</div>

<div class="diff-row">
<button class="diff-btn active" id="dE" onclick="setDiff('easy')">😊 Easy</button>
<button class="diff-btn" id="dM" onclick="setDiff('medium')">😎 Medium</button>
<button class="diff-btn" id="dH" onclick="setDiff('hard')">🔥 Hard</button>
</div>

<div class="progress-row"><span id="progText">Word 1 / 10</span><span id="progCount">0 correct</span></div>
<div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>

<div class="question-card">
<div class="q-label">Spell this word</div>
<div class="q-word" id="qHint">Listen and spell</div>
<button class="play-btn" onclick="playWord()">
<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
Hear Word
</button>
<div class="hint-text" id="qMeaning"></div>
</div>

<div class="answer-section">
<input type="text" class="inp-letter" id="answerInput" placeholder="Type here" autocapitalize="characters" autocomplete="off" spellcheck="false" oninput="onInput(this)">
<button class="btn primary" onclick="checkAnswer()" style="width:100%"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Check</button>
</div>

<div class="feedback" id="feedback"></div>

<div class="actions">
<button class="btn" onclick="skipWord()"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>Skip</button>
<button class="btn" onclick="resetAll()"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Reset</button>
</div>
</main>

<div class="overlay" id="overlay">
<div class="ov-emoji">🎉</div>
<div class="ov-title">Perfect!</div>
<div class="ov-sub" id="ovSub"></div>
<button class="ov-btn" onclick="closeOverlay()">Play Again</button>
</div>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<script>
const WORDS={
easy:[{w:'CAT',m:'A small furry pet'},{w:'DOG',m:'A loyal pet animal'},{w:'SUN',m:'Bright in the sky'},{w:'BED',m:'Where you sleep'},{w:'RED',m:'Color of blood'},{w:'BOOK',m:'You read it'},{w:'TREE',m:'Tall plant'},{w:'FISH',m:'Lives in water'},{w:'MILK',m:'White drink'},{w:'MOON',m:'Shines at night'},{w:'STAR',m:'Shines at night'},{w:'BALL',m:'Round toy'},{w:'CAKE',m:'Sweet dessert'},{w:'BIRD',m:'Flies in sky'},{w:'HOME',m:'Where you live'}],
medium:[{w:'APPLE',m:'Red or green fruit'},{w:'HOUSE',m:'Where people live'},{w:'WATER',m:'You drink it'},{w:'HAPPY',m:'Feeling joy'},{w:'SCHOOL',m:'Place to learn'},{w:'FRIEND',m:'Person you like'},{w:'FAMILY',m:'Parents and kids'},{w:'MOTHER',m:'Female parent'},{w:'FLOWER',m:'Blooms in garden'},{w:'ORANGE',m:'Citrus fruit'},{w:'YELLOW',m:'Color of sun'},{w:'PENCIL',m:'Writing tool'},{w:'GARDEN',m:'Place with plants'},{w:'SUMMER',m:'Warm season'},{w:'WINTER',m:'Cold season'}],
hard:[{w:'BEAUTIFUL',m:'Very pretty'},{w:'KNOWLEDGE',m:'What you learn'},{w:'ADVENTURE',m:'Exciting journey'},{w:'CHOCOLATE',m:'Sweet brown treat'},{w:'ELEPHANT',m:'Large gray animal'},{w:'BUTTERFLY',m:'Colorful insect'},{w:'MOUNTAIN',m:'Tall landform'},{w:'TREASURE',m:'Hidden gold'},{w:'UNIVERSE',m:'All of space'},{w:'VACATION',m:'Time off work'},{w:'RESTAURANT',m:'Place to eat'},{w:'COMPUTER',m:'Electronic machine'},{w:'HOSPITAL',m:'Place for sick'},{w:'BIRTHDAY',m:'Day you were born'},{w:'SANDWICH',m:'Food between bread'}]
};
let state={theme:'dark',diff:'easy',score:0,streak:0,best:0,current:null,answered:false,wordCount:0,totalWords:0};
let ttm,audioCtx=null;
function init(){loadState();applyTheme();nextWord();}
function loadState(){try{const s=localStorage.getItem('spb_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.diff=p.diff||'easy';state.best=p.best||0;}}catch(e){}}
function saveState(){try{localStorage.setItem('spb_v1',JSON.stringify({theme:state.theme,diff:state.diff,best:state.best}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function setDiff(d){
  state.diff=d;
  ['E','M','H'].forEach(x=>document.getElementById('d'+x).classList.remove('active'));
  const map={easy:'E',medium:'M',hard:'H'};
  document.getElementById('d'+map[d]).classList.add('active');
  state.score=0;state.streak=0;state.wordCount=0;
  saveState();nextWord();updateStats();
}

function nextWord(){
  const pool=WORDS[state.diff];
  state.current=pool[Math.floor(Math.random()*pool.length)];
  state.answered=false;
  state.wordCount++;
  const inp=document.getElementById('answerInput');
  inp.value='';
  inp.className='inp-letter';
  inp.disabled=false;
  document.getElementById('qHint').textContent='Listen and spell';
  document.getElementById('qMeaning').textContent='Hint: '+state.current.m;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  updateProgress();
  setTimeout(playWord,300);
  inp.focus();
}

function playWord(){
  if(!state.current)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=660;o.type='sine';
    g.gain.setValueAtTime(0.1,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);
    o.start();o.stop(audioCtx.currentTime+0.15);
  }catch(e){}
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(state.current.w);
    u.rate=0.7;u.pitch=1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }
}

function onInput(el){el.value=el.value.toUpperCase();el.classList.remove('correct','wrong');}

function checkAnswer(){
  if(state.answered)return;
  const inp=document.getElementById('answerInput');
  const val=inp.value.trim().toUpperCase();
  if(!val){showToast('Type a word');return;}
  state.answered=true;
  state.totalWords++;
  if(val===state.current.w){
    inp.classList.add('correct');
    state.score+=10;
    state.streak++;
    if(state.streak>state.best){state.best=state.streak;saveState();}
    document.getElementById('feedback').textContent='✓ Correct! +10';
    document.getElementById('feedback').className='feedback ok';
    if(navigator.vibrate)navigator.vibrate(30);
    if(state.streak>0&&state.streak%5===0)showOverlay();
    setTimeout(nextWord,1200);
  }else{
    inp.classList.add('wrong');
    state.streak=0;
    document.getElementById('feedback').textContent='✗ Correct: '+state.current.w;
    document.getElementById('feedback').className='feedback no';
    if(navigator.vibrate)navigator.vibrate([50,30,50]);
    setTimeout(nextWord,2000);
  }
  updateStats();updateProgress();
}

function skipWord(){
  if(state.answered)return;
  state.answered=true;
  state.streak=0;
  updateStats();
  showToast('Skipped: '+state.current.w);
  setTimeout(nextWord,800);
}

function updateStats(){
  document.getElementById('stScore').textContent=state.score;
  document.getElementById('stStreak').textContent=state.streak;
  document.getElementById('stBest').textContent=state.best;
}
function updateProgress(){
  const pct=Math.min((state.wordCount%10)*10,100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progText').textContent='Word '+state.wordCount;
  document.getElementById('progCount').textContent=state.streak+' streak';
}

function resetAll(){
  if(!confirm('Reset all scores?'))return;
  state.score=0;state.streak=0;state.wordCount=0;state.totalWords=0;
  saveState();updateStats();nextWord();showToast('Reset');
}

function showOverlay(){
  document.getElementById('ovSub').textContent='You got '+state.streak+' in a row!';
  document.getElementById('overlay').classList.add('show');
  if(navigator.vibrate)navigator.vibrate([100,50,100,50,200]);
}
function closeOverlay(){document.getElementById('overlay').classList.remove('show');}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
