<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Math Practice</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#0a1a0a;--card:#0f2916;--elev:#1a4a26;--text:#dcfce7;--muted:#86efac;--sub:#16a34a;--pri:#22c55e;--orange:#f97316;--red:#ef4444;--gold:#fbbf24;--grad:linear-gradient(135deg,#22c55e,#16a34a);--bdr:rgba(34,197,94,0.25);--glow:0 0 30px rgba(34,197,94,0.4)}
[data-theme="light"]{--bg:#f0fdf4;--card:#fff;--elev:#dcfce7;--text:#052e16;--muted:#15803d;--sub:#86efac;--bdr:rgba(22,163,74,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(34,197,94,0.1),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,26,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(240,253,244,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.main::-webkit-scrollbar{width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:440px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px;text-align:center}
.stat-v{font-size:22px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.diff-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:5px;width:100%;max-width:440px}
.diff-btn{padding:11px;border-radius:10px;font-size:12px;font-weight:800;color:var(--muted);text-align:center;transition:all .2s}
.diff-btn.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(34,197,94,0.4)}
.cat-row{display:flex;gap:6px;overflow-x:auto;width:100%;max-width:440px;scrollbar-width:none;padding:4px 0}
.cat-row::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bdr);color:var(--muted);font-size:12px;font-weight:700;transition:all .2s}
.cat-chip.active{background:var(--grad);color:#fff;border-color:transparent}
.question-card{background:linear-gradient(135deg,rgba(34,197,94,0.15),rgba(22,163,74,0.08));border:1px solid var(--bdr);border-radius:24px;padding:32px 20px;text-align:center;width:100%;max-width:440px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--glow);position:relative}
.q-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:2px;font-weight:800;margin-bottom:12px}
.q-text{font-size:48px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.answer{padding:22px 12px;background:var(--card);border:2px solid var(--bdr);border-radius:18px;color:var(--text);font-size:22px;font-weight:900;font-family:inherit;transition:all .2s;font-variant-numeric:tabular-nums}
.answer:active{transform:scale(0.96)}
.answer:disabled{cursor:default}
.answer.correct{background:linear-gradient(135deg,rgba(16,185,129,0.25),rgba(16,185,129,0.1));border-color:#10b981;color:#10b981;animation:popCorrect .4s}
.answer.wrong{background:linear-gradient(135deg,rgba(239,68,68,0.25),rgba(239,68,68,0.1));border-color:#ef4444;color:#ef4444;animation:shakeWrong .4s}
@keyframes popCorrect{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shakeWrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{font-size:18px;font-weight:900;text-align:center;height:24px;transition:all .3s}
.feedback.ok{color:#10b981}
.feedback.no{color:#ef4444}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.btn{padding:14px;border-radius:14px;background:var(--elev);color:var(--text);font-size:13px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bdr)}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(34,197,94,0.4)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;background:rgba(10,26,10,0.9);backdrop-filter:blur(10px);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.overlay.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ov-emoji{font-size:80px;margin-bottom:16px;animation:bounce 0.6s}
@keyframes bounce{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.ov-title{font-size:32px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.ov-sub{font-size:15px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.ov-btn{padding:16px 40px;border-radius:14px;background:var(--grad);color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 20px rgba(34,197,94,0.4)}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">🔢</div><span>Math Practice</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="stats">
<div class="stat"><div class="stat-v" id="stScore">0</div><div class="stat-l">Score</div></div>
<div class="stat"><div class="stat-v" id="stStreak">0</div><div class="stat-l">Streak</div></div>
<div class="stat"><div class="stat-v" id="stBest">0</div><div class="stat-l">Best</div></div>
</div>

<div class="diff-row">
<button class="diff-btn active" id="dE" onclick="setDiff('easy')">😊 Easy</button>
<button class="diff-btn" id="dM" onclick="setDiff('medium')">😎 Medium</button>
<button class="diff-btn" id="dH" onclick="setDiff('hard')">🔥 Hard</button>
</div>

<div class="cat-row" id="catRow">
<button class="cat-chip active" data-c="add" onclick="setCat('add')">➕ Add</button>
<button class="cat-chip" data-c="sub" onclick="setCat('sub')">➖ Subtract</button>
<button class="cat-chip" data-c="mul" onclick="setCat('mul')">✖️ Multiply</button>
<button class="cat-chip" data-c="div" onclick="setCat('div')">➗ Divide</button>
<button class="cat-chip" data-c="mix" onclick="setCat('mix')">🎲 Mixed</button>
</div>

<div class="question-card">
<div class="q-label">Solve</div>
<div class="q-text" id="qText">7 + 3</div>
</div>

<div class="feedback" id="feedback"></div>

<div class="answers" id="answers"></div>

<div class="actions">
<button class="btn primary" onclick="nextQuestion()"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Skip</button>
<button class="btn" onclick="resetScore()"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Reset</button>
</div>
</main>

<div class="overlay" id="overlay">
<div class="ov-emoji">🎉</div>
<div class="ov-title">Perfect!</div>
<div class="ov-sub" id="ovSub"></div>
<button class="ov-btn" onclick="closeOverlay()">Keep Playing</button>
</div>

<div class="tt" id="toast"><span id="tt-txt">Correct!</span></div>

<script>
let state={theme:'dark',diff:'easy',cat:'add',score:0,streak:0,best:0,correct:0,total:0,q:null,answered:false};
let ttm;
function init(){loadState();applyTheme();nextQuestion();}
function loadState(){try{const s=localStorage.getItem('mp_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.diff=p.diff||'easy';state.cat=p.cat||'add';state.best=p.best||0;}}catch(e){}updateStats();}
function saveState(){try{localStorage.setItem('mp_v1',JSON.stringify({theme:state.theme,diff:state.diff,cat:state.cat,best:state.best}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function setDiff(d){
  state.diff=d;
  ['E','M','H'].forEach(x=>document.getElementById('d'+x).classList.remove('active'));
  const map={easy:'E',medium:'M',hard:'H'};
  document.getElementById('d'+map[d]).classList.add('active');
  saveState();nextQuestion();
}
function setCat(c){
  state.cat=c;
  document.querySelectorAll('.cat-chip').forEach(b=>b.classList.toggle('active',b.dataset.c===c));
  saveState();nextQuestion();
}

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function generateQ(){
  const d=state.diff;
  const ranges={easy:{a:[1,10],b:[1,10]},medium:{a:[10,50],b:[10,30]},hard:{a:[50,200],b:[20,100]}};
  const R=ranges[d];
  let a=rand(R.a[0],R.a[1]);
  let b=rand(R.b[0],R.b[1]);
  let cat=state.cat;
  if(cat==='mix')cat=['add','sub','mul','div'][rand(0,3)];
  let question,answer;
  switch(cat){
    case 'add':question=a+' + '+b;answer=a+b;break;
    case 'sub':
      if(a<b){const t=a;a=b;b=t;}
      question=a+' − '+b;answer=a-b;break;
    case 'mul':
      if(d==='easy'){a=rand(1,10);b=rand(1,10);}
      else if(d==='medium'){a=rand(2,15);b=rand(2,15);}
      else{a=rand(5,25);b=rand(5,25);}
      question=a+' × '+b;answer=a*b;break;
    case 'div':
      if(d==='easy'){b=rand(2,10);answer=rand(2,10);}
      else if(d==='medium'){b=rand(2,12);answer=rand(2,15);}
      else{b=rand(3,15);answer=rand(5,20);}
      a=b*answer;
      question=a+' ÷ '+b;break;
  }
  // Generate wrong answers
  const opts=new Set();
  opts.add(answer);
  while(opts.size<4){
    const off=rand(1,Math.max(3,Math.floor(Math.abs(answer)*0.2)));
    const wrong=Math.random()<0.5?answer+off:answer-off;
    if(wrong!==answer&&!opts.has(wrong)&&wrong>=0)opts.add(wrong);
  }
  const options=[...opts].sort(()=>Math.random()-0.5);
  return {question,answer,options};
}

function nextQuestion(){
  state.q=generateQ();
  state.answered=false;
  document.getElementById('qText').textContent=state.q.question;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  const el=document.getElementById('answers');
  el.innerHTML=state.q.options.map(o=>'<button class="answer" onclick="checkAnswer('+o+',this)">'+o+'</button>').join('');
}

function checkAnswer(val,btn){
  if(state.answered)return;
  state.answered=true;
  const all=document.querySelectorAll('.answer');
  all.forEach(b=>b.disabled=true);
  if(val===state.q.answer){
    btn.classList.add('correct');
    state.score+=10;
    state.streak++;
    state.correct++;
    if(state.streak>state.best){state.best=state.streak;saveState();}
    document.getElementById('feedback').textContent='✓ Correct! +10';
    document.getElementById('feedback').className='feedback ok';
    if(navigator.vibrate)navigator.vibrate(30);
    if(state.streak>0&&state.streak%10===0)showOverlay();
  }else{
    btn.classList.add('wrong');
    state.streak=0;
    all.forEach(b=>{if(parseInt(b.textContent)===state.q.answer)b.classList.add('correct');});
    document.getElementById('feedback').textContent='✗ Wrong! Answer: '+state.q.answer;
    document.getElementById('feedback').className='feedback no';
    if(navigator.vibrate)navigator.vibrate([50,30,50]);
  }
  state.total++;
  updateStats();
  setTimeout(()=>{if(!state.answered||state.answered)nextQuestion();},1200);
}

function updateStats(){
  document.getElementById('stScore').textContent=state.score;
  document.getElementById('stStreak').textContent=state.streak;
  document.getElementById('stBest').textContent=state.best;
}

function resetScore(){
  if(!confirm('Reset score and streak?'))return;
  state.score=0;state.streak=0;state.correct=0;state.total=0;
  updateStats();nextQuestion();showToast('Reset');
}

function showOverlay(){
  document.getElementById('ovSub').textContent='You got '+state.streak+' in a row!';
  document.getElementById('overlay').classList.add('show');
  if(navigator.vibrate)navigator.vibrate([100,50,100,50,200]);
}
function closeOverlay(){document.getElementById('overlay').classList.remove('show');}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
