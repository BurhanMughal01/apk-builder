<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Business Card</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet"><style>
:root{--bg:#0a0a0a;--card:#1a1a1a;--elev:#2a2a2a;--text:#f5f5f5;--muted:#a3a3a3;--sub:#737373;--pri:#d4af37;--gold:#fbbf24;--grad:linear-gradient(135deg,#d4af37,#b8941f);--bdr:rgba(212,175,55,0.25);--glow:0 0 30px rgba(212,175,55,0.4)}
[data-theme="light"]{--bg:#fafaf9;--card:#fff;--elev:#f5f5f4;--text:#0a0a0a;--muted:#525252;--sub:#a3a3a3;--bdr:rgba(212,175,55,0.3)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(212,175,55,0.06),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,10,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(250,250,249,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.main::-webkit-scrollbar{width:0}
.preview{width:100%;max-width:400px;aspect-ratio:1.75;perspective:1000px;cursor:pointer;position:relative}
.card{width:100%;height:100%;position:absolute;transform-style:preserve-3d;transition:transform .8s cubic-bezier(0.4,0,0.2,1);border-radius:20px}
.preview.flipped .card{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
.front{background:linear-gradient(135deg,#0a0a0a,#1a1a1a);padding:24px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--bdr);position:relative}
.front::before{content:'';position:absolute;top:-50%;right:-30%;width:100%;height:200%;background:radial-gradient(circle,rgba(212,175,55,0.15),transparent 60%);pointer-events:none}
.bc-logo{width:52px;height:52px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:26px;font-weight:900;color:#0a0a0a;font-family:'Playfair Display',serif;box-shadow:var(--glow);position:relative;z-index:1}
.bc-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.2;position:relative;z-index:1}
.bc-title{font-size:12px;color:var(--pri);font-weight:700;letter-spacing:2px;text-transform:uppercase;position:relative;z-index:1}
.bc-divider{width:40px;height:2px;background:var(--grad);border-radius:2px;margin:12px 0;position:relative;z-index:1}
.bc-company{font-size:14px;color:var(--muted);font-weight:600;position:relative;z-index:1}
.bc-tagline{font-size:11px;color:var(--sub);font-style:italic;position:relative;z-index:1;margin-top:4px}
.back{background:linear-gradient(135deg,#1a1a1a,#0a0a0a);padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;border:1px solid var(--bdr);transform:rotateY(180deg);position:relative}
.back::before{content:'';position:absolute;top:-50%;left:-30%;width:100%;height:200%;background:radial-gradient(circle,rgba(212,175,55,0.1),transparent 60%);pointer-events:none}
.contact-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.contact-icon{width:36px;height:36px;border-radius:10px;background:rgba(212,175,55,0.15);border:1px solid var(--bdr);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.contact-info{flex:1;min-width:0}
.contact-label{font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:2px}
.contact-val{font-size:13px;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flip-hint{position:absolute;bottom:8px;right:12px;font-size:10px;color:var(--sub);font-weight:700;letter-spacing:1px;z-index:2}
.flip-hint-front{position:absolute;bottom:8px;right:12px;font-size:10px;color:var(--sub);font-weight:700;letter-spacing:1px;z-index:2}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:5px;width:100%;max-width:400px}
.tab{padding:11px;border-radius:10px;font-size:12px;font-weight:800;color:var(--muted);text-align:center;transition:all .2s}
.tab.active{background:var(--grad);color:#0a0a0a;box-shadow:0 4px 12px rgba(212,175,55,0.3)}
.form-section{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--pri);font-weight:800;margin-bottom:6px}
.inp{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--bdr);border-radius:10px;color:var(--text);font-size:13px;font-weight:600;margin-bottom:12px}
.inp:focus{border-color:var(--pri)}
textarea.inp{resize:none;min-height:60px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-2 .inp{margin-bottom:12px}
.icons-row{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px}
.icon-pick{aspect-ratio:1;border-radius:10px;background:var(--elev);border:1px solid var(--bdr);display:grid;place-items:center;font-size:18px;transition:all .2s}
.icon-pick.active{background:var(--grad);border-color:transparent;transform:scale(1.08)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px}
.btn{padding:14px;border-radius:12px;background:var(--elev);color:var(--text);font-size:13px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bdr)}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--grad);color:#0a0a0a;border-color:transparent;box-shadow:0 4px 14px rgba(212,175,55,0.4)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">💼</div><span>Business Card</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="preview" id="preview" onclick="flip()">
<div class="card">
<div class="face front">
<div class="bc-logo" id="pvLogo">B</div>
<div>
<div class="bc-name" id="pvName">Your Name</div>
<div class="bc-title" id="pvTitle">Job Title</div>
<div class="bc-divider"></div>
<div class="bc-company" id="pvCompany">Company Name</div>
<div class="bc-tagline" id="pvTagline">Your tagline here</div>
</div>
<div class="flip-hint-front">TAP TO FLIP →</div>
</div>
<div class="face back">
<div class="contact-row"><div class="contact-icon">📱</div><div class="contact-info"><div class="contact-label">Phone</div><div class="contact-val" id="pvPhone">+92 300 0000000</div></div></div>
<div class="contact-row"><div class="contact-icon">✉️</div><div class="contact-info"><div class="contact-label">Email</div><div class="contact-val" id="pvEmail">you@email.com</div></div></div>
<div class="contact-row"><div class="contact-icon">🌐</div><div class="contact-info"><div class="contact-label">Website</div><div class="contact-val" id="pvWeb">www.yoursite.com</div></div></div>
<div class="contact-row"><div class="contact-icon">📍</div><div class="contact-info"><div class="contact-label">Address</div><div class="contact-val" id="pvAddr">City, Country</div></div></div>
<div class="flip-hint">← TAP TO FLIP</div>
</div>
</div>
</div>

<div class="tabs">
<button class="tab active" data-t="front" onclick="setTab('front')">👤 Front</button>
<button class="tab" data-t="back" onclick="setTab('back')">📞 Back</button>
</div>

<div class="form-section" id="formFront">
<div class="lbl">Initial</div>
<input type="text" class="inp" id="inLogo" maxlength="2" placeholder="B" value="B" oninput="update()">
<div class="lbl">Full Name</div>
<input type="text" class="inp" id="inName" placeholder="Your Name" oninput="update()">
<div class="lbl">Job Title</div>
<input type="text" class="inp" id="inTitle" placeholder="CEO / Designer / Developer" oninput="update()">
<div class="lbl">Company</div>
<input type="text" class="inp" id="inCompany" placeholder="Company Name" oninput="update()">
<div class="lbl">Tagline (optional)</div>
<input type="text" class="inp" id="inTagline" placeholder="Making ideas happen" oninput="update()">
</div>

<div class="form-section" id="formBack" style="display:none">
<div class="lbl">Phone</div>
<input type="tel" class="inp" id="inPhone" placeholder="+92 300 0000000" oninput="update()">
<div class="lbl">Email</div>
<input type="email" class="inp" id="inEmail" placeholder="you@email.com" oninput="update()">
<div class="lbl">Website</div>
<input type="url" class="inp" id="inWeb" placeholder="www.yoursite.com" oninput="update()">
<div class="lbl">Address</div>
<input type="text" class="inp" id="inAddr" placeholder="City, Country" oninput="update()">
</div>

<div class="actions">
<button class="btn primary" onclick="shareCard()"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>Share Card</button>
<button class="btn" onclick="copyCard()"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy Text</button>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Saved</span></div>

<script>
let state={theme:'dark',data:{logo:'B',name:'',title:'',company:'',tagline:'',phone:'',email:'',web:'',addr:''}};
let ttm;
function init(){loadState();applyTheme();renderInputs();update();}
function loadState(){try{const s=localStorage.getItem('biz_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.data=Object.assign(state.data,p.data||{});}}catch(e){}}
function saveState(){try{localStorage.setItem('biz_v1',JSON.stringify({theme:state.theme,data:state.data}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function renderInputs(){
  const d=state.data;
  document.getElementById('inLogo').value=d.logo||'';
  document.getElementById('inName').value=d.name||'';
  document.getElementById('inTitle').value=d.title||'';
  document.getElementById('inCompany').value=d.company||'';
  document.getElementById('inTagline').value=d.tagline||'';
  document.getElementById('inPhone').value=d.phone||'';
  document.getElementById('inEmail').value=d.email||'';
  document.getElementById('inWeb').value=d.web||'';
  document.getElementById('inAddr').value=d.addr||'';
}

function setTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  document.getElementById('formFront').style.display=t==='front'?'block':'none';
  document.getElementById('formBack').style.display=t==='back'?'block':'none';
}

function update(){
  const d=state.data;
  d.logo=document.getElementById('inLogo').value||'B';
  d.name=document.getElementById('inName').value.trim();
  d.title=document.getElementById('inTitle').value.trim();
  d.company=document.getElementById('inCompany').value.trim();
  d.tagline=document.getElementById('inTagline').value.trim();
  d.phone=document.getElementById('inPhone').value.trim();
  d.email=document.getElementById('inEmail').value.trim();
  d.web=document.getElementById('inWeb').value.trim();
  d.addr=document.getElementById('inAddr').value.trim();
  document.getElementById('pvLogo').textContent=d.logo;
  document.getElementById('pvName').textContent=d.name||'Your Name';
  document.getElementById('pvTitle').textContent=d.title||'Job Title';
  document.getElementById('pvCompany').textContent=d.company||'Company Name';
  document.getElementById('pvTagline').textContent=d.tagline||'Your tagline here';
  document.getElementById('pvPhone').textContent=d.phone||'+92 300 0000000';
  document.getElementById('pvEmail').textContent=d.email||'you@email.com';
  document.getElementById('pvWeb').textContent=d.web||'www.yoursite.com';
  document.getElementById('pvAddr').textContent=d.addr||'City, Country';
  saveState();
}

function flip(){document.getElementById('preview').classList.toggle('flipped');if(navigator.vibrate)navigator.vibrate(15);}

function buildText(){
  const d=state.data;
  let txt='';
  if(d.name)txt+=d.name+'\n';
  if(d.title)txt+=d.title+'\n';
  if(d.company)txt+='\n'+d.company+'\n';
  if(d.tagline)txt+=d.tagline+'\n';
  txt+='\n— Contact —\n';
  if(d.phone)txt+='📱 '+d.phone+'\n';
  if(d.email)txt+='✉️ '+d.email+'\n';
  if(d.web)txt+='🌐 '+d.web+'\n';
  if(d.addr)txt+='📍 '+d.addr+'\n';
  return txt.trim();
}

function copyCard(){
  const txt=buildText();
  if(!txt){showToast('Fill details first');return;}
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>showToast('Copied'));}
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('Copied');}catch(e){}document.body.removeChild(ta);}
}
function shareCard(){
  const txt=buildText();
  if(!txt){showToast('Fill details first');return;}
  if(navigator.share){navigator.share({title:state.data.name||'Business Card',text:txt}).catch(()=>{});}
  else copyCard();
}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
