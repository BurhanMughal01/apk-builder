<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Workout Timer</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#1a0505;--card:#2a0a0a;--elev:#3d1010;--text:#fee2e2;--muted:#fca5a5;--sub:#b91c1c;--pri:#ef4444;--orange:#f97316;--green:#10b981;--grad:linear-gradient(135deg,#ef4444,#f97316);--bdr:rgba(239,68,68,0.25);--glow:0 0 30px rgba(239,68,68,0.4)}
[data-theme="light"]{--bg:#fef2f2;--card:#fff;--elev:#fee2e2;--text:#450a0a;--muted:#991b1b;--sub:#dc2626;--bdr:rgba(220,38,38,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(239,68,68,0.1),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(26,5,5,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(254,242,242,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.main::-webkit-scrollbar{width:0}
.phase-badge{padding:6px 18px;border-radius:20px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:2px;background:var(--elev);color:var(--muted);transition:all .3s}
.phase-badge.work{background:linear-gradient(135deg,rgba(239,68,68,0.3),rgba(249,115,22,0.2));color:#fca5a5;box-shadow:0 0 20px rgba(239,68,68,0.4)}
.phase-badge.rest{background:linear-gradient(135deg,rgba(16,185,129,0.3),rgba(6,182,212,0.2));color:#6ee7b7;box-shadow:0 0 20px rgba(16,185,129,0.4)}
.timer-wrap{position:relative;width:min(300px,86vw);height:min(300px,86vw);margin:10px 0}
.timer-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer-bg{fill:none;stroke:var(--card);stroke-width:14}
.timer-fill{fill:none;stroke:url(#gW);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .3s linear;filter:drop-shadow(0 0 12px rgba(239,68,68,0.6))}
.timer-inner{position:absolute;inset:24px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--elev),var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 40px rgba(239,68,68,0.2)}
.timer-val{font-size:76px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.timer-lbl{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:2px;font-weight:800}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:400px}
.btn{padding:20px;border-radius:18px;background:var(--elev);color:var(--text);font-size:15px;font-weight:900;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bdr);transition:all .2s}
.btn:active{transform:scale(0.96)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(239,68,68,0.4)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.presets-title{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;width:100%;max-width:400px;padding-left:4px;margin-top:8px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px}
.preset{padding:14px;border-radius:14px;background:var(--card);color:var(--text);font-size:14px;font-weight:800;font-family:inherit;border:1px solid var(--bdr);display:flex;flex-direction:column;gap:2px;align-items:center;transition:all .2s}
.preset:active{transform:scale(0.96);border-color:var(--pri)}
.preset.active{background:var(--grad);color:#fff;border-color:transparent}
.preset-name{font-size:13px;font-weight:800}
.preset-detail{font-size:10px;color:var(--sub);font-weight:600}
.preset.active .preset-detail{color:rgba(255,255,255,0.85)}
.custom-section{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:14px}
.cs-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cs-row:last-child{margin-bottom:0}
.cs-lbl{font-size:12px;color:var(--sub);font-weight:700;width:80px;flex-shrink:0}
.cs-input{flex:1;padding:10px;background:var(--bg);border:1px solid var(--bdr);border-radius:10px;color:var(--text);font-size:14px;font-weight:700;text-align:center}
.cs-input:focus{border-color:var(--pri)}
.cs-btn{padding:10px 16px;background:var(--grad);color:#fff;border-radius:10px;font-size:12px;font-weight:800;font-family:inherit}
.round-info{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:14px;width:100%;max-width:400px;text-align:center}
.round-info-lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:4px}
.round-info-val{font-size:20px;font-weight:900;color:var(--pri)}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">💪</div><span>Workout Timer</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gW" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#f97316"/></linearGradient></defs></svg>

<div class="phase-badge" id="phaseBadge">Ready</div>

<div class="timer-wrap">
<svg class="timer-svg" viewBox="0 0 300 300">
<circle class="timer-bg" cx="150" cy="150" r="138"/>
<circle class="timer-fill" id="timerFill" cx="150" cy="150" r="138" stroke-dasharray="867" stroke-dashoffset="0"/>
</svg>
<div class="timer-inner">
<div class="timer-val" id="timeVal">0</div>
<div class="timer-lbl" id="timeLabel">Seconds</div>
</div>
</div>

<div class="controls">
<button class="btn primary" id="mainBtn" onclick="toggle()">
<svg viewBox="0 0 24 24" id="btnIcon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
<span id="btnText">Start</span>
</button>
<button class="btn" onclick="reset()">
<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
Reset
</button>
</div>

<div class="round-info">
<div class="round-info-lbl">Rounds</div>
<div class="round-info-val" id="roundVal">1 / 8</div>
</div>

<div class="presets-title">Workout Presets</div>
<div class="presets">
<button class="preset active" data-p="hiit" onclick="setPreset('hiit')"><span class="preset-name">🔥 HIIT</span><span class="preset-detail">30s / 15s × 8</span></button>
<button class="preset" data-p="tabata" onclick="setPreset('tabata')"><span class="preset-name">⚡ Tabata</span><span class="preset-detail">20s / 10s × 8</span></button>
<button class="preset" data-p="strength" onclick="setPreset('strength')"><span class="preset-name">💪 Strength</span><span class="preset-detail">45s / 30s × 6</span></button>
<button class="preset" data-p="custom" onclick="setPreset('custom')"><span class="preset-name">⚙️ Custom</span><span class="preset-detail">Set your own</span></button>
</div>

<div class="custom-section">
<div class="cs-row"><span class="cs-lbl">Work (s)</span><input type="number" class="cs-input" id="workInput" value="30" min="5" max="300"></div>
<div class="cs-row"><span class="cs-lbl">Rest (s)</span><input type="number" class="cs-input" id="restInput" value="15" min="5" max="300"></div>
<div class="cs-row"><span class="cs-lbl">Rounds</span><input type="number" class="cs-input" id="roundInput" value="8" min="1" max="50"></div>
<div class="cs-row"><button class="cs-btn" onclick="applyCustom()" style="width:100%">Apply Custom</button></div>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<script>
const PRESETS={hiit:{work:30,rest:15,rounds:8},tabata:{work:20,rest:10,rounds:8},strength:{work:45,rest:30,rounds:6}};
let state={theme:'dark',preset:'hiit',work:30,rest:15,rounds:8,currentRound:1,phase:'work',timeLeft:30,running:false,interval:null};
let ttm;
function init(){loadState();applyTheme();render();}
function loadState(){try{const s=localStorage.getItem('wkt_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.preset=p.preset||'hiit';if(PRESETS[state.preset])Object.assign(state,PRESETS[state.preset]);}}catch(e){}}
function saveState(){try{localStorage.setItem('wkt_v1',JSON.stringify({theme:state.theme,preset:state.preset}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function setPreset(p){
  state.preset=p;state.currentRound=1;state.phase='work';
  if(PRESETS[p]){state.work=PRESETS[p].work;state.rest=PRESETS[p].rest;state.rounds=PRESETS[p].rounds;}
  state.timeLeft=state.work;
  document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',b.dataset.p===p));
  document.getElementById('workInput').value=state.work;
  document.getElementById('restInput').value=state.rest;
  document.getElementById('roundInput').value=state.rounds;
  stop();render();saveState();
}

function applyCustom(){
  const w=parseInt(document.getElementById('workInput').value)||30;
  const r=parseInt(document.getElementById('restInput').value)||15;
  const n=parseInt(document.getElementById('roundInput').value)||8;
  state.work=w;state.rest=r;state.rounds=n;state.preset='custom';
  state.currentRound=1;state.phase='work';state.timeLeft=w;
  document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',b.dataset.p==='custom'));
  stop();render();showToast('Custom applied');
}

function toggle(){
  if(state.running)stop();else start();
}

function start(){
  state.running=true;
  document.getElementById('btnText').textContent='Pause';
  document.getElementById('btnIcon').innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  if(state.interval)clearInterval(state.interval);
  state.interval=setInterval(tick,1000);
  beep(440,0.1);
}

function stop(){
  state.running=false;
  if(state.interval)clearInterval(state.interval);
  state.interval=null;
  document.getElementById('btnText').textContent='Start';
  document.getElementById('btnIcon').innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
}

function reset(){
  stop();
  state.currentRound=1;state.phase='work';state.timeLeft=state.work;
  render();showToast('Reset');
}

function tick(){
  state.timeLeft--;
  if(state.timeLeft<=0){
    if(state.phase==='work'){
      if(state.currentRound>=state.rounds){finish();return;}
      state.phase='rest';state.timeLeft=state.rest;
      beep(660,0.15);
      if(navigator.vibrate)navigator.vibrate(100);
    }else{
      state.currentRound++;state.phase='work';state.timeLeft=state.work;
      beep(880,0.15);
      if(navigator.vibrate)navigator.vibrate(100);
    }
  }
  if(state.timeLeft<=3&&state.timeLeft>0)beep(880,0.05);
  render();
}

function finish(){
  stop();
  beep(1047,0.3);
  setTimeout(()=>beep(1319,0.3),200);
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);
  showToast('🎉 Workout Complete!');
}

function render(){
  document.getElementById('timeVal').textContent=state.timeLeft;
  document.getElementById('timeLabel').textContent=state.phase==='work'?'WORK':'REST';
  document.getElementById('roundVal').textContent=state.currentRound+' / '+state.rounds;
  const badge=document.getElementById('phaseBadge');
  if(!state.running&&state.timeLeft===state.work&&state.currentRound===1){
    badge.textContent='Ready';badge.classList.remove('work','rest');
  }else if(state.phase==='work'){
    badge.textContent='🔥 Work';badge.className='phase-badge work';
  }else{
    badge.textContent='💚 Rest';badge.className='phase-badge rest';
  }
  const total=state.phase==='work'?state.work:state.rest;
  const pct=total>0?state.timeLeft/total:0;
  document.getElementById('timerFill').style.strokeDashoffset=867*(1-pct);
}

let audioCtx=null;
function beep(freq,dur){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(0.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
init();
</script></body></html>
