<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sleep Tracker</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#0a0616;--card:#1a1035;--elev:#251a4d;--text:#e9d5ff;--muted:#c4b5fd;--sub:#7c3aed;--pri:#a855f7;--blue:#6366f1;--gold:#fbbf24;--grad:linear-gradient(135deg,#6366f1,#a855f7);--bdr:rgba(168,85,247,0.25);--glow:0 0 30px rgba(168,85,247,0.4)}
[data-theme="light"]{--bg:#faf5ff;--card:#fff;--elev:#f3e8ff;--text:#3b0764;--muted:#7e22ce;--sub:#c084fc;--bdr:rgba(126,34,206,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(168,85,247,0.1),transparent 40%),radial-gradient(circle at 80% 90%,rgba(99,102,241,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,6,22,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(250,245,255,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.main::-webkit-scrollbar{width:0}
.hero{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(168,85,247,0.15));border:1px solid var(--bdr);border-radius:24px;padding:24px;width:100%;max-width:440px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'🌙';position:absolute;top:10px;right:16px;font-size:32px;opacity:0.4}
.hero-lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:8px}
.hero-val{font-size:56px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.hero-lbl2{font-size:13px;color:var(--muted);font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:440px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:14px;text-align:center}
.stat-v{font-size:22px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.section-title{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;width:100%;max-width:440px;padding-left:4px;margin-top:6px}
.log-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px}
.log-item{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.log-icon{width:40px;height:40px;border-radius:12px;background:var(--elev);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.log-info{flex:1;min-width:0}
.log-name{font-size:14px;font-weight:700;margin-bottom:2px}
.log-time{font-size:11px;color:var(--sub)}
.log-dur{font-size:15px;font-weight:900;color:var(--pri);font-variant-numeric:tabular-nums;flex-shrink:0}
.log-del{width:30px;height:30px;border-radius:8px;background:rgba(239,68,68,0.1);color:#fca5a5;display:grid;place-items:center;flex-shrink:0}
.log-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px}
.fab{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(168,85,247,0.5);z-index:100}
.fab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.sheet::-webkit-scrollbar{width:0}
.drag{width:40px;height:4px;background:var(--elev);border-radius:2px;margin:0 auto 16px}
.sheet h3{font-size:18px;margin-bottom:16px;text-align:center;font-weight:800}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--sub);font-weight:800;margin-bottom:6px}
.inp{width:100%;padding:14px;background:var(--bg);border:1px solid var(--bdr);border-radius:12px;color:var(--text);font-size:15px;margin-bottom:14px;font-weight:600}
.inp:focus{border-color:var(--pri)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quality-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.q-btn{padding:12px 4px;background:var(--elev);border:1px solid var(--bdr);border-radius:12px;color:var(--muted);font-size:11px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.q-btn.active{background:var(--grad);color:#fff;border-color:transparent}
.q-btn .qi{font-size:20px}
.btn-row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.btn{padding:14px;border-radius:12px;background:var(--elev);color:var(--text);font-size:14px;font-weight:700;font-family:inherit;text-align:center;border:1px solid var(--bdr)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(168,85,247,0.4)}
.tt{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">😴</div><span>Sleep Tracker</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="hero">
<div class="hero-lbl">Last Night's Sleep</div>
<div class="hero-val" id="lastSleep">0h 0m</div>
<div class="hero-lbl2" id="lastQuality">No data yet</div>
</div>

<div class="stats-grid">
<div class="stat"><div class="stat-v" id="stAvg">0h</div><div class="stat-l">Avg Sleep</div></div>
<div class="stat"><div class="stat-v" id="stTotal">0h</div><div class="stat-l">Total (7d)</div></div>
<div class="stat"><div class="stat-v" id="stBest">0h</div><div class="stat-l">Best</div></div>
<div class="stat"><div class="stat-v" id="stNights">0</div><div class="stat-l">Nights</div></div>
</div>

<div class="section-title">Recent Nights</div>
<div class="log-list" id="logList"></div>
</main>

<button class="fab" onclick="openModal()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet">
<div class="drag"></div>
<h3>Log Sleep</h3>
<div class="lbl">Bedtime</div>
<input type="time" class="inp" id="inpBed" value="22:00">
<div class="lbl">Wake Time</div>
<input type="time" class="inp" id="inpWake" value="06:00">
<div class="lbl">Quality</div>
<div class="quality-row" id="qualityRow">
<button class="q-btn" data-q="1" onclick="setQuality(1)"><span class="qi">😫</span>Poor</button>
<button class="q-btn" data-q="2" onclick="setQuality(2)"><span class="qi">😐</span>Okay</button>
<button class="q-btn active" data-q="3" onclick="setQuality(3)"><span class="qi">😊</span>Good</button>
<button class="q-btn" data-q="4" onclick="setQuality(4)"><span class="qi">🤩</span>Great</button>
</div>
<div class="lbl">Notes (optional)</div>
<input type="text" class="inp" id="inpNotes" placeholder="e.g. woke up once">
<div class="btn-row">
<button class="btn" onclick="closeModal()">Cancel</button>
<button class="btn primary" onclick="saveSleep()">Save</button>
</div>
</div>
</div>

<div class="tt" id="toast"><span id="tt-txt">Saved</span></div>

<script>
let state={theme:'dark',logs:[],quality:3};
let ttm;
function init(){loadState();applyTheme();render();}
function loadState(){try{const s=localStorage.getItem('sleep_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.logs=p.logs||[];}}catch(e){}}
function saveState(){try{localStorage.setItem('sleep_v1',JSON.stringify({theme:state.theme,logs:state.logs}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function openModal(){document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function setQuality(q){state.quality=q;document.querySelectorAll('.q-btn').forEach(b=>b.classList.toggle('active',+b.dataset.q===q));}

function saveSleep(){
  const bed=document.getElementById('inpBed').value;
  const wake=document.getElementById('inpWake').value;
  const notes=document.getElementById('inpNotes').value.trim();
  if(!bed||!wake){showToast('Set times');return;}
  const[bh,bm]=bed.split(':').map(Number);
  const[wh,wm]=wake.split(':').map(Number);
  let bedMin=bh*60+bm;
  let wakeMin=wh*60+wm;
  if(wakeMin<=bedMin)wakeMin+=1440;
  const dur=wakeMin-bedMin;
  const log={id:Date.now(),bed:bed,wake:wake,dur:dur,quality:state.quality,notes:notes,date:new Date().toISOString()};
  state.logs.unshift(log);
  if(state.logs.length>60)state.logs=state.logs.slice(0,60);
  saveState();closeModal();render();
  if(navigator.vibrate)navigator.vibrate(30);
  showToast('Sleep logged: '+fmtDur(dur));
}

function fmtDur(min){const h=Math.floor(min/60);const m=min%60;return h+'h '+m+'m';}

function render(){
  const logs=state.logs;
  if(logs.length===0){
    document.getElementById('lastSleep').textContent='0h 0m';
    document.getElementById('lastQuality').textContent='No data yet';
    document.getElementById('logList').innerHTML='<div class="empty">No sleep logged yet.<br>Tap + to log your first night.</div>';
    document.getElementById('stAvg').textContent='0h';
    document.getElementById('stTotal').textContent='0h';
    document.getElementById('stBest').textContent='0h';
    document.getElementById('stNights').textContent='0';
    return;
  }
  const last=logs[0];
  document.getElementById('lastSleep').textContent=fmtDur(last.dur);
  const qMap={1:'😫 Poor',2:'😐 Okay',3:'😊 Good',4:'🤩 Great'};
  document.getElementById('lastQuality').textContent=qMap[last.quality]||'—';
  const week=logs.slice(0,7);
  const totalMin=week.reduce((s,l)=>s+l.dur,0);
  const avgMin=Math.round(totalMin/week.length);
  const bestMin=Math.max(...logs.map(l=>l.dur));
  document.getElementById('stAvg').textContent=Math.floor(avgMin/60)+'h';
  document.getElementById('stTotal').textContent=Math.floor(totalMin/60)+'h';
  document.getElementById('stBest').textContent=Math.floor(bestMin/60)+'h';
  document.getElementById('stNights').textContent=logs.length;
  const qEmoji={1:'😫',2:'😐',3:'😊',4:'🤩'};
  document.getElementById('logList').innerHTML=logs.slice(0,10).map(l=>{
    const d=new Date(l.date);
    const dstr=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return '<div class="log-item"><div class="log-icon">'+(qEmoji[l.quality]||'😴')+'</div><div class="log-info"><div class="log-name">'+l.bed+' → '+l.wake+'</div><div class="log-time">'+dstr+(l.notes?' · '+esc(l.notes):'')+'</div></div><div class="log-dur">'+fmtDur(l.dur)+'</div><button class="log-del" onclick="deleteLog('+l.id+')"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button></div>';
  }).join('');
}

function deleteLog(id){state.logs=state.logs.filter(l=>l.id!==id);saveState();render();}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
init();
</script></body></html>
