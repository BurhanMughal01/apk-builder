<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Periodic Table</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#050c1a;--card:#0f1e3d;--elev:#1a2d54;--text:#dbeafe;--muted:#93c5fd;--sub:#3b82f6;--pri:#3b82f6;--purple:#8b5cf6;--green:#10b981;--red:#ef4444;--gold:#fbbf24;--orange:#f97316;--pink:#ec4899;--cyan:#06b6d4;--grad:linear-gradient(135deg,#3b82f6,#8b5cf6);--bdr:rgba(59,130,246,0.25);--glow:0 0 30px rgba(59,130,246,0.4)}
[data-theme="light"]{--bg:#eff6ff;--card:#fff;--elev:#dbeafe;--text:#1e3a8a;--muted:#1d4ed8;--sub:#93c5fd;--bdr:rgba(30,58,138,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(59,130,246,0.1),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(5,12,26,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(239,246,255,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.main::-webkit-scrollbar{width:0}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:10px 14px;width:100%;max-width:520px}
.search-box svg{width:16px;height:16px;stroke:var(--sub);fill:none;stroke-width:2}
.search-box input{flex:1;background:none;border:none;color:var(--text);font-size:13px;font-weight:600}
.search-box input::placeholder{color:var(--sub)}
.table-wrap{width:100%;max-width:520px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(28px,1fr));gap:2px;min-width:520px}
.el{aspect-ratio:1;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:800;cursor:pointer;transition:all .15s;color:#fff;padding:1px;line-height:1}
.el:active{transform:scale(0.9);box-shadow:0 0 12px currentColor}
.el .num{font-size:6px;opacity:0.85}
.el .sym{font-size:11px;font-weight:900}
.el .name{font-size:5px;opacity:0.8;text-align:center;overflow:hidden;width:100%}
.el.empty{background:transparent!important;cursor:default}
.cat-alkali{background:#ef4444}
.cat-alkaline{background:#f97316}
.cat-transition{background:#f59e0b}
.cat-post-transition{background:#84cc16}
.cat-metalloid{background:#10b981}
.cat-nonmetal{background:#06b6d4}
.cat-halogen{background:#3b82f6}
.cat-noble{background:#8b5cf6}
.cat-lanthanide{background:#ec4899}
.cat-actinide{background:#a855f7}
.cat-unknown{background:#64748b}
.detail-card{background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:20px;width:100%;max-width:520px;display:none;position:relative;overflow:hidden}
.detail-card.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.detail-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.detail-badge{width:70px;height:70px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.detail-badge .sym{font-size:26px;font-weight:900;line-height:1}
.detail-badge .num{font-size:11px;opacity:0.9;margin-top:2px}
.detail-title{flex:1;min-width:0}
.detail-name{font-size:22px;font-weight:900;margin-bottom:4px}
.detail-cat{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.detail-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--elev);display:grid;place-items:center;color:var(--muted)}
.detail-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-item{background:var(--elev);border-radius:12px;padding:10px 12px}
.detail-item-lbl{font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px;font-weight:800;margin-bottom:3px}
.detail-item-val{font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px;width:100%;max-width:520px;margin-top:6px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted);font-weight:700}
.legend-dot{width:10px;height:10px;border-radius:3px}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">⚗️</div><span>Periodic Table</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="search-box">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
<input type="text" id="searchInput" placeholder="Search element, symbol, or number..." oninput="searchEl(this.value)">
</div>

<div class="table-wrap"><div class="ptable" id="ptable"></div></div>

<div class="detail-card" id="detailCard">

<div class="detail-item"><div class="detail-item-lbl">Period</div><div class="detail-item-val" id="dPeriod">—</div></div>

</div>
</div>

<div class="legend">

<div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Alkaline</div>
<div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Transition</div>
<div class="legend-item"><div class="legend-dot" style="background:#84cc16"></div>Post-Transition</div>
<div class="legend-item"><div class="legend-dot" style="background:#10b981"></div>Metalloid</div>

<div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div>Actinide</div>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

      if(el){
        const hide=filter&&!matches(el,filter);
        html+='<div class="el cat-'+el.cat+'" style="'+(hide?'opacity:0.15':'')+'" onclick="showDetail('+el.num+')"><span class="num">'+el.num+'</span><span class="sym">'+el.sym+'</span></div>';
      }else{
        // leave empty for La, Ac positions
        if((p===6&&g===3)||(p===7&&g===3)){
          html+='<div class="el cat-'+(p===6?'lanthanide':'actinide')+'" onclick="showDetail('+(p===6?57:89)+')"><span class="num">'+(p===6?57:89)+'</span><span class="sym">'+(p===6?'La':'Ac')+'</span></div>';
        }else{
          html+='<div class="el empty"></div>';
        }
      }
    }
  }
  // Lanthanides (57-71) - row 9
  html+='<div class="el empty"></div><div class="el empty"></div>';
  for(let n=57;n<=71;n++){
    const el=ELEMENTS.find(x=>x.num===n);
    if(el){const hide=filter&&!matches(el,filter);html+='<div class="el cat-'+el.cat+'" style="'+(hide?'opacity:0.15':'')+'" onclick="showDetail('+el.num+')"><span class="num">'+el.num+'</span><span class="sym">'+el.sym+'</span></div>';}
  }
  html+='<div class="el empty"></div>';
  // Actinides (89-103) - row 10
  html+='<div class="el empty"></div><div class="el empty"></div>';
  for(let n=89;n<=103;n++){
    const el=ELEMENTS.find(x=>x.num===n);
    if(el){const hide=filter&&!matches(el,filter);html+='<div class="el cat-'+el.cat+'" style="'+(hide?'opacity:0.15':'')+'" onclick="showDetail('+el.num+')"><span class="num">'+el.num+'</span><span class="sym">'+el.sym+'</span></div>';}
  }
  html+='<div class="el empty"></div>';
  grid.innerHTML=html;
}

function matches(el,filter){
  const q=filter.toLowerCase();
  return el.sym.toLowerCase().includes(q)||el.name.toLowerCase().includes(q)||String(el.num)===q;
}

function searchEl(v){renderTable(v.trim()||null);}

function showDetail(num){
  const el=ELEMENTS.find(x=>x.num===num);
  if(!el)return;
  state.selected=el;
  const card=document.getElementById('detailCard');
  card.classList.add('show');
  const badge=document.getElementById('dBadge');
  badge.className='detail-badge cat-'+el.cat;
  document.getElementById('dSym').textContent=el.sym;
  document.getElementById('dNum').textContent=el.num;
  document.getElementById('dName').textContent=el.name;
  document.getElementById('dCat').textContent=CATNAME[el.cat]||el.cat;
  document.getElementById('dMass').textContent=el.mass;
  document.getElementById('dCategory').textContent=CATNAME[el.cat]||el.cat;
  document.getElementById('dPeriod').textContent=el.p;
  document.getElementById('dGroup').textContent=el.g;
  if(navigator.vibrate)navigator.vibrate(10);
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function closeDetail(){document.getElementById('detailCard').classList.remove('show');state.selected=null;}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
