<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Photo Gallery</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#0a0a0f;--card:#16161f;--elev:#1e1e2a;--text:#f1f5f9;--muted:#94a3b8;--sub:#64748b;--pri:#a855f7;--pink:#ec4899;--blue:#3b82f6;--green:#10b981;--grad:linear-gradient(135deg,#a855f7,#ec4899);--bdr:rgba(168,85,247,0.2);--glow:0 0 30px rgba(168,85,247,0.4)}
[data-theme="light"]{--bg:#faf5ff;--card:#fff;--elev:#f3e8ff;--text:#1e1b4b;--muted:#6b7280;--sub:#a78bfa;--bdr:rgba(168,85,247,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(168,85,247,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(250,245,255,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:12px}
.main::-webkit-scrollbar{width:0}
.add-btn{width:100%;padding:16px;border-radius:16px;background:var(--grad);color:#fff;font-size:14px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 20px rgba(168,85,247,0.4);margin-bottom:14px}
.add-btn:active{transform:scale(0.98)}
.add-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photo{aspect-ratio:1;border-radius:8px;background:var(--elev);overflow:hidden;position:relative;cursor:pointer;transition:all .2s}
.photo:active{transform:scale(0.95)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.7);color:#fff;display:grid;place-items:center;opacity:0;transition:all .2s;z-index:2}
.photo:active .photo-del{opacity:1}
.photo-del svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3}
.empty{text-align:center;padding:60px 20px;color:var(--sub);font-size:13px}
.empty-icon{font-size:80px;margin-bottom:16px;opacity:0.4}
.empty h3{font-size:16px;color:var(--muted);margin-bottom:6px;font-weight:800}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,0.98);z-index:200;display:none;flex-direction:column;padding:16px}
.viewer.show{display:flex}
.viewer-head{display:flex;align-items:center;justify-content:space-between;padding:8px 0;color:#fff}
.viewer-info{font-size:12px;color:#94a3b8;font-weight:700}
.viewer-close{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);color:#fff;display:grid;place-items:center}
.viewer-close svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5}
.viewer-img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.viewer-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.viewer-nav{display:flex;justify-content:space-between;gap:12px;padding:8px 0}
.nav-btn{flex:1;padding:14px;border-radius:12px;background:rgba(255,255,255,0.1);color:#fff;font-size:14px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.nav-btn:active{background:rgba(255,255,255,0.2)}
.nav-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.viewer-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 0}
.act-btn{padding:14px;border-radius:12px;background:rgba(255,255,255,0.1);color:#fff;font-size:13px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.act-btn:active{background:rgba(255,255,255,0.2)}
.act-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
.counter{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;margin-bottom:12px;font-size:12px;color:var(--muted);font-weight:700}
.counter strong{color:var(--pri);font-size:16px;font-weight:900}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">📷</div><span>Photo Gallery</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<button class="add-btn" onclick="document.getElementById('fileInput').click()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add Photos</button>
<input type="file" id="fileInput" accept="image/*" multiple hidden onchange="handleFiles(this.files)">
<div class="counter" id="counterBox" style="display:none"><span>Total photos</span><strong id="photoCount">0</strong></div>
<div class="grid" id="photoGrid"></div>
<div class="empty" id="emptyState">
<div class="empty-icon">📷</div>
<h3>No photos yet</h3>
<p>Add your first photo to get started</p>
</div>
</main>

<div class="viewer" id="viewer">
<div class="viewer-head">
<div class="viewer-info" id="viewerInfo">1 / 1</div>
<button class="viewer-close" onclick="closeViewer()"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
</div>
<div class="viewer-img"><img id="viewerImg" src="" alt=""></div>
<div class="viewer-nav">
<button class="nav-btn" onclick="prevPhoto()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Previous</button>
<button class="nav-btn" onclick="nextPhoto()">Next<svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
</div>
<div class="viewer-actions">
<button class="act-btn" onclick="downloadPhoto()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Download</button>
<button class="act-btn" onclick="deletePhoto()"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>Delete</button>
</div>
</div>

<div class="tt" id="toast"><span id="tt-txt">Saved</span></div>

<script>
let state={theme:'dark',photos:[],currentIndex:0};
let ttm;
function init(){loadState();applyTheme();render();}
function loadState(){try{const s=localStorage.getItem('gal_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.photos=p.photos||[];}}catch(e){}}
function saveState(){try{localStorage.setItem('gal_v1',JSON.stringify({theme:state.theme,photos:state.photos}));}catch(e){showToast('Storage full');}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function handleFiles(files){
  if(!files||!files.length)return;
  let loaded=0;
  const total=files.length;
  Array.from(files).forEach(file=>{
    if(!file.type.startsWith('image/'))return;
    const reader=new FileReader();
    reader.onload=e=>{
      state.photos.push({id:Date.now()+Math.random(),data:e.target.result,name:file.name});
      loaded++;
      if(loaded===total||loaded===Array.from(files).filter(f=>f.type.startsWith('image/')).length){
        saveState();render();
        showToast(total+' photo'+(total>1?'s':'')+' added');
        if(navigator.vibrate)navigator.vibrate(30);
      }
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('fileInput').value='';
}

function render(){
  const grid=document.getElementById('photoGrid');
  const empty=document.getElementById('emptyState');
  const counter=document.getElementById('counterBox');
  if(!state.photos.length){
    grid.innerHTML='';empty.style.display='block';counter.style.display='none';
    return;
  }
  empty.style.display='none';counter.style.display='flex';
  document.getElementById('photoCount').textContent=state.photos.length;
  grid.innerHTML=state.photos.map((p,i)=>'<div class="photo" onclick="openViewer('+i+')"><img src="'+p.data+'" alt="" loading="lazy"><button class="photo-del" onclick="event.stopPropagation();quickDelete('+i+')"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>').join('');
}

function openViewer(i){
  state.currentIndex=i;
  document.getElementById('viewerImg').src=state.photos[i].data;
  document.getElementById('viewerInfo').textContent=(i+1)+' / '+state.photos.length;
  document.getElementById('viewer').classList.add('show');
}
function closeViewer(){document.getElementById('viewer').classList.remove('show');}
function nextPhoto(){state.currentIndex=(state.currentIndex+1)%state.photos.length;openViewer(state.currentIndex);}
function prevPhoto(){state.currentIndex=(state.currentIndex-1+state.photos.length)%state.photos.length;openViewer(state.currentIndex);}

function downloadPhoto(){
  const p=state.photos[state.currentIndex];
  if(!p)return;
  const a=document.createElement('a');
  a.href=p.data;a.download=p.name||'photo.jpg';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  showToast('Downloaded');
}
function deletePhoto(){
  if(!confirm('Delete this photo?'))return;
  state.photos.splice(state.currentIndex,1);
  saveState();
  if(!state.photos.length){closeViewer();render();return;}
  state.currentIndex=Math.min(state.currentIndex,state.photos.length-1);
  openViewer(state.currentIndex);render();
  showToast('Deleted');
}
function quickDelete(i){
  if(!confirm('Delete this photo?'))return;
  state.photos.splice(i,1);
  saveState();render();showToast('Deleted');
}

let touchStartX=null;
const viewer=document.getElementById('viewer');
viewer.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;},{passive:true});
viewer.addEventListener('touchend',e=>{
  if(touchStartX===null)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>60){
    if(dx<0)nextPhoto();else prevPhoto();
  }
  touchStartX=null;
},{passive:true});

function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
init();
</script></body></html>
