<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Grammar Quiz</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#1a0f05;--card:#2a1a0a;--elev:#3d2810;--text:#fef3c7;--muted:#fcd34d;--sub:#a16207;--pri:#f59e0b;--green:#10b981;--red:#ef4444;--gold:#fbbf24;--grad:linear-gradient(135deg,#f59e0b,#d97706);--bdr:rgba(245,158,11,0.25);--glow:0 0 30px rgba(245,158,11,0.4)}
[data-theme="light"]{--bg:#fffbeb;--card:#fff;--elev:#fef3c7;--text:#451a03;--muted:#92400e;--sub:#fbbf24;--bdr:rgba(180,83,9,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(245,158,11,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(26,15,5,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(255,251,235,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.main::-webkit-scrollbar{width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:440px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px;text-align:center}
.stat-v{font-size:22px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.cat-row{display:flex;gap:6px;overflow-x:auto;width:100%;max-width:440px;scrollbar-width:none;padding:4px 0}
.cat-row::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bdr);color:var(--muted);font-size:12px;font-weight:700;transition:all .2s}
.cat-chip.active{background:var(--grad);color:#fff;border-color:transparent}
.q-card{background:linear-gradient(135deg,rgba(245,158,11,0.15),rgba(217,119,6,0.08));border:1px solid var(--bdr);border-radius:24px;padding:24px;width:100%;max-width:440px;box-shadow:var(--glow);position:relative}
.q-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:2px;font-weight:800;margin-bottom:12px}
.q-text{font-size:20px;font-weight:800;line-height:1.5;color:var(--text)}
.q-text .blank{color:var(--pri);text-decoration:underline;font-weight:900}
.answers{display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px}
.answer{padding:18px;background:var(--card);border:2px solid var(--bdr);border-radius:14px;color:var(--text);font-size:15px;font-weight:700;font-family:inherit;text-align:left;transition:all .2s}
.answer:active{transform:scale(0.98)}
.answer:disabled{cursor:default}
.answer.correct{background:linear-gradient(135deg,rgba(16,185,129,0.25),rgba(16,185,129,0.1));border-color:var(--green);color:var(--green)}
.answer.wrong{background:linear-gradient(135deg,rgba(239,68,68,0.25),rgba(239,68,68,0.1));border-color:var(--red);color:var(--red)}
.feedback{font-size:14px;font-weight:800;text-align:center;color:var(--muted);padding:12px;background:var(--card);border-radius:12px;width:100%;max-width:440px;display:none}
.feedback.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.feedback.ok{color:var(--green);border:1px solid var(--green)}
.feedback.no{color:var(--red);border:1px solid var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.btn{padding:14px;border-radius:14px;background:var(--elev);color:var(--text);font-size:13px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bdr)}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(245,158,11,0.4)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">📖</div><span>Grammar Quiz</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="stats">
<div class="stat"><div class="stat-v" id="stScore">0</div><div class="stat-l">Score</div></div>
<div class="stat"><div class="stat-v" id="stStreak">0</div><div class="stat-l">Streak</div></div>
<div class="stat"><div class="stat-v" id="stBest">0</div><div class="stat-l">Best</div></div>
</div>

<div class="cat-row" id="catRow">
<button class="cat-chip active" data-c="all" onclick="setCat('all')">📚 All</button>
<button class="cat-chip" data-c="tenses" onclick="setCat('tenses')">⏰ Tenses</button>
<button class="cat-chip" data-c="articles" onclick="setCat('articles')">📌 Articles</button>
<button class="cat-chip" data-c="prep" onclick="setCat('prep')">📍 Prepositions</button>
<button class="cat-chip" data-c="pron" onclick="setCat('pron')">👥 Pronouns</button>
<button class="cat-chip" data-c="verbs" onclick="setCat('verbs')">⚡ Verbs</button>
</div>

<div class="q-card"><div class="q-label" id="qLabel">Question 1</div><div class="q-text" id="qText">Loading...</div></div>

<div class="answers" id="answers"></div>

<div class="feedback" id="feedback"></div>

<div class="actions">
<button class="btn primary" onclick="nextQ()"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Next</button>
<button class="btn" onclick="resetAll()"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Reset</button>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Correct!</span></div>

<script>
const QUESTIONS=[
{c:'tenses',q:'She ___ to school every day.',o:['go','goes','going','gone'],a:1,e:'Third person singular uses "goes" in present simple.'},
{c:'tenses',q:'I ___ TV when the phone rang.',o:['watch','watched','was watching','have watched'],a:2,e:'Past continuous for interrupted action.'},
{c:'tenses',q:'He ___ his homework already.',o:['does','did','has done','is doing'],a:2,e:'Present perfect with "already".'},
{c:'tenses',q:'They ___ to Paris next week.',o:['go','went','will go','have gone'],a:2,e:'Future simple for planned future.'},
{c:'tenses',q:'By the time we arrived, the movie ___.',o:['starts','started','had started','has started'],a:2,e:'Past perfect for earlier past action.'},
{c:'articles',q:'I saw ___ elephant at the zoo.',o:['a','an','the','no article'],a:1,e:'"An" before vowel sound.'},
{c:'articles',q:'___ sun rises in the east.',o:['A','An','The','No article'],a:2,e:'"The" for unique objects.'},
{c:'articles',q:'She is ___ honest woman.',o:['a','an','the','no article'],a:1,e:'"An" before silent H.'},
{c:'articles',q:'I like ___ music.',o:['a','an','the','no article'],a:3,e:'No article for general concepts.'},
{c:'articles',q:'He plays ___ piano very well.',o:['a','an','the','no article'],a:2,e:'"The" before musical instruments.'},
{c:'prep',q:'The book is ___ the table.',o:['in','on','at','by'],a:1,e:'"On" for surface.'},
{c:'prep',q:'I will meet you ___ Monday.',o:['in','on','at','by'],a:1,e:'"On" for days.'},
{c:'prep',q:'She was born ___ 1995.',o:['in','on','at','by'],a:0,e:'"In" for years.'},
{c:'prep',q:'The class starts ___ 9 AM.',o:['in','on','at','by'],a:2,e:'"At" for specific times.'},
{c:'prep',q:'He walked ___ the bridge.',o:['in','on','across','at'],a:2,e:'"Across" for crossing.'},
{c:'pron',q:'___ is my best friend.',o:['He','Him','His','Himself'],a:0,e:'Subject pronoun before verb.'},
{c:'pron',q:'Give the book to ___.',o:['I','me','my','mine'],a:1,e:'Object pronoun after preposition.'},
{c:'pron',q:'This pen is ___.',o:['I','me','my','mine'],a:3,e:'Possessive pronoun.'},
{c:'pron',q:'She hurt ___ while cooking.',o:['her','hers','herself','she'],a:2,e:'Reflexive pronoun.'},
{c:'pron',q:'___ of the students passed the exam.',o:['Every','Each','All','Both'],a:2,e:'"All" with plural.'},
{c:'verbs',q:'He ___ his keys yesterday.',o:['lose','loses','lost','losing'],a:2,e:'Past simple of "lose" is "lost".'},
{c:'verbs',q:'I have ___ that movie before.',o:['see','saw','seen','seeing'],a:2,e:'Past participle of "see".'},
{c:'verbs',q:'She ___ to the gym every morning.',o:['go','goes','going','gone'],a:1,e:'Present simple third person.'},
{c:'verbs',q:'The children ___ playing in the park.',o:['is','am','are','be'],a:2,e:'"Are" with plural subject.'},
{c:'verbs',q:'They ___ finished their work.',o:['has','have','is','are'],a:1,e:'"Have" with plural subject.'},
{c:'tenses',q:'If it ___, we will stay home.',o:['rains','will rain','rained','is raining'],a:0,e:'Present simple in conditional.'},
{c:'tenses',q:'She has been working here ___ 2010.',o:['for','since','from','during'],a:1,e:'"Since" with point in time.'},
{c:'prep',q:'I have lived here ___ five years.',o:['for','since','from','during'],a:0,e:'"For" with duration.'},
{c:'articles',q:'We had ___ wonderful time.',o:['a','an','the','no article'],a:0,e:'"A" with singular countable.'},
{c:'pron',q:'Between you and ___, this is difficult.',o:['I','me','my','mine'],a:1,e:'Object pronoun after preposition.'},
{c:'verbs',q:'She ___ her homework before dinner.',o:['do','does','did','doing'],a:2,e:'Past simple of "do".'},
{c:'tenses',q:'We ___ dinner when they arrived.',o:['have','had','were having','are having'],a:2,e:'Past continuous for ongoing action.'}
];
let state={theme:'dark',cat:'all',score:0,streak:0,best:0,current:null,answered:false,pool:[]};
let ttm;
function init(){loadState();applyTheme();buildPool();nextQ();}
function loadState(){try{const s=localStorage.getItem('gr_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.cat=p.cat||'all';state.best=p.best||0;}}catch(e){}}
function saveState(){try{localStorage.setItem('gr_v1',JSON.stringify({theme:state.theme,cat:state.cat,best:state.best}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function buildPool(){
  state.pool=state.cat==='all'?[...QUESTIONS]:QUESTIONS.filter(q=>q.c===state.cat);
  state.pool.sort(()=>Math.random()-0.5);
}
function setCat(c){
  state.cat=c;
  document.querySelectorAll('.cat-chip').forEach(b=>b.classList.toggle('active',b.dataset.c===c));
  state.score=0;state.streak=0;
  saveState();buildPool();nextQ();updateStats();
}

function nextQ(){
  if(!state.pool.length)buildPool();
  state.current=state.pool.shift();
  state.answered=false;
  document.getElementById('qLabel').textContent='Question · '+state.current.c.toUpperCase();
  const q=state.current.q.replace('___','<span class="blank">___</span>');
  document.getElementById('qText').innerHTML=q;
  const fb=document.getElementById('feedback');
  fb.className='feedback';
  fb.textContent='';
  const el=document.getElementById('answers');
  el.innerHTML=state.current.o.map((opt,i)=>'<button class="answer" onclick="pick('+i+',this)">'+String.fromCharCode(65+i)+'. '+opt+'</button>').join('');
}

function pick(i,btn){
  if(state.answered)return;
  state.answered=true;
  const all=document.querySelectorAll('.answer');
  all.forEach(b=>b.disabled=true);
  const fb=document.getElementById('feedback');
  if(i===state.current.a){
    btn.classList.add('correct');
    state.score+=10;state.streak++;
    if(state.streak>state.best){state.best=state.streak;saveState();}
    fb.className='feedback show ok';
    fb.textContent='✓ Correct! '+state.current.e;
    if(navigator.vibrate)navigator.vibrate(30);
  }else{
    btn.classList.add('wrong');
    all[state.current.a].classList.add('correct');
    state.streak=0;
    fb.className='feedback show no';
    fb.textContent='✗ Correct: '+state.current.o[state.current.a]+'. '+state.current.e;
    if(navigator.vibrate)navigator.vibrate([50,30,50]);
  }
  updateStats();
  setTimeout(()=>nextQ(),2500);
}

function updateStats(){
  document.getElementById('stScore').textContent=state.score;
  document.getElementById('stStreak').textContent=state.streak;
  document.getElementById('stBest').textContent=state.best;
}
function resetAll(){
  if(!confirm('Reset score?'))return;
  state.score=0;state.streak=0;
  buildPool();updateStats();nextQ();showToast('Reset');
}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
