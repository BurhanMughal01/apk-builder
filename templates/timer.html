<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Timer</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#1a0f04;--card:#2a1a08;--elev:#3d2810;--text:#fff7ed;--muted:#fdba74;--sub:#a16207;--pri:#f97316;--grad:linear-gradient(135deg,#f97316,#ea580c);--bdr:rgba(249,115,22,0.2);--green:#10b981;--red:#ef4444}
[data-theme="light"]{--bg:#fff7ed;--card:#fff;--elev:#ffedd5;--text:#431407;--muted:#9a3412;--sub:#fb923c;--bdr:rgba(234,88,12,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(249,115,22,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(26,15,4,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(255,247,237,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center}
.main::-webkit-scrollbar{width:0}
.ring-wrap{position:relative;width:min(320px,88vw);height:min(320px,88vw);margin:20px 0}
.ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--card);stroke-width:12}
.ring-prog{fill:none;stroke:url(#g1);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 0.5s linear;filter:drop-shadow(0 0 10px rgba(249,115,22,0.6))}
.ring-in{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--elev),var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 40px rgba(249,115,22,0.15)}
.time-text{font-size:60px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);letter-spacing:-2px;line-height:1}
.time-text.warning{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.time-label{font-size:12px;color:var(--sub);margin-top:8px;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;margin-top:20px}
.btn{padding:18px;border-radius:16px;background:var(--elev);color:var(--text);font-size:16px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;border:1px solid var(--bdr)}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(249,115,22,0.4)}
.btn.danger{background:rgba(239,68,68,0.15);color:#fca5a5;border-color:rgba(239,68,68,0.3)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px;margin-top:20px}
.preset{padding:14px 8px;border-radius:14px;background:var(--card);color:var(--muted);font-size:14px;font-weight:700;font-family:inherit;border:1px solid var(--bdr);transition:all .2s}
.preset:active{transform:scale(0.95);border-color:var(--pri);color:var(--pri)}
.custom-input{display:flex;gap:8px;width:100%;max-width:340px;margin-top:12px}
.custom-input input{flex:1;padding:14px;background:var(--card);border:1px solid var(--bdr);border-radius:12px;color:var(--text);font-size:15px;text-align:center;font-weight:700}
.custom-input input:focus{border-color:var(--pri)}
.custom-input button{padding:0 20px;border-radius:12px;background:var(--grad);color:#fff;font-weight:800;font-size:14px;font-family:inherit}
.label-section{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-top:24px;margin-bottom:10px;align-self:flex-start;padding-left:20px}
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:200}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
.done-toast{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:40px}
.done-toast.show{display:flex;animation:fadeIn .3s}
.done-toast .icon{font-size:100px;margin-bottom:20px;animation:bounce 0.8s infinite}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.done-toast h2{font-size:32px;font-weight:800;color:var(--pri);margin-bottom:10px}
.done-toast p{font-size:16px;color:var(--muted);margin-bottom:30px}
.done-toast button{padding:16px 40px;background:var(--grad);color:#fff;border-radius:14px;font-weight:800;font-size:16px}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">⏰</div><span>Timer</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient></defs></svg>

<div class="ring-wrap">
<svg class="ring-svg" viewBox="0 0 320 320">
<circle class="ring-bg" cx="160" cy="160" r="150"/>
<circle class="ring-prog" id="ringProg" cx="160" cy="160" r="150" stroke-dasharray="942" stroke-dashoffset="0"/>
</svg>
<div class="ring-in">
<div class="time-text" id="timeText">00:00</div>
<div class="time-label" id="timeLabel">Ready</div>
</div>
</div>

<div class="controls">
<button class="btn primary" id="startBtn" onclick="toggleTimer()">
<svg viewBox="0 0 24 24" id="btnIcon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
<span id="btnText">Start</span>
</button>
<button class="btn" onclick="resetTimer()">
<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
Reset
</button>
</div>

<div class="label-section">Quick Presets</div>
<div class="presets">
<button class="preset" onclick="setPreset(60)">1 min</button>
<button class="preset" onclick="setPreset(180)">3 min</button>
<button class="preset" onclick="setPreset(300)">5 min</button>
<button class="preset" onclick="setPreset(600)">10 min</button>
<button class="preset" onclick="setPreset(900)">15 min</button>
<button class="preset" onclick="setPreset(1800)">30 min</button>
</div>

<div class="label-section">Custom (minutes)</div>
<div class="custom-input">
<input type="number" id="customMin" placeholder="Enter minutes" min="1" max="999">
<button onclick="setCustom()">Set</button>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<div class="done-toast" id="doneToast">
<div class="icon">🔔</div>
<h2>Time's Up!</h2>
<p>Your timer has finished</p>
<button onclick="dismissDone()">OK</button>
</div>

<script>
let state={theme:'dark'};
let total=0, remaining=0, interval=null, running=false;
let audioCtx=null;
function init(){loadState();applyTheme();updateDisplay();}
function loadState(){try{const s=localStorage.getItem('timer_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';}}catch(e){}}
function saveState(){try{localStorage.setItem('timer_v1',JSON.stringify({theme:state.theme}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function setPreset(sec){if(running)stopTimer();total=sec;remaining=sec;updateDisplay();showToast(formatTime(sec)+' set');}
function setCustom(){const m=parseFloat(document.getElementById('customMin').value);if(!m||m<=0){showToast('Enter valid minutes');return;}setPreset(Math.floor(m*60));document.getElementById('customMin').value='';}

function toggleTimer(){
  if(running){stopTimer();}
  else{
    if(remaining<=0){showToast('Set a time first');return;}
    startTimer();
  }
}

function startTimer(){
  running=true;
  document.getElementById('btnText').textContent='Pause';
  document.getElementById('btnIcon').innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  document.getElementById('timeLabel').textContent='Running';
  const endTime=Date.now()+remaining*1000;
  interval=setInterval(()=>{
    const left=(endTime-Date.now())/1000;
    if(left<=0){remaining=0;updateDisplay();stopTimer();finishTimer();return;}
    remaining=left;
    updateDisplay();
  },100);
}

function stopTimer(){
  running=false;
  if(interval)clearInterval(interval);
  interval=null;
  document.getElementById('btnText').textContent='Start';
  document.getElementById('btnIcon').innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
  document.getElementById('timeLabel').textContent=remaining>0?'Paused':'Ready';
}

function resetTimer(){
  stopTimer();
  total=0;remaining=0;
  updateDisplay();
  document.getElementById('timeLabel').textContent='Ready';
}

function finishTimer(){
  playBeep();
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);
  document.getElementById('doneToast').classList.add('show');
  document.getElementById('timeText').classList.remove('warning');
}

function dismissDone(){document.getElementById('doneToast').classList.remove('show');resetTimer();}

function playBeep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(0.3,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+1);
    o.start();o.stop(audioCtx.currentTime+1);
  }catch(e){}
}

function updateDisplay(){
  const t=Math.ceil(remaining);
  document.getElementById('timeText').textContent=formatTime(t);
  document.getElementById('timeText').classList.toggle('warning',t<=10&&t>0);
  const pct=total>0?(1-remaining/total):1;
  const circ=942;
  document.getElementById('ringProg').style.strokeDashoffset=circ*pct;
}

function formatTime(s){
  if(s<0)s=0;
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  if(h>0)return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

let ttm;function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
