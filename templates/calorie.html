<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Calorie Counter</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#0a1a0a;--card:#14301a;--elev:#1e4a28;--text:#dcfce7;--muted:#86efac;--sub:#22c55e;--pri:#84cc16;--orange:#f97316;--red:#ef4444;--grad:linear-gradient(135deg,#84cc16,#22c55e);--bdr:rgba(132,204,22,0.25);--glow:0 0 30px rgba(132,204,22,0.4)}
[data-theme="light"]{--bg:#f7fee7;--card:#fff;--elev:#ecfccb;--text:#1a2e05;--muted:#3f6212;--sub:#84cc16;--bdr:rgba(63,98,18,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(132,204,22,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,26,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(247,254,231,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.main::-webkit-scrollbar{width:0}
.summary{background:linear-gradient(135deg,rgba(132,204,22,0.15),rgba(34,197,94,0.08));border:1px solid var(--bdr);border-radius:20px;padding:20px;width:100%;max-width:440px;text-align:center;position:relative}
.summary-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:6px}
.summary-val{font-size:48px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.summary-goal{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:12px}
.progress{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:var(--grad);border-radius:6px;transition:width 0.4s;box-shadow:0 0 15px rgba(132,204,22,0.5)}
.progress-fill.over{background:linear-gradient(135deg,#f97316,#ef4444)}
.progress-info{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:440px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:14px;text-align:center}
.stat-v{font-size:20px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.section-title{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;width:100%;max-width:440px;padding-left:4px;margin-top:6px}
.meal-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px}
.meal-item{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.meal-icon{width:38px;height:38px;border-radius:12px;background:var(--elev);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.meal-info{flex:1;min-width:0}
.meal-name{font-size:14px;font-weight:700;margin-bottom:2px}
.meal-time{font-size:11px;color:var(--sub)}
.meal-cal{font-size:16px;font-weight:900;color:var(--pri);font-variant-numeric:tabular-nums;flex-shrink:0}
.meal-del{width:30px;height:30px;border-radius:8px;background:rgba(239,68,68,0.1);color:#fca5a5;display:grid;place-items:center;flex-shrink:0}
.meal-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px}
.fab{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(132,204,22,0.5);z-index:100}
.fab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.sheet::-webkit-scrollbar{width:0}
.drag{width:40px;height:4px;background:var(--elev);border-radius:2px;margin:0 auto 16px}
.sheet h3{font-size:18px;margin-bottom:16px;text-align:center;font-weight:800}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--sub);font-weight:800;margin-bottom:6px}
.inp{width:100%;padding:14px;background:var(--bg);border:1px solid var(--bdr);border-radius:12px;color:var(--text);font-size:16px;margin-bottom:14px;font-weight:600}
.inp:focus{border-color:var(--pri)}
.quick-foods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.qf-btn{padding:10px 6px;background:var(--elev);border:1px solid var(--bdr);border-radius:10px;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
.qf-btn:active{transform:scale(0.95);border-color:var(--pri);color:var(--pri)}
.qf-btn .qi{font-size:18px}
.btn-row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.btn{padding:14px;border-radius:12px;background:var(--elev);color:var(--text);font-size:14px;font-weight:700;font-family:inherit;text-align:center;border:1px solid var(--bdr)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(132,204,22,0.4)}
.tt{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">🔥</div><span>Calorie Counter</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="summary">
<div class="summary-label">Calories Today</div>
<div class="summary-val" id="totalCal">0</div>
<div class="summary-goal">of <span id="goalVal">2000</span> kcal goal</div>
<div class="progress"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
<div class="progress-info"><span id="pctText">0%</span><span id="remainText">2000 left</span></div>
</div>

<div class="stats-grid">
<div class="stat"><div class="stat-v" id="stMeals">0</div><div class="stat-l">Meals</div></div>
<div class="stat"><div class="stat-v" id="stAvg">0</div><div class="stat-l">Avg/Meal</div></div>
<div class="stat"><div class="stat-v" id="stGoal">2000</div><div class="stat-l">Goal</div></div>
</div>

<div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
<span>Today's Meals</span>
<button onclick="editGoal()" style="font-size:11px;color:var(--pri);font-weight:700">Edit Goal</button>
</div>
<div class="meal-list" id="mealList"></div>
</main>

<button class="fab" onclick="openModal()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet">
<div class="drag"></div>
<h3>Add Meal</h3>
<div class="lbl">Quick Add</div>
<div class="quick-foods">
<button class="qf-btn" onclick="quickAdd('Rice (1 cup)',206)"><span class="qi">🍚</span>Rice</button>
<button class="qf-btn" onclick="quickAdd('Chicken (100g)',165)"><span class="qi">🍗</span>Chicken</button>
<button class="qf-btn" onclick="quickAdd('Apple',95)"><span class="qi">🍎</span>Apple</button>
<button class="qf-btn" onclick="quickAdd('Bread slice',79)"><span class="qi">🍞</span>Bread</button>
</div>
<div class="lbl">Meal Name</div>
<input type="text" class="inp" id="inpName" placeholder="e.g. Breakfast, Lunch...">
<div class="lbl">Calories (kcal)</div>
<input type="number" class="inp" id="inpCal" placeholder="e.g. 350" inputmode="numeric">
<div class="btn-row">
<button class="btn" onclick="closeModal()">Cancel</button>
<button class="btn primary" onclick="addMeal()">Add Meal</button>
</div>
</div>
</div>

<div class="tt" id="toast"><span id="tt-txt">Saved</span></div>

<script>
let state={theme:'dark',goal:2000,meals:[],date:null};
let ttm;
function init(){loadState();checkNewDay();applyTheme();render();}
function loadState(){try{const s=localStorage.getItem('cal_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.goal=p.goal||2000;state.meals=p.meals||[];state.date=p.date;}}catch(e){}}
function saveState(){try{localStorage.setItem('cal_v1',JSON.stringify({theme:state.theme,goal:state.goal,meals:state.meals,date:state.date}));}catch(e){}}
function checkNewDay(){const today=new Date().toDateString();if(state.date&&state.date!==today){state.meals=[];state.date=today;saveState();}else if(!state.date){state.date=today;saveState();}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function openModal(){document.getElementById('inpName').value='';document.getElementById('inpCal').value='';document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('inpName').focus(),200);}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function quickAdd(name,cal){addMealData(name,cal);}
function addMeal(){const n=document.getElementById('inpName').value.trim();const c=parseInt(document.getElementById('inpCal').value);if(!n){showToast('Enter meal name');return;}if(!c||c<=0){showToast('Enter valid calories');return;}addMealData(n,c);}
function addMealData(name,cal){
  state.meals.push({id:Date.now(),name:name,cal:cal,time:new Date().toISOString()});
  saveState();closeModal();render();
  if(navigator.vibrate)navigator.vibrate(30);
  showToast('+'+cal+' kcal');
}

function render(){
  const total=state.meals.reduce((s,m)=>s+m.cal,0);
  const pct=Math.min(Math.round(total/state.goal*100),100);
  const over=total>state.goal;
  document.getElementById('totalCal').textContent=total;
  document.getElementById('goalVal').textContent=state.goal;
  document.getElementById('stGoal').textContent=state.goal;
  const fill=document.getElementById('progFill');
  fill.style.width=pct+'%';
  fill.classList.toggle('over',over);
  document.getElementById('pctText').textContent=pct+'%';
  const remain=state.goal-total;
  document.getElementById('remainText').textContent=over?Math.abs(remain)+' over':remain+' left';
  document.getElementById('stMeals').textContent=state.meals.length;
  document.getElementById('stAvg').textContent=state.meals.length?Math.round(total/state.meals.length):0;
  const el=document.getElementById('mealList');
  if(!state.meals.length){el.innerHTML='<div class="empty">No meals logged yet.<br>Tap + to add your first meal.</div>';return;}
  el.innerHTML=state.meals.slice().reverse().map(m=>{
    const t=new Date(m.time);
    const tstr=t.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    return '<div class="meal-item"><div class="meal-icon">🍽️</div><div class="meal-info"><div class="meal-name">'+esc(m.name)+'</div><div class="meal-time">'+tstr+'</div></div><div class="meal-cal">'+m.cal+'</div><button class="meal-del" onclick="deleteMeal('+m.id+')"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button></div>';
  }).join('');
}

function deleteMeal(id){state.meals=state.meals.filter(m=>m.id!==id);saveState();render();}
function editGoal(){const v=prompt('Set daily calorie goal:',state.goal);if(v===null)return;const n=parseInt(v);if(n&&n>0&&n<=10000){state.goal=n;saveState();render();showToast('Goal: '+n);}else showToast('Invalid');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
