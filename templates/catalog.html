<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Product Catalog</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#050c1a;--card:#0f1e3d;--elev:#1a2d54;--text:#dbeafe;--muted:#93c5fd;--sub:#3b82f6;--pri:#2563eb;--cyan:#06b6d4;--green:#10b981;--red:#ef4444;--gold:#fbbf24;--grad:linear-gradient(135deg,#2563eb,#06b6d4);--bdr:rgba(37,99,235,0.25);--glow:0 0 30px rgba(37,99,235,0.4)}
[data-theme="light"]{--bg:#eff6ff;--card:#fff;--elev:#dbeafe;--text:#1e3a8a;--muted:#1d4ed8;--sub:#93c5fd;--bdr:rgba(30,58,138,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(37,99,235,0.1),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(5,12,26,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(239,246,255,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:12px}
.main::-webkit-scrollbar{width:0}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.search svg{width:16px;height:16px;stroke:var(--sub);fill:none;stroke-width:2}
.search input{flex:1;background:none;border:none;color:var(--text);font-size:13px;font-weight:600}
.search input::placeholder{color:var(--sub)}
.cat-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0;margin-bottom:12px}
.cat-row::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bdr);color:var(--muted);font-size:12px;font-weight:800;transition:all .2s;display:flex;align-items:center;gap:5px}
.cat-chip.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(37,99,235,0.4)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.product{background:var(--card);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;transition:all .2s;cursor:pointer;position:relative}
.product:active{transform:scale(0.97)}
.product-img{aspect-ratio:1;background:linear-gradient(135deg,rgba(37,99,235,0.15),rgba(6,182,212,0.1));display:grid;place-items:center;font-size:56px;position:relative;overflow:hidden}
.product-img::before{content:'';position:absolute;top:-30%;right:-30%;width:100%;height:100%;background:radial-gradient(circle,rgba(255,255,255,0.15),transparent 70%)}
.badge{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:6px;font-size:9px;font-weight:900;letter-spacing:0.5px}
.badge.new{background:var(--gold);color:#000}
.badge.sale{background:var(--red);color:#fff}
.product-info{padding:12px}
.product-name{font-size:13px;font-weight:800;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.product-desc{font-size:10px;color:var(--sub);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.price{font-size:16px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums}
.old-price{font-size:11px;color:var(--sub);text-decoration:line-through}
.add-btn{width:100%;padding:9px;border-radius:10px;background:var(--elev);color:var(--text);font-size:11px;font-weight:800;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.add-btn:active{transform:scale(0.95)}
.add-btn.in-cart{background:var(--grad);color:#fff}
.add-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3}
.rating{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--gold);font-weight:800;margin-bottom:6px}
.rating .count{color:var(--sub);font-weight:600}
.cart-btn{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(37,99,235,0.5);z-index:100;font-size:24px}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--green);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
.sheet::-webkit-scrollbar{width:0}
.drag{width:40px;height:4px;background:var(--elev);border-radius:2px;margin:0 auto 16px}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bdr)}
.cart-item:last-child{border-bottom:none}
.ci-img{width:48px;height:48px;border-radius:12px;background:var(--elev);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-price{font-size:11px;color:var(--sub)}
.ci-qty{display:flex;align-items:center;gap:6px}
.qty-btn{width:26px;height:26px;border-radius:50%;background:var(--elev);color:var(--text);font-size:14px;font-weight:800;display:grid;place-items:center}
.ci-qty-val{font-size:13px;font-weight:800;min-width:18px;text-align:center}
.ci-total{font-size:13px;font-weight:900;color:var(--pri);min-width:55px;text-align:right}
.cart-total{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:2px solid var(--bdr);margin-top:8px;font-size:14px;font-weight:800}
.cart-total-val{font-size:20px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:14px;border-radius:12px;background:var(--elev);color:var(--text);font-size:13px;font-weight:800;font-family:inherit;width:100%;text-align:center;margin-top:10px;border:1px solid var(--bdr)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(37,99,235,0.4)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px;grid-column:span 2}
.tt{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">🛍️</div><span>Product Catalog</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="search">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
<input type="text" id="searchInput" placeholder="Search products..." oninput="renderProducts()">
</div>
<div class="cat-row" id="catRow"></div>
<div class="grid" id="productGrid"></div>
</main>

<button class="cart-btn" onclick="openCart()">🛒<span class="cart-badge" id="cartBadge">0</span></button>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet">
<div class="drag"></div>
<h3 style="text-align:center;margin-bottom:16px;font-size:18px;font-weight:800">Your Cart</h3>
<div id="cartItems"></div>
<div class="cart-total"><span>Total</span><span class="cart-total-val" id="cartTotal">PKR 0</span></div>
<div class="btn-row">
<button class="btn" onclick="clearCart()" style="margin-top:0">Clear</button>
<button class="btn primary" onclick="checkout()" style="margin-top:0">Checkout</button>
</div>
</div>
</div>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<script>
const PRODUCTS=[
{id:1,n:'Wireless Headphones',d:'Premium noise-cancelling',e:'🎧',p:4999,op:6999,c:'electronics',r:4.8,rc:234,b:'sale'},
{id:2,n:'Smart Watch',d:'Fitness tracking smartwatch',e:'⌚',p:8999,op:null,c:'electronics',r:4.6,rc:178,b:'new'},
{id:3,n:'Bluetooth Speaker',d:'Waterproof portable speaker',e:'🔊',p:2999,op:null,c:'electronics',r:4.7,rc:456,b:null},
{id:4,n:'Phone Case',d:'Shockproof protection',e:'📱',p:499,op:699,c:'electronics',r:4.4,rc:892,b:'sale'},
{id:5,n:'Cotton T-Shirt',d:'Soft breathable cotton',e:'👕',p:899,op:null,c:'fashion',r:4.5,rc:1234,b:null},
{id:6,n:'Denim Jeans',d:'Classic blue denim',e:'👖',p:1999,op:2499,c:'fashion',r:4.3,rc:567,b:'sale'},
{id:7,n:'Leather Wallet',d:'Genuine leather wallet',e:'👛',p:1299,op:null,c:'fashion',r:4.6,rc:234,b:null},
{id:8,n:'Sunglasses',d:'UV protection shades',e:'🕶️',p:799,op:null,c:'fashion',r:4.2,rc:456,b:'new'},
{id:9,n:'Coffee Mug',d:'Ceramic 350ml mug',e:'☕',p:399,op:null,c:'home',r:4.7,rc:789,b:null},
{id:10,n:'Desk Lamp',d:'LED adjustable lamp',e:'💡',p:1599,op:1999,c:'home',r:4.5,rc:345,b:'sale'},
{id:11,n:'Throw Pillow',d:'Decorative cushion',e:'🛋️',p:699,op:null,c:'home',r:4.4,rc:123,b:null},
{id:12,n:'Wall Clock',d:'Modern minimalist clock',e:'🕐',p:1199,op:null,c:'home',r:4.6,rc:234,b:'new'},
{id:13,n:'Backpack',d:'Water-resistant daypack',e:'🎒',p:2499,op:2999,c:'sports',r:4.8,rc:567,b:'sale'},
{id:14,n:'Water Bottle',d:'Insulated steel bottle',e:'🍶',p:899,op:null,c:'sports',r:4.5,rc:890,b:null},
{id:15,n:'Yoga Mat',d:'Non-slip exercise mat',e:'🧘',p:1499,op:null,c:'sports',r:4.7,rc:456,b:null},
{id:16,n:'Running Shoes',d:'Lightweight sports shoes',e:'👟',p:3999,op:4999,c:'sports',r:4.6,rc:678,b:'sale'}
];
const CATS=[{id:'all',n:'All',i:'📦'},{id:'electronics',n:'Electronics',i:'📱'},{id:'fashion',n:'Fashion',i:'👕'},{id:'home',n:'Home',i:'🏠'},{id:'sports',n:'Sports',i:'⚽'}];
let state={theme:'dark',cat:'all',cart:{},search:''};
let ttm;
function init(){loadState();applyTheme();renderCats();renderProducts();updateCartBadge();}
function loadState(){try{const s=localStorage.getItem('cat_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.cart=p.cart||{};}}catch(e){}}
function saveState(){try{localStorage.setItem('cat_v1',JSON.stringify({theme:state.theme,cart:state.cart}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function renderCats(){
  document.getElementById('catRow').innerHTML=CATS.map(c=>'<button class="cat-chip '+(c.id===state.cat?'active':'')+'" onclick="setCat(\''+c.id+'\')">'+c.i+' '+c.n+'</button>').join('');
}
function setCat(c){state.cat=c;renderCats();renderProducts();}

function renderProducts(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  state.search=q;
  let list=state.cat==='all'?PRODUCTS:PRODUCTS.filter(p=>p.c===state.cat);
  if(q)list=list.filter(p=>p.n.toLowerCase().includes(q)||p.d.toLowerCase().includes(q));
  const el=document.getElementById('productGrid');
  if(!list.length){el.innerHTML='<div class="empty">No products found</div>';return;}
  el.innerHTML=list.map(p=>{
    const inCart=state.cart[p.id]||0;
    let badge='';
    if(p.b==='new')badge='<span class="badge new">NEW</span>';
    else if(p.b==='sale')badge='<span class="badge sale">SALE</span>';
    const oldPrice=p.op?'<span class="old-price">PKR '+p.op+'</span>':'';
    return '<div class="product" onclick="addToCart('+p.id+')"><div class="product-img">'+badge+p.e+'</div><div class="product-info"><div class="product-name">'+p.n+'</div><div class="product-desc">'+p.d+'</div><div class="rating">★ '+p.r.toFixed(1)+' <span class="count">('+p.rc+')</span></div><div class="price-row"><span class="price">PKR '+p.p+'</span>'+oldPrice+'</div><button class="add-btn '+(inCart?'in-cart':'')+'" onclick="event.stopPropagation();'+(inCart?'removeFromCart('+p.id+')':'addToCart('+p.id+')')+'">'+(inCart?'<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>In Cart ('+inCart+')':'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add to Cart')+'</button></div></div>';
  }).join('');
}

function addToCart(id){
  state.cart[id]=(state.cart[id]||0)+1;
  saveState();updateCartBadge();renderProducts();
  const p=PRODUCTS.find(x=>x.id===id);
  showToast('Added: '+p.n);
  if(navigator.vibrate)navigator.vibrate(20);
}
function removeFromCart(id){
  if(!state.cart[id])return;
  state.cart[id]--;
  if(state.cart[id]<=0)delete state.cart[id];
  saveState();updateCartBadge();renderProducts();
  if(document.getElementById('modal').classList.contains('show'))renderCart();
}
function updateCartBadge(){
  const count=Object.values(state.cart).reduce((s,q)=>s+q,0);
  document.getElementById('cartBadge').textContent=count;
}
function openCart(){
  if(Object.keys(state.cart).length===0){showToast('Cart is empty');return;}
  renderCart();
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function renderCart(){
  const el=document.getElementById('cartItems');
  let total=0;
  const items=Object.keys(state.cart).map(id=>{
    const p=PRODUCTS.find(x=>x.id===+id);
    const qty=state.cart[id];
    const sub=p.p*qty;
    total+=sub;
    return '<div class="cart-item"><div class="ci-img">'+p.e+'</div><div class="ci-info"><div class="ci-name">'+p.n+'</div><div class="ci-price">PKR '+p.p+'</div></div><div class="ci-qty"><button class="qty-btn" onclick="removeFromCart('+p.id+')">−</button><span class="ci-qty-val">'+qty+'</span><button class="qty-btn" onclick="addToCart('+p.id+')">+</button></div><div class="ci-total">'+sub+'</div></div>';
  }).join('');
  el.innerHTML=items;
  document.getElementById('cartTotal').textContent='PKR '+total;
}
function clearCart(){if(!confirm('Clear cart?'))return;state.cart={};saveState();updateCartBadge();renderProducts();closeModal();showToast('Cart cleared');}
function checkout(){
  let total=0;
  let txt='🛍️ Order:\n\n';
  Object.keys(state.cart).forEach(id=>{const p=PRODUCTS.find(x=>x.id===+id);const sub=p.p*state.cart[id];total+=sub;txt+='• '+p.n+' × '+state.cart[id]+' = PKR '+sub+'\n';});
  txt+='\nTotal: PKR '+total;
  if(navigator.share){navigator.share({title:'My Order',text:txt}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>showToast('Order copied'));}
}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
