<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tic Tac Toe</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#050816;--card:#0f172a;--elev:#1e293b;--text:#e0f2fe;--muted:#67e8f9;--sub:#06b6d4;--pri:#06b6d4;--x-color:#f472b6;--o-color:#38bdf8;--grad:linear-gradient(135deg,#06b6d4,#3b82f6);--bdr:rgba(6,182,212,0.25);--glow:0 0 30px rgba(6,182,212,0.5)}
[data-theme="light"]{--bg:#f0f9ff;--card:#fff;--elev:#e0f2fe;--text:#082f49;--muted:#0891b2;--sub:#67e8f9;--bdr:rgba(8,145,178,0.2)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(6,182,212,0.1),transparent 40%),radial-gradient(circle at 80% 90%,rgba(244,114,182,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(5,8,22,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(240,249,255,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.main::-webkit-scrollbar{width:0}
.status{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:16px 24px;text-align:center;width:100%;max-width:400px}
.status-lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:2px;font-weight:800;margin-bottom:6px}
.status-val{font-size:20px;font-weight:900;color:var(--pri);display:flex;align-items:center;justify-content:center;gap:10px}
.status-val .mark{font-size:32px;line-height:1}
.status-val .x-mark{color:var(--x-color);text-shadow:0 0 20px var(--x-color)}
.status-val .o-mark{color:var(--o-color);text-shadow:0 0 20px var(--o-color)}
.scores{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;max-width:400px}
.score-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px 8px;text-align:center}
.score-name{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:6px}
.score-num{font-size:22px;font-weight:900;line-height:1}
.score-card.x .score-num{color:var(--x-color)}
.score-card.o .score-num{color:var(--o-color)}
.score-card.d .score-num{color:var(--muted)}
.board{background:var(--card);border:1px solid var(--bdr);border-radius:24px;padding:16px;width:min(360px,92vw);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;box-shadow:var(--glow)}
.cell{background:var(--elev);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;line-height:1;transition:all .2s;position:relative;overflow:hidden}
.cell:active{transform:scale(0.96)}
.cell:not(.taken):hover{background:rgba(6,182,212,0.15)}
.cell.x{color:var(--x-color);text-shadow:0 0 30px var(--x-color)}
.cell.o{color:var(--o-color);text-shadow:0 0 30px var(--o-color)}
.cell .symbol{animation:markIn 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes markIn{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
.cell.winning{background:linear-gradient(135deg,rgba(6,182,212,0.3),rgba(59,130,246,0.2));border:2px solid var(--pri);box-shadow:0 0 30px var(--pri),inset 0 0 20px rgba(6,182,212,0.3)}
.cell.winning .symbol{animation:winPulse 0.6s infinite}
@keyframes winPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px}
.btn{padding:16px;border-radius:14px;background:var(--elev);color:var(--text);font-size:14px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bdr)}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(6,182,212,0.4)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:5px;width:100%;max-width:400px}
.mode-tab{padding:12px;border-radius:10px;font-size:13px;font-weight:800;color:var(--muted);text-align:center;transition:all .2s}
.mode-tab.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(6,182,212,0.4)}
.overlay{position:fixed;inset:0;background:rgba(5,8,22,0.9);backdrop-filter:blur(10px);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.overlay.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ov-emoji{font-size:80px;margin-bottom:16px;animation:bounce 0.6s}
@keyframes bounce{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.ov-title{font-size:32px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.ov-sub{font-size:15px;color:var(--muted);margin-bottom:28px;line-height:1.6}
.ov-btn{padding:16px 40px;border-radius:14px;background:var(--grad);color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 20px rgba(6,182,212,0.4)}
.ov-btn:active{transform:scale(0.95)}
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">⭕</div><span>Tic Tac Toe</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="mode-toggle">
<button class="mode-tab active" id="modeAI" onclick="setMode('ai')">🤖 vs AI</button>
<button class="mode-tab" id="modePvP" onclick="setMode('pvp')">👥 2 Player</button>
</div>

<div class="status">
<div class="status-lbl" id="statusLbl">Your Turn</div>
<div class="status-val" id="statusVal"><span class="x-mark">✕</span></div>
</div>

<div class="scores">
<div class="score-card x"><div class="score-name">✕ X</div><div class="score-num" id="xWins">0</div></div>
<div class="score-card d"><div class="score-name">Draw</div><div class="score-num" id="draws">0</div></div>
<div class="score-card o"><div class="score-name">◯ O</div><div class="score-num" id="oWins">0</div></div>
</div>

<div class="board" id="board"></div>

<div class="actions">
<button class="btn primary" onclick="newRound()"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>New Round</button>
<button class="btn" onclick="resetScores()"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>Reset All</button>
</div>
</main>

<div class="overlay" id="overlay">
<div class="ov-emoji" id="ovEmoji">🎉</div>
<div class="ov-title" id="ovTitle">You Win!</div>
<div class="ov-sub" id="ovSub">Great job!</div>
<button class="ov-btn" onclick="closeOverlay()">Play Again</button>
</div>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<script>
const WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let state={theme:'dark',board:Array(9).fill(''),current:'X',gameOver:false,mode:'ai',xWins:0,oWins:0,draws:0,winLine:null};
let ttm;
function init(){loadState();applyTheme();renderBoard();updateStatus();updateScores();}
function loadState(){try{const s=localStorage.getItem('ttt_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.mode=p.mode||'ai';state.xWins=p.xWins||0;state.oWins=p.oWins||0;state.draws=p.draws||0;}}catch(e){}}
function saveState(){try{localStorage.setItem('ttt_v1',JSON.stringify({theme:state.theme,mode:state.mode,xWins:state.xWins,oWins:state.oWins,draws:state.draws}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function setMode(m){state.mode=m;document.getElementById('modeAI').classList.toggle('active',m==='ai');document.getElementById('modePvP').classList.toggle('active',m==='pvp');newRound();saveState();}

function renderBoard(){
  const el=document.getElementById('board');
  el.innerHTML=state.board.map((v,i)=>{
    const cls=v.toLowerCase();
    const isWin=state.winLine&&state.winLine.includes(i);
    return '<div class="cell '+(v?cls+' taken':'')+(isWin?' winning':'')+'" onclick="makeMove('+i+')">'+(v?'<span class="symbol">'+(v==='X'?'✕':'◯')+'</span>':'')+'</div>';
  }).join('');
}

function makeMove(i){
  if(state.gameOver||state.board[i])return;
  if(state.mode==='ai'&&state.current!=='X')return;
  placeMark(i,state.current);
  if(state.gameOver)return;
  if(state.mode==='ai'&&!state.gameOver&&state.current==='O'){setTimeout(aiMove,350);}
}

function placeMark(i,p){
  state.board[i]=p;
  if(navigator.vibrate)navigator.vibrate(20);
  const w=checkWin();
  if(w){
    state.winLine=w.line;
    state.gameOver=true;
    if(w.player==='X')state.xWins++;else state.oWins++;
    saveState();renderBoard();updateScores();
    setTimeout(()=>showWin(w.player),400);
    return;
  }
  if(state.board.every(c=>c)){state.gameOver=true;state.draws++;saveState();renderBoard();updateScores();setTimeout(()=>showDraw(),400);return;}
  state.current=state.current==='X'?'O':'X';
  renderBoard();updateStatus();
}

function checkWin(){
  for(const line of WINS){
    const[a,b,c]=line;
    if(state.board[a]&&state.board[a]===state.board[b]&&state.board[a]===state.board[c]){return{player:state.board[a],line};}
  }
  return null;
}

function aiMove(){
  if(state.gameOver)return;
  const empty=state.board.map((v,i)=>v?null:i).filter(v=>v!==null);
  if(empty.length===0)return;
  // Try to win
  let move=findMove('O');
  if(move===null)move=findMove('X');
  if(move===null&&state.board[4]==='')move=4;
  if(move===null&&[0,2,6,8].some(i=>state.board[i]==='')){const corners=[0,2,6,8].filter(i=>!state.board[i]);move=corners[Math.floor(Math.random()*corners.length)];}
  if(move===null)move=empty[Math.floor(Math.random()*empty.length)];
  placeMark(move,'O');
}

function findMove(p){
  for(const line of WINS){
    const[a,b,c]=line;
    const vals=[state.board[a],state.board[b],state.board[c]];
    const emptyIdx=[a,b,c].filter(i=>!state.board[i]);
    if(vals.filter(v=>v===p).length===2&&emptyIdx.length===1)return emptyIdx[0];
  }
  return null;
}

function updateStatus(){
  const lbl=document.getElementById('statusLbl');
  const val=document.getElementById('statusVal');
  if(state.gameOver){lbl.textContent='Game Over';return;}
  if(state.mode==='ai'){
    lbl.textContent=state.current==='X'?'Your Turn':'AI Thinking...';
  }else{
    lbl.textContent='Player '+state.current+' Turn';
  }
  val.innerHTML=state.current==='X'?'<span class="x-mark">✕</span>':'<span class="o-mark">◯</span>';
}

function updateScores(){document.getElementById('xWins').textContent=state.xWins;document.getElementById('oWins').textContent=state.oWins;document.getElementById('draws').textContent=state.draws;}

function showWin(p){
  const ov=document.getElementById('overlay');
  const emoji=document.getElementById('ovEmoji');
  const title=document.getElementById('ovTitle');
  const sub=document.getElementById('ovSub');
  if(state.mode==='ai'){
    if(p==='X'){emoji.textContent='🎉';title.textContent='You Win!';sub.textContent='Amazing! You beat the AI.';}
    else{emoji.textContent='🤖';title.textContent='AI Wins!';sub.textContent='Try again to beat the computer.';}
  }else{
    emoji.textContent='🏆';title.textContent='Player '+p+' Wins!';sub.textContent='Well played!';
  }
  ov.classList.add('show');
  if(navigator.vibrate)navigator.vibrate([100,50,100]);
}

function showDraw(){
  document.getElementById('ovEmoji').textContent='🤝';
  document.getElementById('ovTitle').textContent="It's a Draw!";
  document.getElementById('ovSub').textContent='Nobody wins this time.';
  document.getElementById('overlay').classList.add('show');
  if(navigator.vibrate)navigator.vibrate(100);
}

function closeOverlay(){document.getElementById('overlay').classList.remove('show');newRound();}

function newRound(){
  state.board=Array(9).fill('');
  state.current='X';
  state.gameOver=false;
  state.winLine=null;
  renderBoard();
  updateStatus();
}

function resetScores(){
  if(!confirm('Reset all scores?'))return;
  state.xWins=0;state.oWins=0;state.draws=0;
  saveState();updateScores();newRound();showToast('Scores reset');
}

function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
