<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Percentage Calculator</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#0a0e28;--card:#141c4a;--elev:#1e2a68;--text:#e0e7ff;--muted:#a5b4fc;--sub:#6366f1;--pri:#6366f1;--grad:linear-gradient(135deg,#6366f1,#8b5cf6);--gold:#fbbf24;--bdr:rgba(99,102,241,0.22)}
[data-theme="light"]{--bg:#eef2ff;--card:#fff;--elev:#e0e7ff;--text:#1e1b4b;--muted:#4338ca;--sub:#a5b4fc;--bdr:rgba(67,56,202,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(99,102,241,0.12),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,14,40,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(238,242,255,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px}
.main::-webkit-scrollbar{width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:5px;margin-bottom:16px}
.tab{padding:10px 4px;border-radius:10px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;transition:all .2s;line-height:1.2}
.tab.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,0.4)}
.tab:active{transform:scale(0.95)}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:20px;margin-bottom:14px}
.formula{font-size:13px;color:var(--sub);text-align:center;margin-bottom:16px;font-style:italic;padding:10px;background:var(--elev);border-radius:12px;font-weight:600}
.field{margin-bottom:14px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--sub);font-weight:700;margin-bottom:8px}
.inp{width:100%;padding:16px;background:var(--bg);border:2px solid var(--bdr);border-radius:14px;color:var(--text);font-size:22px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;outline:none;transition:all .2s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(99,102,241,0.15)}
.inp::placeholder{color:var(--sub);font-weight:500}
.result-card{background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.08));border:1px solid var(--bdr);border-radius:20px;padding:24px;text-align:center;margin-bottom:14px}
.result-lbl{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:8px}
.result-val{font-size:52px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px;word-wrap:break-word;word-break:break-all}
.result-sub{font-size:13px;color:var(--muted);line-height:1.6}
.btn{width:100%;padding:16px;border-radius:14px;background:var(--grad);color:#fff;font-size:15px;font-weight:800;font-family:inherit;box-shadow:0 6px 20px rgba(99,102,241,0.4);margin-bottom:10px}
.btn:active{transform:scale(0.98)}
.btn-secondary{padding:14px;border-radius:12px;background:var(--elev);color:var(--text);font-size:14px;font-weight:700;font-family:inherit;border:1px solid var(--bdr);width:100%}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.info-box{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px}
.info-box-lbl{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:6px}
.info-box-val{font-size:16px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums;word-break:break-all}
.hint{font-size:12px;color:var(--sub);line-height:1.6;text-align:center;padding:10px;margin-top:14px}
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:200}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">📊</div><span>Percentage</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="tabs">
<button class="tab active" data-m="p1" onclick="setMode('p1')">X% of Y</button>
<button class="tab" data-m="p2" onclick="setMode('p2')">X is what % of Y</button>
<button class="tab" data-m="p3" onclick="setMode('p3')">% Increase</button>
<button class="tab" data-m="p4" onclick="setMode('p4')">% Decrease</button>
</div>

<div id="modeContent"></div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Done</span></div>

<script>
let state={theme:'dark',mode:'p1'};
let ttm;
function init(){loadState();applyTheme();renderMode();}
function loadState(){try{const s=localStorage.getItem('pct_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.mode=p.mode||'p1';}}catch(e){}}
function saveState(){try{localStorage.setItem('pct_v1',JSON.stringify({theme:state.theme,mode:state.mode}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function setMode(m){
  state.mode=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.m===m));
  saveState();
  renderMode();
}

function renderMode(){
  const el=document.getElementById('modeContent');
  let html='';
  if(state.mode==='p1'){
    html+='<div class="card"><div class="formula">Result = (X ÷ 100) × Y</div><div class="field"><div class="lbl">X (Percent)</div><input type="number" class="inp" id="inX" placeholder="25" inputmode="decimal" oninput="calcP1()"></div><div class="field"><div class="lbl">Y (Total Value)</div><input type="number" class="inp" id="inY" placeholder="200" inputmode="decimal" oninput="calcP1()"></div></div>';
    html+='<div class="result-card" id="resCard" style="display:none"><div class="result-lbl">Result</div><div class="result-val" id="resVal">0</div><div class="result-sub" id="resSub"></div></div>';
    html+='<button class="btn" onclick="calcP1(true)">Calculate</button><button class="btn-secondary" onclick="reset()">Reset</button>';
    html+='<div class="info-grid" id="infoGrid" style="display:none"><div class="info-box"><div class="info-box-lbl">Percentage</div><div class="info-box-val" id="ibP">—</div></div><div class="info-box"><div class="info-box-lbl">Formula</div><div class="info-box-val" style="font-size:12px" id="ibF">—</div></div></div>';
  }
  else if(state.mode==='p2'){
    html+='<div class="card"><div class="formula">Percentage = (X ÷ Y) × 100</div><div class="field"><div class="lbl">X (Part)</div><input type="number" class="inp" id="inX" placeholder="50" inputmode="decimal" oninput="calcP2()"></div><div class="field"><div class="lbl">Y (Whole)</div><input type="number" class="inp" id="inY" placeholder="200" inputmode="decimal" oninput="calcP2()"></div></div>';
    html+='<div class="result-card" id="resCard" style="display:none"><div class="result-lbl">Result</div><div class="result-val" id="resVal">0</div><div class="result-sub" id="resSub"></div></div>';
    html+='<button class="btn" onclick="calcP2(true)">Calculate</button><button class="btn-secondary" onclick="reset()">Reset</button>';
  }
  else if(state.mode==='p3'){
    html+='<div class="card"><div class="formula">Increase % = ((New − Old) ÷ Old) × 100</div><div class="field"><div class="lbl">Old Value</div><input type="number" class="inp" id="inX" placeholder="100" inputmode="decimal" oninput="calcP3()"></div><div class="field"><div class="lbl">New Value</div><input type="number" class="inp" id="inY" placeholder="150" inputmode="decimal" oninput="calcP3()"></div></div>';
    html+='<div class="result-card" id="resCard" style="display:none"><div class="result-lbl">Increase</div><div class="result-val" id="resVal">0</div><div class="result-sub" id="resSub"></div></div>';
    html+='<button class="btn" onclick="calcP3(true)">Calculate</button><button class="btn-secondary" onclick="reset()">Reset</button>';
  }
  else{
    html+='<div class="card"><div class="formula">Decrease % = ((Old − New) ÷ Old) × 100</div><div class="field"><div class="lbl">Old Value</div><input type="number" class="inp" id="inX" placeholder="200" inputmode="decimal" oninput="calcP4()"></div><div class="field"><div class="lbl">New Value</div><input type="number" class="inp" id="inY" placeholder="150" inputmode="decimal" oninput="calcP4()"></div></div>';
    html+='<div class="result-card" id="resCard" style="display:none"><div class="result-lbl">Decrease</div><div class="result-val" id="resVal">0</div><div class="result-sub" id="resSub"></div></div>';
    html+='<button class="btn" onclick="calcP4(true)">Calculate</button><button class="btn-secondary" onclick="reset()">Reset</button>';
  }
  html+='<div class="hint">💡 Values update in real-time as you type</div>';
  el.innerHTML=html;
}

function getVals(){const x=parseFloat(document.getElementById('inX')?.value)||0;const y=parseFloat(document.getElementById('inY')?.value)||0;return[x,y];}
function showRes(val,sub,lbl){
  const c=document.getElementById('resCard');
  if(!c)return;
  c.style.display='block';
  document.getElementById('resVal').textContent=val;
  document.getElementById('resSub').textContent=sub;
  if(lbl)document.querySelector('#resCard .result-lbl').textContent=lbl;
}

function calcP1(toast){
  const[x,y]=getVals();
  if(!x||!y)return;
  const r=(x/100)*y;
  showRes(fmt(r),x+'% of '+y+' = '+fmt(r),'Result');
  const ig=document.getElementById('infoGrid');
  if(ig){ig.style.display='grid';document.getElementById('ibP').textContent=x+'%';document.getElementById('ibF').textContent='('+x+'/100) × '+y;}
  if(toast)showToast('Result: '+fmt(r));
}

function calcP2(toast){
  const[x,y]=getVals();
  if(!x||!y)return;
  const r=(x/y)*100;
  showRes(fmt(r)+'%',x+' is '+fmt(r)+'% of '+y,'Percentage');
  if(toast)showToast(x+' is '+fmt(r)+'% of '+y);
}

function calcP3(toast){
  const[o,n]=getVals();
  if(!o||!n)return;
  const r=((n-o)/o)*100;
  const sign=r>=0?'+':'';
  showRes(sign+fmt(r)+'%',(r>=0?'Increased':'Decreased')+' by '+fmt(Math.abs(r))+'%','Change');
  if(toast)showToast(sign+fmt(r)+'%');
}

function calcP4(toast){
  const[o,n]=getVals();
  if(!o||!n)return;
  const r=((o-n)/o)*100;
  showRes(fmt(Math.abs(r))+'%',(r>=0?'Decreased':'Increased')+' by '+fmt(Math.abs(r))+'%','Change');
  if(toast)showToast(fmt(Math.abs(r))+'%');
}

function fmt(n){
  if(n===0)return'0';
  if(Math.abs(n)>=1e9||(Math.abs(n)<1e-4))return n.toExponential(4);
  const r=Math.round(n*1e6)/1e6;
  if(Number.isInteger(r))return r.toString();
  return r.toLocaleString('en-US',{maximumFractionDigits:6});
}
function reset(){document.getElementById('inX').value='';document.getElementById('inY').value='';const c=document.getElementById('resCard');if(c)c.style.display='none';const ig=document.getElementById('infoGrid');if(ig)ig.style.display='none';}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
