<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Memory Match</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#1a0a28;--card:#2d1548;--elev:#3d1f5e;--text:#f3e8ff;--muted:#c084fc;--sub:#a855f7;--pri:#ec4899;--blue:#3b82f6;--green:#10b981;--gold:#fbbf24;--grad:linear-gradient(135deg,#ec4899,#a855f7);--bdr:rgba(236,72,153,0.25);--glow:0 0 30px rgba(236,72,153,0.5)}
[data-theme="light"]{--bg:#fdf4ff;--card:#fff;--elev:#fae8ff;--text:#4a044e;--muted:#a21caf;--sub:#d946ef;--bdr:rgba(162,28,175,0.2)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(236,72,153,0.1),transparent 40%),radial-gradient(circle at 80% 90%,rgba(168,85,247,0.1),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(26,10,40,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(253,244,255,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.main::-webkit-scrollbar{width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:440px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px 8px;text-align:center}
.stat-v{font-size:22px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.diff-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:5px;width:100%;max-width:440px}
.diff-btn{padding:10px;border-radius:10px;font-size:12px;font-weight:800;color:var(--muted);text-align:center;transition:all .2s}
.diff-btn.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(236,72,153,0.4)}
.board{background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:14px;width:100%;max-width:440px;box-shadow:var(--glow)}
.grid{display:grid;gap:10px;width:100%}
.grid.easy{grid-template-columns:repeat(4,1fr)}
.grid.medium{grid-template-columns:repeat(4,1fr)}
.grid.hard{grid-template-columns:repeat(6,1fr)}
.card-tile{aspect-ratio:1;border-radius:14px;background:var(--elev);display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;transition:all .3s;position:relative;transform-style:preserve-3d;perspective:600px}
.card-tile:active{transform:scale(0.95)}
.card-tile .face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;transition:transform .4s}
.card-tile .front{background:var(--grad);font-size:24px;color:#fff}
.card-tile .front::before{content:'?';font-weight:900}
.card-tile .back{background:var(--elev);transform:rotateY(180deg)}
.card-tile.flipped .front{transform:rotateY(180deg)}
.card-tile.flipped .back{transform:rotateY(0)}
.card-tile.matched{border:2px solid var(--green);box-shadow:0 0 20px rgba(16,185,129,0.5)}
.card-tile.matched .back{background:linear-gradient(135deg,rgba(16,185,129,0.2),rgba(16,185,129,0.1))}
.card-tile.wrong{animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.btn{padding:16px;border-radius:14px;background:var(--elev);color:var(--text);font-size:14px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bdr)}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(236,72,153,0.4)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;background:rgba(26,10,40,0.9);backdrop-filter:blur(10px);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.overlay.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ov-emoji{font-size:80px;margin-bottom:16px;animation:bounce 0.6s}
@keyframes bounce{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.ov-title{font-size:32px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.ov-sub{font-size:15px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.ov-stats{display:flex;gap:14px;margin-bottom:26px;flex-wrap:wrap;justify-content:center}
.ov-stat{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px 20px}
.ov-stat-v{font-size:22px;font-weight:900;color:var(--pri);font-variant-numeric:tabular-nums}
.ov-stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-top:2px}
.ov-btn{padding:16px 40px;border-radius:14px;background:var(--grad);color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 20px rgba(236,72,153,0.4)}
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">🎴</div><span>Memory Match</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="stats">
<div class="stat"><div class="stat-v" id="stMoves">0</div><div class="stat-l">Moves</div></div>
<div class="stat"><div class="stat-v" id="stMatches">0</div><div class="stat-l">Matches</div></div>
<div class="stat"><div class="stat-v" id="stTime">0s</div><div class="stat-l">Time</div></div>
</div>

<div class="diff-row">
<button class="diff-btn active" id="diffEasy" onclick="setDiff('easy')">😊 Easy</button>
<button class="diff-btn" id="diffMedium" onclick="setDiff('medium')">😎 Medium</button>
<button class="diff-btn" id="diffHard" onclick="setDiff('hard')">🔥 Hard</button>
</div>

<div class="board">
<div class="grid" id="grid"></div>
</div>

<div class="actions">
<button class="btn primary" onclick="newGame()"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>New Game</button>
<button class="btn" onclick="resetBest()"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10l1 8a6 6 0 11-12 0z"/></svg>Best: <span id="bestVal">—</span></button>
</div>
</main>

<div class="overlay" id="overlay">
<div class="ov-emoji">🎉</div>
<div class="ov-title">You Won!</div>
<div class="ov-sub">Excellent memory!</div>
<div class="ov-stats" id="ovStats"></div>
<button class="ov-btn" onclick="closeOverlay()">Play Again</button>
</div>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<script>
const EMOJIS=['🍎','🍌','🍇','🍓','🍊','🍉','🍒','🥝','🍍','🥥','🍑','🍋','🥭','🫐','🍈','🍏','🥑','🌶️','🥕','🌽'];
const DIFF={easy:{pairs:6,label:'Easy'},medium:{pairs:8,label:'Medium'},hard:{pairs:12,label:'Hard'}};
let state={theme:'dark',diff:'easy',cards:[],flipped:[],matched:0,moves:0,lock:false,startTime:null,timer:null,best:{}};
let ttm;
function init(){loadState();applyTheme();newGame();}
function loadState(){try{const s=localStorage.getItem('mem_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.diff=p.diff||'easy';state.best=p.best||{};}}catch(e){}}
function saveState(){try{localStorage.setItem('mem_v1',JSON.stringify({theme:state.theme,diff:state.diff,best:state.best}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function setDiff(d){
  state.diff=d;
  document.getElementById('diffEasy').classList.toggle('active',d==='easy');
  document.getElementById('diffMedium').classList.toggle('active',d==='medium');
  document.getElementById('diffHard').classList.toggle('active',d==='hard');
  saveState();
  newGame();
}

function newGame(){
  const cfg=DIFF[state.diff];
  const total=cfg.pairs;
  const pool=[...EMOJIS].slice(0,total);
  const cards=[];
  pool.forEach((e,i)=>{cards.push({id:i*2,emoji:e,flipped:false,matched:false});cards.push({id:i*2+1,emoji:e,flipped:false,matched:false});});
  cards.sort(()=>Math.random()-0.5);
  state.cards=cards;
  state.flipped=[];
  state.matched=0;
  state.moves=0;
  state.lock=false;
  state.startTime=null;
  if(state.timer){clearInterval(state.timer);state.timer=null;}
  document.getElementById('stMoves').textContent=0;
  document.getElementById('stMatches').textContent='0/'+total;
  document.getElementById('stTime').textContent='0s';
  updateBest();
  render();
}

function updateBest(){
  const b=state.best[state.diff];
  document.getElementById('bestVal').textContent=b?b.moves+' moves':'-';
}

function render(){
  const g=document.getElementById('grid');
  g.className='grid '+state.diff;
  g.innerHTML=state.cards.map((c,i)=>{
    const cls=['card-tile'];
    if(c.flipped||c.matched)cls.push('flipped');
    if(c.matched)cls.push('matched');
    return '<div class="'+cls.join(' ')+'" data-i="'+i+'" onclick="flip('+i+')"><div class="face front"></div><div class="face back">'+c.emoji+'</div></div>';
  }).join('');
}

function flip(i){
  if(state.lock)return;
  const card=state.cards[i];
  if(card.flipped||card.matched)return;
  if(!state.startTime){state.startTime=Date.now();state.timer=setInterval(tick,1000);}
  card.flipped=true;
  state.flipped.push(i);
  if(navigator.vibrate)navigator.vibrate(15);
  render();
  if(state.flipped.length===2){
    state.moves++;
    document.getElementById('stMoves').textContent=state.moves;
    const[a,b]=state.flipped;
    if(state.cards[a].emoji===state.cards[b].emoji){
      state.cards[a].matched=true;
      state.cards[b].matched=true;
      state.matched++;
      document.getElementById('stMatches').textContent=state.matched+'/'+DIFF[state.diff].pairs;
      if(navigator.vibrate)navigator.vibrate([50,30,50]);
      state.flipped=[];
      render();
      if(state.matched===DIFF[state.diff].pairs){setTimeout(finish,500);}
    }else{
      state.lock=true;
      setTimeout(()=>{
        state.cards[a].flipped=false;
        state.cards[b].flipped=false;
        state.flipped=[];
        state.lock=false;
        render();
      },900);
    }
  }
}

function tick(){
  if(!state.startTime)return;
  const s=Math.floor((Date.now()-state.startTime)/1000);
  document.getElementById('stTime').textContent=s+'s';
}

function finish(){
  if(state.timer)clearInterval(state.timer);
  const total=Math.floor((Date.now()-state.startTime)/1000);
  const b=state.best[state.diff];
  const isBest=!b||state.moves<b.moves;
  if(isBest){state.best[state.diff]={moves:state.moves,time:total};saveState();}
  updateBest();
  document.getElementById('ovStats').innerHTML='<div class="ov-stat"><div class="ov-stat-v">'+state.moves+'</div><div class="ov-stat-l">Moves</div></div><div class="ov-stat"><div class="ov-stat-v">'+total+'s</div><div class="ov-stat-l">Time</div></div>'+(isBest?'<div class="ov-stat"><div class="ov-stat-v">🏆</div><div class="ov-stat-l">New Best!</div></div>':'');
  document.getElementById('overlay').classList.add('show');
  if(navigator.vibrate)navigator.vibrate([100,50,100,50,200]);
}

function closeOverlay(){document.getElementById('overlay').classList.remove('show');newGame();}
function resetBest(){if(!confirm('Reset best scores?'))return;state.best={};saveState();updateBest();showToast('Reset');}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
