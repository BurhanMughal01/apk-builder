<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Booking</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#0a1a14;--card:#0f2e22;--elev:#1a4a36;--text:#d1fae5;--muted:#6ee7b7;--sub:#059669;--pri:#10b981;--gold:#fbbf24;--red:#ef4444;--blue:#3b82f6;--grad:linear-gradient(135deg,#10b981,#059669);--bdr:rgba(16,185,129,0.25);--glow:0 0 30px rgba(16,185,129,0.4)}
[data-theme="light"]{--bg:#f0fdf4;--card:#fff;--elev:#dcfce7;--text:#052e16;--muted:#15803d;--sub:#86efac;--bdr:rgba(22,163,74,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(16,185,129,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,26,20,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(240,253,244,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.main::-webkit-scrollbar{width:0}
.welcome{background:linear-gradient(135deg,rgba(16,185,129,0.2),rgba(5,150,105,0.1));border:1px solid var(--bdr);border-radius:24px;padding:24px;width:100%;max-width:440px;position:relative;overflow:hidden}
.welcome::before{content:'📅';position:absolute;top:-10px;right:-10px;font-size:72px;opacity:0.15}
.welcome h1{font-size:24px;font-weight:900;margin-bottom:6px;position:relative;z-index:1}
.welcome p{font-size:13px;color:var(--muted);position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:18px;width:100%;max-width:440px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--sub);font-weight:800;margin-bottom:8px;display:block}
.inp{width:100%;padding:13px 14px;background:var(--bg);border:1px solid var(--bdr);border-radius:12px;color:var(--text);font-size:14px;font-weight:600;margin-bottom:14px}
.inp:focus{border-color:var(--pri)}
textarea.inp{resize:none;min-height:70px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-2 .inp{margin-bottom:14px}
.services{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.service{padding:14px 10px;background:var(--elev);border:2px solid transparent;border-radius:14px;color:var(--text);font-size:12px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s;text-align:center}
.service:active{transform:scale(0.95)}
.service.active{background:var(--grad);color:#fff;border-color:transparent}
.service .si{font-size:22px}
.service .sname{font-weight:800}
.service .sprice{font-size:10px;color:var(--sub);font-weight:700}
.service.active .sprice{color:rgba(255,255,255,0.9)}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.time-slot{padding:10px 4px;background:var(--elev);border:1px solid var(--bdr);border-radius:10px;color:var(--text);font-size:11px;font-weight:800;font-family:inherit;transition:all .2s}
.time-slot:active{transform:scale(0.95)}
.time-slot.active{background:var(--grad);color:#fff;border-color:transparent}
.time-slot.booked{opacity:0.3;text-decoration:line-through;pointer-events:none}
.book-btn{width:100%;padding:16px;border-radius:14px;background:var(--grad);color:#fff;font-size:15px;font-weight:900;font-family:inherit;box-shadow:0 6px 20px rgba(16,185,129,0.4);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.book-btn:active{transform:scale(0.97)}
.book-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.section-title{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;width:100%;max-width:440px;padding-left:4px;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.appointment{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px;width:100%;max-width:440px;display:flex;align-items:center;gap:12px}
.apt-icon{width:44px;height:44px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.apt-info{flex:1;min-width:0}
.apt-service{font-size:14px;font-weight:800;margin-bottom:2px}
.apt-time{font-size:11px;color:var(--sub);font-weight:600}
.apt-status{padding:3px 8px;border-radius:6px;font-size:9px;font-weight:900;letter-spacing:0.5px;text-transform:uppercase}
.apt-status.pending{background:rgba(251,191,36,0.2);color:var(--gold)}
.apt-status.confirmed{background:rgba(16,185,129,0.2);color:var(--pri)}
.apt-status.cancelled{background:rgba(239,68,68,0.2);color:var(--red)}
.apt-del{width:30px;height:30px;border-radius:8px;background:rgba(239,68,68,0.1);color:#fca5a5;display:grid;place-items:center;flex-shrink:0}
.apt-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">📅</div><span>Booking</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="welcome">
<h1>Book an Appointment</h1>
<p>Choose a service and pick your preferred time</p>
</div>

<div class="card">
<label class="lbl">Choose Service</label>
<div class="services" id="servicesRow"></div>

<label class="lbl">Date</label>
<input type="date" class="inp" id="bookDate">

<label class="lbl">Time Slot</label>
<div class="time-grid" id="timeGrid"></div>

<label class="lbl">Your Name</label>
<input type="text" class="inp" id="bookName" placeholder="Full name">

<label class="lbl">Phone</label>
<input type="tel" class="inp" id="bookPhone" placeholder="+92 300 0000000">

<label class="lbl">Notes (optional)</label>
<textarea class="inp" id="bookNotes" placeholder="Any special requests..."></textarea>

<button class="book-btn" onclick="confirmBooking()"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Confirm Booking</button>
</div>

<div class="section-title"><span>Your Appointments</span></div>
<div id="appointmentsList" style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px"></div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Booked</span></div>

<script>
const SERVICES=[
{id:'haircut',n:'Haircut',i:'✂️',p:500},
{id:'massage',n:'Massage',i:'💆',p:2000},
{id:'facial',n:'Facial',i:'🧖',p:1500},
{id:'manicure',n:'Manicure',i:'💅',p:800},
{id:'consult',n:'Consultation',i:'💬',p:1000},
{id:'repair',n:'Repair',i:'🔧',p:1200}
];
const TIMES=['09:00','10:00','11:00','12:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00'];
let state={theme:'dark',selectedService:null,selectedTime:null,appointments:[]};
let ttm;
function init(){loadState();applyTheme();setupDate();renderServices();renderTimes();renderAppointments();}
function loadState(){try{const s=localStorage.getItem('bk_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.appointments=p.appointments||[];}}catch(e){}}
function saveState(){try{localStorage.setItem('bk_v1',JSON.stringify({theme:state.theme,appointments:state.appointments}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function setupDate(){
  const inp=document.getElementById('bookDate');
  const today=new Date();
  const yyyy=today.getFullYear();
  const mm=String(today.getMonth()+1).padStart(2,'0');
  const dd=String(today.getDate()).padStart(2,'0');
  inp.value=yyyy+'-'+mm+'-'+dd;
  inp.min=yyyy+'-'+mm+'-'+dd;
}

function renderServices(){
  document.getElementById('servicesRow').innerHTML=SERVICES.map(s=>'<button class="service '+(state.selectedService===s.id?'active':'')+'" onclick="selectService(\''+s.id+'\')"><span class="si">'+s.i+'</span><span class="sname">'+s.n+'</span><span class="sprice">PKR '+s.p+'</span></button>').join('');
}
function selectService(id){state.selectedService=id;renderServices();if(navigator.vibrate)navigator.vibrate(10);}

function renderTimes(){
  const date=document.getElementById('bookDate').value;
  const bookedTimes=state.appointments.filter(a=>a.date===date&&a.status!=='cancelled').map(a=>a.time);
  document.getElementById('timeGrid').innerHTML=TIMES.map(t=>'<button class="time-slot '+(state.selectedTime===t?'active':'')+' '+(bookedTimes.includes(t)?'booked':'')+'" onclick="selectTime(\''+t+'\')">'+t+'</button>').join('');
}
function selectTime(t){state.selectedTime=t;renderTimes();if(navigator.vibrate)navigator.vibrate(10);}

document.getElementById('bookDate').addEventListener('change',renderTimes);

function confirmBooking(){
  if(!state.selectedService){showToast('Select a service');return;}
  if(!state.selectedTime){showToast('Select a time');return;}
  const name=document.getElementById('bookName').value.trim();
  const phone=document.getElementById('bookPhone').value.trim();
  if(!name){showToast('Enter your name');return;}
  if(!phone){showToast('Enter phone');return;}
  const svc=SERVICES.find(s=>s.id===state.selectedService);
  state.appointments.unshift({
    id:Date.now(),
    service:svc.n,
    icon:svc.i,
    price:svc.p,
    date:document.getElementById('bookDate').value,
    time:state.selectedTime,
    name:name,
    phone:phone,
    notes:document.getElementById('bookNotes').value.trim(),
    status:'pending'
  });
  saveState();
  state.selectedService=null;
  state.selectedTime=null;
  document.getElementById('bookName').value='';
  document.getElementById('bookPhone').value='';
  document.getElementById('bookNotes').value='';
  renderServices();renderTimes();renderAppointments();
  if(navigator.vibrate)navigator.vibrate([50,30,50]);
  showToast('Booking confirmed! ✓');
}

function renderAppointments(){
  const el=document.getElementById('appointmentsList');
  if(!state.appointments.length){el.innerHTML='<div class="empty">No appointments yet.<br>Book your first one above.</div>';return;}
  el.innerHTML=state.appointments.map(a=>{
    const d=new Date(a.date);
    const dstr=d.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'});
    return '<div class="appointment"><div class="apt-icon">'+a.icon+'</div><div class="apt-info"><div class="apt-service">'+a.service+' · PKR '+a.price+'</div><div class="apt-time">'+dstr+' at '+a.time+'</div></div><span class="apt-status '+a.status+'">'+a.status+'</span><button class="apt-del" onclick="deleteApt('+a.id+')"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button></div>';
  }).join('');
}
function deleteApt(id){if(!confirm('Cancel this appointment?'))return;state.appointments=state.appointments.filter(a=>a.id!==id);saveState();renderAppointments();renderTimes();showToast('Cancelled');}

function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
init();
</script></body></html>
