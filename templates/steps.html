<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Step Counter</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#1a0f02;--card:#2a1a06;--elev:#3d2810;--text:#fed7aa;--muted:#fdba74;--sub:#c2410c;--pri:#f97316;--gold:#fbbf24;--green:#84cc16;--grad:linear-gradient(135deg,#f97316,#ea580c);--bdr:rgba(249,115,22,0.25);--glow:0 0 30px rgba(249,115,22,0.4)}
[data-theme="light"]{--bg:#fff7ed;--card:#fff;--elev:#ffedd5;--text:#431407;--muted:#9a3412;--sub:#fb923c;--bdr:rgba(234,88,12,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(249,115,22,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(26,15,2,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(255,247,237,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.main::-webkit-scrollbar{width:0}
.hero-ring{position:relative;width:min(280px,80vw);height:min(280px,80vw);margin-top:8px}
.ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--card);stroke-width:16}
.ring-fill{fill:none;stroke:url(#gStep);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset 0.5s;filter:drop-shadow(0 0 10px rgba(249,115,22,0.6))}
.ring-inner{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--elev),var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 40px rgba(249,115,22,0.15)}
.ring-icon{font-size:32px;margin-bottom:4px}
.ring-val{font-size:52px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.ring-lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:2px;font-weight:800}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:440px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:14px;text-align:center}
.stat-v{font-size:20px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.goal-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px;width:100%;max-width:440px;display:flex;align-items:center;gap:14px}
.goal-icon{width:48px;height:48px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.goal-info{flex:1}
.goal-lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:4px}
.goal-val{font-size:18px;font-weight:900;color:var(--text)}
.goal-btn{padding:10px 16px;background:var(--elev);color:var(--text);border:1px solid var(--bdr);border-radius:12px;font-size:12px;font-weight:800;font-family:inherit}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.btn{padding:14px;border-radius:14px;background:var(--elev);color:var(--text);font-size:13px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bdr)}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(249,115,22,0.4)}
.btn.danger{background:rgba(239,68,68,0.15);color:#fca5a5;border-color:rgba(239,68,68,0.3)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.info-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px;width:100%;max-width:440px}
.info-title{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:10px}
.info-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid var(--bdr)}
.info-row:last-child{border-bottom:none}
.info-l{color:var(--muted);font-weight:600}
.info-v{color:var(--pri);font-weight:800;font-variant-numeric:tabular-nums}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">👟</div><span>Step Counter</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gStep" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient></defs></svg>

<div class="hero-ring">
<svg class="ring-svg" viewBox="0 0 280 280">
<circle class="ring-bg" cx="140" cy="140" r="128"/>
<circle class="ring-fill" id="ringFill" cx="140" cy="140" r="128" stroke-dasharray="804" stroke-dashoffset="804"/>
</svg>
<div class="ring-inner">
<div class="ring-icon">👟</div>
<div class="ring-val" id="stepVal">0</div>
<div class="ring-lbl">Steps</div>
</div>
</div>

<div class="stats-grid">
<div class="stat"><div class="stat-v" id="stKm">0</div><div class="stat-l">km</div></div>
<div class="stat"><div class="stat-v" id="stCal">0</div><div class="stat-l">kcal</div></div>
<div class="stat"><div class="stat-v" id="stMin">0</div><div class="stat-l">min</div></div>
</div>

<div class="goal-card">
<div class="goal-icon">🎯</div>
<div class="goal-info"><div class="goal-lbl">Daily Goal</div><div class="goal-val" id="goalVal">10,000 steps</div></div>
<button class="goal-btn" onclick="editGoal()">Edit</button>
</div>

<div class="actions">
<button class="btn primary" onclick="addSteps(100)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>+100 Steps</button>
<button class="btn" onclick="addSteps(500)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>+500</button>
</div>
<div class="actions">
<button class="btn" onclick="resetToday()"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Reset</button>
<button class="btn danger" onclick="resetAll()"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>Clear All</button>
</div>

<div class="info-card">
<div class="info-title">Today's Summary</div>
<div class="info-row"><span class="info-l">Progress</span><span class="info-v" id="infoProgress">0%</span></div>
<div class="info-row"><span class="info-l">Remaining</span><span class="info-v" id="infoRemain">10,000</span></div>
<div class="info-row"><span class="info-l">Distance</span><span class="info-v" id="infoDist">0.00 km</span></div>
<div class="info-row"><span class="info-l">Active Minutes</span><span class="info-v" id="infoMin">0 min</span></div>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Saved</span></div>

<script>
let state={theme:'dark',goal:10000,steps:0,date:null,history:[]};
let ttm;
function init(){loadState();checkNewDay();applyTheme();render();}
function loadState(){try{const s=localStorage.getItem('steps_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.goal=p.goal||10000;state.steps=p.steps||0;state.date=p.date;state.history=p.history||[];}}catch(e){}}
function saveState(){try{localStorage.setItem('steps_v1',JSON.stringify({theme:state.theme,goal:state.goal,steps:state.steps,date:state.date,history:state.history}));}catch(e){}}
function checkNewDay(){const today=new Date().toDateString();if(state.date&&state.date!==today){state.history.push({date:state.date,steps:state.steps});if(state.history.length>30)state.history=state.history.slice(-30);state.steps=0;state.date=today;saveState();showToast('New day!');}else if(!state.date){state.date=today;saveState();}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function addSteps(n){
  state.steps+=n;
  if(navigator.vibrate)navigator.vibrate(20);
  saveState();render();
  if(state.steps>=state.goal&&state.steps-n<state.goal){
    showToast('🎉 Goal reached!');
    if(navigator.vibrate)navigator.vibrate([100,50,100,50,200]);
  }
}

function render(){
  const pct=Math.min(state.steps/state.goal,1);
  const circ=804;
  document.getElementById('ringFill').style.strokeDashoffset=circ*(1-pct);
  document.getElementById('stepVal').textContent=state.steps.toLocaleString();
  const km=(state.steps*0.000762).toFixed(2);
  const cal=Math.round(state.steps*0.04);
  const min=Math.round(state.steps/100);
  document.getElementById('stKm').textContent=km;
  document.getElementById('stCal').textContent=cal;
  document.getElementById('stMin').textContent=min;
  document.getElementById('goalVal').textContent=state.goal.toLocaleString()+' steps';
  const pctInt=Math.round(pct*100);
  document.getElementById('infoProgress').textContent=pctInt+'%';
  document.getElementById('infoRemain').textContent=Math.max(0,state.goal-state.steps).toLocaleString();
  document.getElementById('infoDist').textContent=km+' km';
  document.getElementById('infoMin').textContent=min+' min';
}

function editGoal(){
  const v=prompt('Set daily step goal:',state.goal);
  if(v===null)return;
  const n=parseInt(v.replace(/,/g,''));
  if(n&&n>0&&n<=100000){state.goal=n;saveState();render();showToast('Goal: '+n.toLocaleString());}
  else showToast('Invalid value');
}

function resetToday(){if(!confirm('Reset today\\'s steps?'))return;state.steps=0;saveState();render();showToast('Reset');}
function resetAll(){if(!confirm('Clear all data?'))return;state.steps=0;state.history=[];saveState();render();showToast('Cleared');}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
init();
</script></body></html>
