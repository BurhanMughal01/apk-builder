<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rock Paper Scissors</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#0f1419;--card:#1a2129;--elev:#252f3a;--text:#fff8e7;--muted:#fbbf24;--sub:#78350f;--pri:#fbbf24;--red:#ef4444;--green:#10b981;--blue:#3b82f6;--grad:linear-gradient(135deg,#fbbf24,#ef4444);--bdr:rgba(251,191,36,0.25);--glow:0 0 30px rgba(251,191,36,0.4)}
[data-theme="light"]{--bg:#fffbeb;--card:#fff;--elev:#fef3c7;--text:#451a03;--muted:#d97706;--sub:#fbbf24;--bdr:rgba(217,119,6,0.2)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(251,191,36,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(15,20,25,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(255,251,235,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.main::-webkit-scrollbar{width:0}
.scores{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;width:100%;max-width:400px}
.score-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:14px;text-align:center}
.score-card.me{border-color:var(--blue)}
.score-card.ai{border-color:var(--red)}
.score-emoji{font-size:32px;margin-bottom:6px}
.score-name{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:4px}
.score-val{font-size:32px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.score-card.me .score-val{color:var(--blue)}
.score-card.ai .score-val{color:var(--red)}
.vs{font-size:14px;font-weight:900;color:var(--sub);text-align:center}
.arena{background:var(--card);border:1px solid var(--bdr);border-radius:24px;padding:24px;width:100%;max-width:400px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;min-height:200px;box-shadow:var(--glow)}
.hand{display:flex;flex-direction:column;align-items:center;gap:10px}
.hand-lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;font-weight:800}
.hand-emoji{font-size:72px;line-height:1;transition:all .3s}
.hand-emoji.rolling{animation:roll 0.1s infinite}
@keyframes roll{0%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}100%{transform:rotate(-15deg)}}
.hand-emoji.win{animation:winBounce 0.5s}
@keyframes winBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.result-banner{background:var(--elev);border:1px solid var(--bdr);border-radius:16px;padding:16px;text-align:center;width:100%;max-width:400px;font-size:18px;font-weight:900;letter-spacing:1px;transition:all .3s}
.result-banner.win{background:linear-gradient(135deg,rgba(16,185,129,0.2),rgba(16,185,129,0.05));border-color:var(--green);color:var(--green)}
.result-banner.lose{background:linear-gradient(135deg,rgba(239,68,68,0.2),rgba(239,68,68,0.05));border-color:var(--red);color:var(--red)}
.result-banner.draw{background:linear-gradient(135deg,rgba(251,191,36,0.2),rgba(251,191,36,0.05));border-color:var(--pri);color:var(--pri)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:400px}
.choice-btn{background:var(--card);border:2px solid var(--bdr);border-radius:20px;padding:20px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .2s;font-family:inherit}
.choice-btn:active{transform:scale(0.94);border-color:var(--pri)}
.choice-btn:disabled{opacity:0.5}
.choice-emoji{font-size:42px;line-height:1}
.choice-label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:0.5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px}
.btn{padding:14px;border-radius:14px;background:var(--elev);color:var(--text);font-size:13px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bdr)}
.btn:active{transform:scale(0.97)}
.btn.danger{background:rgba(239,68,68,0.15);color:#fca5a5;border-color:rgba(239,68,68,0.3)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:300}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">✊</div><span>Rock Paper Scissors</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="scores">
<div class="score-card me"><div class="score-emoji">😊</div><div class="score-name">You</div><div class="score-val" id="myScore">0</div></div>
<div class="vs">VS</div>
<div class="score-card ai"><div class="score-emoji">🤖</div><div class="score-name">AI</div><div class="score-val" id="aiScore">0</div></div>
</div>

<div class="arena">
<div class="hand"><div class="hand-lbl">You</div><div class="hand-emoji" id="myHand">❔</div></div>
<div class="hand"><div class="hand-lbl">AI</div><div class="hand-emoji" id="aiHand">❔</div></div>
</div>

<div class="result-banner" id="resultBanner">Make your move</div>

<div class="choices">
<button class="choice-btn" onclick="play('rock')" id="btnRock"><div class="choice-emoji">✊</div><div class="choice-label">Rock</div></button>
<button class="choice-btn" onclick="play('paper')" id="btnPaper"><div class="choice-emoji">✋</div><div class="choice-label">Paper</div></button>
<button class="choice-btn" onclick="play('scissors')" id="btnScissors"><div class="choice-emoji">✌️</div><div class="choice-label">Scissors</div></button>
</div>

<div class="actions">
<button class="btn" onclick="newRound()"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Reset Round</button>
<button class="btn danger" onclick="resetAll()"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>Reset All</button>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<script>
const EMOJI={rock:'✊',paper:'✋',scissors:'✌️'};
const BEATS={rock:'scissors',paper:'rock',scissors:'paper'};
let state={theme:'dark',myScore:0,aiScore:0,rolling:false};
let ttm;
function init(){loadState();applyTheme();updateScores();}
function loadState(){try{const s=localStorage.getItem('rps_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.myScore=p.myScore||0;state.aiScore=p.aiScore||0;}}catch(e){}}
function saveState(){try{localStorage.setItem('rps_v1',JSON.stringify({theme:state.theme,myScore:state.myScore,aiScore:state.aiScore}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function play(myChoice){
  if(state.rolling)return;
  state.rolling=true;
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  const myHand=document.getElementById('myHand');
  const aiHand=document.getElementById('aiHand');
  myHand.classList.add('rolling');
  aiHand.classList.add('rolling');
  const rollEmojis=['✊','✋','✌️'];
  let count=0;
  const rollInterval=setInterval(()=>{
    myHand.textContent=rollEmojis[count%3];
    aiHand.textContent=rollEmojis[(count+1)%3];
    count++;
    if(count>=12){
      clearInterval(rollInterval);
      myHand.classList.remove('rolling');
      aiHand.classList.remove('rolling');
      const aiChoice=rollEmojis[Math.floor(Math.random()*3)]==='✊'?'rock':rollEmojis[Math.floor(Math.random()*3)]==='✋'?'paper':'scissors';
      const ai=Math.random()<0.3333?'rock':Math.random()<0.5?'paper':'scissors';
      finish(myChoice,ai);
    }
  },80);
}

function finish(my,ai){
  document.getElementById('myHand').textContent=EMOJI[my];
  document.getElementById('aiHand').textContent=EMOJI[ai];
  const banner=document.getElementById('resultBanner');
  banner.classList.remove('win','lose','draw');
  let result='';
  if(my===ai){result='draw';banner.textContent='🤝 Draw!';banner.classList.add('draw');}
  else if(BEATS[my]===ai){state.myScore++;result='win';banner.textContent='🎉 You Win!';banner.classList.add('win');document.getElementById('myHand').classList.add('win');}
  else{state.aiScore++;result='lose';banner.textContent='😢 AI Wins!';banner.classList.add('lose');document.getElementById('aiHand').classList.add('win');}
  if(navigator.vibrate)navigator.vibrate(result==='win'?[50,30,50]:result==='lose'?100:30);
  setTimeout(()=>{document.getElementById('myHand').classList.remove('win');document.getElementById('aiHand').classList.remove('win');},600);
  state.rolling=false;
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=false);
  updateScores();
  saveState();
}

function updateScores(){
  document.getElementById('myScore').textContent=state.myScore;
  document.getElementById('aiScore').textContent=state.aiScore;
}

function newRound(){
  if(state.rolling)return;
  document.getElementById('myHand').textContent='❔';
  document.getElementById('aiHand').textContent='❔';
  const banner=document.getElementById('resultBanner');
  banner.classList.remove('win','lose','draw');
  banner.textContent='Make your move';
}

function resetAll(){
  if(!confirm('Reset all scores?'))return;
  state.myScore=0;state.aiScore=0;
  saveState();updateScores();newRound();showToast('Scores reset');
}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
