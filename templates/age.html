<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Age Calculator</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#12091e;--card:#221435;--elev:#332050;--text:#f3e8ff;--muted:#c4b5fd;--sub:#a78bfa;--pri:#a855f7;--grad:linear-gradient(135deg,#a855f7,#ec4899);--bdr:rgba(168,85,247,0.2);--gold:#fbbf24}
[data-theme="light"]{--bg:#faf5ff;--card:#fff;--elev:#f3e8ff;--text:#3b0764;--muted:#7e22ce;--sub:#c084fc;--bdr:rgba(126,34,206,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(168,85,247,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(18,9,30,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(250,245,255,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px}
.main::-webkit-scrollbar{width:0}
.hero{background:var(--grad);border-radius:24px;padding:32px 20px;text-align:center;color:#fff;margin-bottom:16px;box-shadow:0 8px 30px rgba(168,85,247,0.4);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.3),transparent 70%)}
.hero-icon{font-size:56px;margin-bottom:12px;position:relative;z-index:1}
.hero-title{font-size:24px;font-weight:800;margin-bottom:4px;position:relative;z-index:1}
.hero-sub{font-size:13px;opacity:0.9;position:relative;z-index:1;font-weight:600}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:20px;margin-bottom:14px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--sub);font-weight:700;margin-bottom:8px}
.date-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.date-field{background:var(--bg);border:2px solid var(--bdr);border-radius:12px;padding:12px 8px;text-align:center;color:var(--text);font-size:16px;font-weight:700;width:100%}
.date-field:focus{border-color:var(--pri)}
.btn{width:100%;padding:18px;border-radius:14px;background:var(--grad);color:#fff;font-size:16px;font-weight:800;font-family:inherit;box-shadow:0 6px 20px rgba(168,85,247,0.4);margin-bottom:14px}
.btn:active{transform:scale(0.98)}
.btn-secondary{width:100%;padding:14px;border-radius:12px;background:var(--elev);color:var(--text);font-size:14px;font-weight:700;font-family:inherit;border:1px solid var(--bdr)}
.result-hero{background:linear-gradient(135deg,rgba(168,85,247,0.15),rgba(236,72,153,0.08));border:1px solid var(--bdr);border-radius:20px;padding:24px;text-align:center;margin-bottom:14px}
.result-num{font-size:72px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px}
.result-lbl{font-size:14px;color:var(--muted);font-weight:600}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px;text-align:center}
.stat-val{font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px;font-weight:700}
.next-bday{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.nb-icon{width:52px;height:52px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.nb-info{flex:1}
.nb-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:4px}
.nb-value{font-size:16px;font-weight:800;color:var(--text)}
.nb-days{font-size:12px;color:var(--pri);font-weight:700;margin-top:2px}
.zodiac{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.z-icon{font-size:40px;flex-shrink:0}
.z-info{flex:1}
.z-name{font-size:16px;font-weight:800;color:var(--text);margin-bottom:2px}
.z-date{font-size:12px;color:var(--sub)}
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:200}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">🎂</div><span>Age Calculator</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="hero"><div class="hero-icon">🎂</div><div class="hero-title">Age Calculator</div><div class="hero-sub">Find your exact age</div></div>

<div class="card">
<div class="lbl">Date of Birth</div>
<div class="date-row">
<input type="number" class="date-field" id="dDay" placeholder="DD" min="1" max="31">
<input type="number" class="date-field" id="dMonth" placeholder="MM" min="1" max="12">
<input type="number" class="date-field" id="dYear" placeholder="YYYY" min="1900" max="2100">
</div>
<button class="btn" onclick="calculate()">Calculate Age</button>
<button class="btn-secondary" onclick="resetAll()">Reset</button>
</div>

<div id="results" style="display:none">
<div class="result-hero">
<div class="result-num" id="ageNum">0</div>
<div class="result-lbl" id="ageLbl">Years Old</div>
</div>

<div class="stats-grid">
<div class="stat-card"><div class="stat-val" id="stMonths">0</div><div class="stat-lbl">Months</div></div>
<div class="stat-card"><div class="stat-val" id="stWeeks">0</div><div class="stat-lbl">Weeks</div></div>
<div class="stat-card"><div class="stat-val" id="stDays">0</div><div class="stat-lbl">Days</div></div>
<div class="stat-card"><div class="stat-val" id="stHours">0</div><div class="stat-lbl">Hours</div></div>
<div class="stat-card"><div class="stat-val" id="stMinutes">0</div><div class="stat-lbl">Minutes</div></div>
<div class="stat-card"><div class="stat-val" id="stSeconds">0</div><div class="stat-lbl">Seconds</div></div>
</div>

<div class="next-bday">
<div class="nb-icon">🎉</div>
<div class="nb-info">
<div class="nb-label">Next Birthday</div>
<div class="nb-value" id="nbDate">—</div>
<div class="nb-days" id="nbDays">—</div>
</div>
</div>

<div class="zodiac">
<div class="z-icon" id="zIcon">♈</div>
<div class="z-info">
<div class="z-name" id="zName">—</div>
<div class="z-date" id="zDate">—</div>
</div>
</div>

<div class="next-bday">
<div class="nb-icon">📅</div>
<div class="nb-info">
<div class="nb-label">Born on</div>
<div class="nb-value" id="bornDay">—</div>
</div>
</div>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Done</span></div>

<script>
let state={theme:'dark'};
let ttm;
function init(){loadState();applyTheme();}
function loadState(){try{const s=localStorage.getItem('age_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';}}catch(e){}}
function saveState(){try{localStorage.setItem('age_v1',JSON.stringify({theme:state.theme}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

const ZODIAC=[{n:'Capricorn',i:'♑',s:'Dec 22 - Jan 19'},{n:'Aquarius',i:'♒',s:'Jan 20 - Feb 18'},{n:'Pisces',i:'♓',s:'Feb 19 - Mar 20'},{n:'Aries',i:'♈',s:'Mar 21 - Apr 19'},{n:'Taurus',i:'♉',s:'Apr 20 - May 20'},{n:'Gemini',i:'♊',s:'May 21 - Jun 20'},{n:'Cancer',i:'♋',s:'Jun 21 - Jul 22'},{n:'Leo',i:'♌',s:'Jul 23 - Aug 22'},{n:'Virgo',i:'♍',s:'Aug 23 - Sep 22'},{n:'Libra',i:'♎',s:'Sep 23 - Oct 22'},{n:'Scorpio',i:'♏',s:'Oct 23 - Nov 21'},{n:'Sagittarius',i:'♐',s:'Nov 22 - Dec 21'}];

function getZodiac(day,month){
  if((month===12&&day>=22)||(month===1&&day<=19))return ZODIAC[0];
  if((month===1&&day>=20)||(month===2&&day<=18))return ZODIAC[1];
  if((month===2&&day>=19)||(month===3&&day<=20))return ZODIAC[2];
  if((month===3&&day>=21)||(month===4&&day<=19))return ZODIAC[3];
  if((month===4&&day>=20)||(month===5&&day<=20))return ZODIAC[4];
  if((month===5&&day>=21)||(month===6&&day<=20))return ZODIAC[5];
  if((month===6&&day>=21)||(month===7&&day<=22))return ZODIAC[6];
  if((month===7&&day>=23)||(month===8&&day<=22))return ZODIAC[7];
  if((month===8&&day>=23)||(month===9&&day<=22))return ZODIAC[8];
  if((month===9&&day>=23)||(month===10&&day<=22))return ZODIAC[9];
  if((month===10&&day>=23)||(month===11&&day<=21))return ZODIAC[10];
  return ZODIAC[11];
}

function calculate(){
  const day=parseInt(document.getElementById('dDay').value);
  const month=parseInt(document.getElementById('dMonth').value);
  const year=parseInt(document.getElementById('dYear').value);
  if(!day||!month||!year||day<1||day>31||month<1||month>12||year<1900||year>2100){showToast('Enter valid date');return;}
  const dob=new Date(year,month-1,day);
  if(dob.getDate()!==day||dob.getMonth()!==month-1||dob.getFullYear()!==year){showToast('Invalid date');return;}
  const now=new Date();
  if(dob>now){showToast('Date in future');return;}
  const years=now.getFullYear()-dob.getFullYear();
  const months=now.getMonth()-dob.getMonth();
  const days=now.getDate()-dob.getDate();
  let y=years,m=months,d=days;
  if(d<0){m--;const prevM=new Date(now.getFullYear(),now.getMonth(),0).getDate();d+=prevM;}
  if(m<0){y--;m+=12;}
  document.getElementById('ageNum').textContent=y;
  document.getElementById('ageLbl').textContent=(y===1?'Year':'Years')+' '+m+' '+(m===1?'Month':'Months')+' '+d+' '+(d===1?'Day':'Days')+' Old';
  const diffMs=now-dob;
  const totalDays=Math.floor(diffMs/86400000);
  document.getElementById('stMonths').textContent=(y*12+m).toLocaleString();
  document.getElementById('stWeeks').textContent=Math.floor(totalDays/7).toLocaleString();
  document.getElementById('stDays').textContent=totalDays.toLocaleString();
  document.getElementById('stHours').textContent=Math.floor(diffMs/3600000).toLocaleString();
  document.getElementById('stMinutes').textContent=Math.floor(diffMs/60000).toLocaleString();
  document.getElementById('stSeconds').textContent=Math.floor(diffMs/1000).toLocaleString();
  let nextBday=new Date(now.getFullYear(),month-1,day);
  if(nextBday<now)nextBday=new Date(now.getFullYear()+1,month-1,day);
  const daysUntil=Math.ceil((nextBday-now)/86400000);
  const opts={weekday:'long',day:'numeric',month:'long',year:'numeric'};
  document.getElementById('nbDate').textContent=nextBday.toLocaleDateString('en-US',opts);
  if(daysUntil===0)document.getElementById('nbDays').textContent='🎉 Today is your birthday!';
  else if(daysUntil===1)document.getElementById('nbDays').textContent='Tomorrow!';
  else document.getElementById('nbDays').textContent='In '+daysUntil+' days';
  const z=getZodiac(day,month);
  document.getElementById('zIcon').textContent=z.i;
  document.getElementById('zName').textContent=z.n;
  document.getElementById('zDate').textContent=z.s;
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('bornDay').textContent=days[dob.getDay()]+', '+dob.toLocaleDateString('en-US',opts);
  document.getElementById('results').style.display='block';
  saveState();
}

function resetAll(){['dDay','dMonth','dYear'].forEach(id=>document.getElementById(id).value='');document.getElementById('results').style.display='none';}
function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
init();
</script></body></html>
