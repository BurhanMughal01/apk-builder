<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dua Qunoot</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0a1428;--card:#142544;--elev:#1c3160;--text:#dbeafe;--muted:#93c5fd;--sub:#3b82f6;--pri:#3b82f6;--gold:#fbbf24;--bg2:linear-gradient(135deg,#3b82f6,#1e40af);--bdr:rgba(59,130,246,0.2);--f-a:24px}
[data-theme="light"]{--bg:#eff6ff;--card:#fff;--elev:#dbeafe;--text:#1e3a8a;--muted:#1d4ed8;--sub:#93c5fd;--bdr:rgba(37,99,235,0.2)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,20,40,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:50}
[data-theme="light"] .hdr{background:rgba(239,246,255,0.95)}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-size:18px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.main{position:fixed;top:60px;bottom:64px;left:0;right:0;overflow-y:auto;padding:16px}
.hero{background:var(--bg2);border-radius:24px;padding:24px;margin-bottom:16px;text-align:center;color:#fff}
.hi{font-size:52px;margin-bottom:12px}
.ht{font-family:'Amiri',serif;font-size:28px;font-weight:700;margin-bottom:4px}
.hs{font-size:13px;opacity:.9;font-weight:600}
.vt{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:5px;margin-bottom:16px}
.vtb{padding:11px 8px;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.vtb.active{background:var(--bg2);color:#fff}
.dc{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:20px;margin-bottom:16px}
.dl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);font-weight:800;margin-bottom:12px}
.da{font-family:'Amiri',serif;font-size:var(--f-a);line-height:2;direction:rtl;text-align:right;margin-bottom:14px}
.dt{font-size:13px;color:var(--muted);font-style:italic;padding:12px;background:var(--elev);border-radius:10px;margin-bottom:12px;line-height:1.7}
.du{font-size:14px;color:var(--muted);direction:rtl;text-align:right;line-height:1.8;padding-top:12px;border-top:1px solid var(--bdr)}
.ic{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px;margin-bottom:12px}
.ii{font-size:20px;margin-bottom:8px}
.it{font-size:14px;font-weight:700;margin-bottom:6px;color:var(--pri)}
.ix{font-size:13px;color:var(--muted);line-height:1.7}
.ar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.act{padding:16px;border-radius:14px;background:var(--elev);color:var(--text);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bdr)}
.act.primary{background:var(--bg2);color:#fff;border-color:transparent}
.act svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.sg{background:var(--card);border:1px solid var(--bdr);border-radius:16px;margin-bottom:14px}
.sr{display:flex;align-items:center;justify-content:space-between;padding:16px;gap:12px}
.si{flex:1;display:flex;align-items:center;gap:12px}
.si svg{width:20px;height:20px;stroke:var(--pri);fill:none;stroke-width:2}
.sl{font-size:14px;font-weight:600}
.ss{font-size:11px;color:var(--sub);margin-top:2px}
.fc{display:flex;gap:4px;background:var(--elev);border-radius:12px;padding:4px}
.fb{width:36px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:var(--muted);font-family:inherit}
.fb.active{background:var(--bg2);color:#fff}
.fb[data-size="small"]{font-size:12px}
.fb[data-size="medium"]{font-size:14px}
.fb[data-size="large"]{font-size:16px}
.bn{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(20,37,68,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--bdr);display:grid;grid-template-columns:repeat(2,1fr);z-index:50}
[data-theme="light"] .bn{background:rgba(255,255,255,0.95)}
.ni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:10px;font-weight:600;padding:8px}
.ni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.ni.active{color:var(--pri)}
.view{display:none}
.view.active{display:block}
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:200}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">🤲</div><span>Dua Qunoot</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>
<main class="main">
<div class="view active" id="v-q">
<div class="hero"><div class="hi">🤲</div><div class="ht">دعاء القنوت</div><div class="hs">Dua al-Qunoot</div></div>
<div class="vt"><button class="vtb active" id="tH" onclick="sV('hanafi')">Hanafi</button><button class="vtb" id="tS" onclick="sV('shafi')">Shafi'i</button></div>
<div id="qc"></div>
<div class="ic"><div class="ii">🕌</div><div class="it">When to recite</div><div class="ix">Recited in Witr prayer (Hanafi) or Fajr during hardship (Shafi'i), in the last rak'ah while standing.</div></div>
<div class="ar">
<button class="act" onclick="cD()"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy</button>
<button class="act primary" onclick="sD()"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>Share</button>
</div></div>
<div class="view" id="v-s">
<h2 style="font-size:20px;font-weight:700;margin-bottom:16px">Settings</h2>
<div class="sg"><div class="sr"><div class="si"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><div><div class="sl">Font Size</div><div class="ss">Arabic text</div></div></div><div class="fc"><button class="fb" data-size="small" onclick="sF('small')">A</button><button class="fb active" data-size="medium" onclick="sF('medium')">A</button><button class="fb" data-size="large" onclick="sF('large')">A</button></div></div></div>
<div style="text-align:center;padding:20px 0;font-size:12px;color:var(--sub);line-height:1.8">Authentic Dua Qunoot<br>Ibn Majah 1183, Tirmidhi 464<br><br>Made with ❤️ by APKForge</div>
</div></main>
<nav class="bn">
<button class="ni active" data-v="q" onclick="sW('q')"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>Dua</span></button>
<button class="ni" data-v="s" onclick="sW('s')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span>Settings</span></button>
</nav>
<div class="tt" id="toast"><span id="tt-txt">Saved</span></div>
<script>
const DATA={hanafi:{ar:"اللَّهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ وَنُؤْمِنُ بِكَ وَنَتَوَكَّلُ عَلَيْكَ وَنُثْنِي عَلَيْكَ الْخَيْرَ وَنَشْكُرُكَ وَلَا نَكْفُرُكَ وَنَخْلَعُ وَنَتْرُكُ مَنْ يَفْجُرُكَ",tr:"Allahumma inna nasta'inuka wa nastaghfiruka wa nu'minu bika wa natawakkalu 'alayka wa nuthni 'alaykal khayr wa nashkuruka wa la nakfuruka wa nakhla'u wa natruku man yafjuruk",ur:"اے اللہ! ہم تجھ سے مدد مانگتے ہیں، تجھ سے معافی مانگتے ہیں، تجھ پر ایمان لاتے ہیں، تجھ پر بھروسہ کرتے ہیں، تیری اچھی تعریف کرتے ہیں، تیرا شکر ادا کرتے ہیں، تیری ناشکری نہیں کرتے، اور جو تیری نافرمانی کرے اس سے تعلق توڑتے ہیں۔"},shafi:{ar:"اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ وَعَافِنِي فِيمَنْ عَافَيْتَ وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ وَبَارِكْ لِي فِيمَا أَعْطَيْتَ وَقِنِي شَرَّ مَا قَضَيْتَ",tr:"Allahummahdini fiman hadayt, wa 'afini fiman 'afayt, wa tawallani fiman tawallayt, wa barik li fima a'tayt, wa qini sharra ma qadayt",ur:"اے اللہ! مجھے ان لوگوں میں شامل کر جن کو تو نے ہدایت دی، مجھے عافیت دے ان لوگوں میں جن کو تو نے عافیت دی، میرا ولی بن ان لوگوں میں جن کا تو ولی بنا، اور جو تو نے دیا اس میں برکت دے، اور جو تو نے فیصلہ کیا اس کی برائی سے مجھے بچا۔"}};
let state={theme:'dark',fontSize:'medium',version:'hanafi'};
function init(){loadState();applyTheme();applyFontSize();render();}
function loadState(){try{const s=localStorage.getItem('qunoot_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';state.fontSize=p.fontSize||'medium';}}catch(e){}}
function saveState(){try{localStorage.setItem('qunoot_v1',JSON.stringify({theme:state.theme,fontSize:state.fontSize}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}
function applyFontSize(){const s={small:'20px',medium:'24px',large:'32px'};document.documentElement.style.setProperty('--f-a',s[state.fontSize]);document.querySelectorAll('.fb').forEach(b=>{b.classList.toggle('active',b.dataset.size===state.fontSize);});}
function sF(s){state.fontSize=s;applyFontSize();saveState();}
function sV(v){state.version=v;document.getElementById('tH').classList.toggle('active',v==='hanafi');document.getElementById('tS').classList.toggle('active',v==='shafi');render();}
function render(){const d=DATA[state.version];const el=document.getElementById('qc');el.innerHTML='<div class="dc"><div class="dl">Arabic</div><div class="da">'+d.ar+'</div><div class="dt">'+d.tr+'</div><div class="du">'+d.ur+'</div></div>';}
function cD(){const d=DATA[state.version];const t=d.ar+'\n\n'+d.tr+'\n\n'+d.ur;if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>showToast('Copied'));}}
function sD(){const d=DATA[state.version];const t=d.ar+'\n\n'+d.tr+'\n\n'+d.ur;if(navigator.share){navigator.share({text:t}).catch(()=>{});}else cD();}
function sW(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('v-'+v).classList.add('active');document.querySelectorAll('.ni').forEach(b=>b.classList.toggle('active',b.dataset.v===v));}
let ttm;function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1800);}
init();
</script></body></html>
