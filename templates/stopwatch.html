<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Stopwatch</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#1a0505;--card:#2a0a0a;--elev:#3d1010;--text:#fee2e2;--muted:#fca5a5;--sub:#b91c1c;--pri:#ef4444;--grad:linear-gradient(135deg,#ef4444,#dc2626);--bdr:rgba(239,68,68,0.2);--green:#10b981;--gold:#fbbf24}
[data-theme="light"]{--bg:#fef2f2;--card:#fff;--elev:#fee2e2;--text:#450a0a;--muted:#991b1b;--sub:#dc2626;--bdr:rgba(220,38,38,0.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 20% 10%,rgba(239,68,68,0.08),transparent 40%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(26,5,5,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
[data-theme="light"] .hdr{background:rgba(254,242,242,0.95)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center}
.main::-webkit-scrollbar{width:0}
.big-time{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-2px;line-height:1;margin:24px 0 6px;text-align:center;color:var(--text)}
.ms-part{font-size:32px;color:var(--pri);opacity:0.9}
.sub-time{font-size:14px;color:var(--sub);letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:20px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;margin-bottom:20px}
.btn{padding:20px;border-radius:50px;background:var(--elev);color:var(--text);font-size:15px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;border:1px solid var(--bdr)}
.btn:active{transform:scale(0.96)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(239,68,68,0.4)}
.btn.green{background:var(--green);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(16,185,129,0.4)}
.btn:disabled{opacity:0.4;box-shadow:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.laps-card{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:16px;width:100%;max-width:400px;margin-bottom:16px}
.laps-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.laps-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--sub)}
.laps-count{font-size:12px;color:var(--pri);font-weight:700}
.lap{display:grid;grid-template-columns:60px 1fr 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--bdr);font-size:14px;align-items:center}
.lap:last-child{border-bottom:none}
.lap-num{font-weight:800;color:var(--pri);font-size:13px}
.lap-time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.lap-split{font-variant-numeric:tabular-nums;font-size:12px;color:var(--sub);font-weight:600}
.lap.fastest .lap-time{color:var(--green)}
.lap.slowest .lap-time{color:var(--pri)}
.lap-badge{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;padding:2px 6px;border-radius:4px;font-weight:800;margin-left:6px}
.lap-badge.fast{background:rgba(16,185,129,0.2);color:var(--green)}
.lap-badge.slow{background:rgba(239,68,68,0.2);color:var(--pri)}
.empty-laps{text-align:center;padding:30px 20px;color:var(--sub);font-size:13px}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px;margin-bottom:16px}
.stat-mini{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px;text-align:center}
.stat-mini-v{font-size:16px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums;margin-bottom:3px}
.stat-mini-l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px;font-weight:700}
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:200}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body data-theme="dark">
<header class="hdr"><div class="hdr-t"><div class="logo">⏲️</div><span>Stopwatch</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="big-time" id="bigTime">00:00<span class="ms-part">.00</span></div>
<div class="sub-time" id="subTime">Ready</div>

<div class="controls">
<button class="btn primary" id="startBtn" onclick="toggleRun()">
<svg viewBox="0 0 24 24" id="btnIcon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
<span id="btnText">Start</span>
</button>
<button class="btn" id="lapBtn" onclick="addLap()" disabled>
<svg viewBox="0 0 24 24"><path d="M5 3v18M19 3v18M5 12h14"/></svg>
Lap
</button>
</div>

<div class="stats-row" id="statsRow" style="display:none">
<div class="stat-mini"><div class="stat-mini-v" id="statFastest">—</div><div class="stat-mini-l">Fastest</div></div>
<div class="stat-mini"><div class="stat-mini-v" id="statSlowest">—</div><div class="stat-mini-l">Slowest</div></div>
</div>

<div class="laps-card">
<div class="laps-head">
<div class="laps-title">Laps</div>
<div class="laps-count" id="lapsCount">0 laps</div>
</div>
<div id="lapsList"><div class="empty-laps">No laps recorded yet</div></div>
</div>

<button class="btn" style="width:100%;max-width:400px;padding:16px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="resetAll()">
<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
Reset
</button>
</main>

<div class="tt" id="toast"><span id="tt-txt">Ready</span></div>

<script>
let state={theme:'dark'};
let elapsed=0,startTime=0,running=false,interval=null,laps=[],lastLapTime=0;
let ttm;
function init(){loadState();applyTheme();updateDisplay();}
function loadState(){try{const s=localStorage.getItem('sw_v1');if(s){const p=JSON.parse(s);state.theme=p.theme||'dark';}}catch(e){}}
function saveState(){try{localStorage.setItem('sw_v1',JSON.stringify({theme:state.theme}));}catch(e){}}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);const i=document.getElementById('ti');if(i){if(state.theme==='dark'){i.innerHTML='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}else{i.innerHTML='<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';}}}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();}

function toggleRun(){
  if(running)stop();
  else start();
}

function start(){
  running=true;
  startTime=Date.now()-elapsed;
  document.getElementById('btnText').textContent='Stop';
  document.getElementById('btnIcon').innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  document.getElementById('subTime').textContent='Running';
  document.getElementById('lapBtn').disabled=false;
  interval=setInterval(()=>{
    elapsed=Date.now()-startTime;
    updateDisplay();
  },33);
}

function stop(){
  running=false;
  if(interval)clearInterval(interval);
  interval=null;
  document.getElementById('btnText').textContent='Start';
  document.getElementById('btnIcon').innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
  document.getElementById('subTime').textContent='Paused';
  document.getElementById('lapBtn').disabled=true;
}

function addLap(){
  if(!running)return;
  const now=elapsed;
  const split=now-lastLapTime;
  lastLapTime=now;
  laps.push({time:now,split:split,num:laps.length+1});
  renderLaps();
  showToast('Lap '+laps.length+' · '+formatTime(split));
  if(navigator.vibrate)navigator.vibrate(20);
}

function resetAll(){
  if(elapsed>0&&!confirm('Reset stopwatch and clear all laps?'))return;
  stop();
  elapsed=0;lastLapTime=0;laps=[];
  updateDisplay();
  renderLaps();
  document.getElementById('subTime').textContent='Ready';
  document.getElementById('statsRow').style.display='none';
}

function updateDisplay(){
  const t=elapsed;
  const totalSec=Math.floor(t/1000);
  const h=Math.floor(totalSec/3600);
  const m=Math.floor((totalSec%3600)/60);
  const s=totalSec%60;
  const ms=Math.floor((t%1000)/10);
  let mainStr;
  if(h>0)mainStr=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  else mainStr=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  document.getElementById('bigTime').innerHTML=mainStr+'<span class="ms-part">.'+String(ms).padStart(2,'0')+'</span>';
}

function renderLaps(){
  const el=document.getElementById('lapsList');
  document.getElementById('lapsCount').textContent=laps.length+' lap'+(laps.length!==1?'s':'');
  if(laps.length===0){
    el.innerHTML='<div class="empty-laps">No laps recorded yet</div>';
    document.getElementById('statsRow').style.display='none';
    return;
  }
  let fastest=null,slowest=null;
  if(laps.length>=2){
    fastest=Math.min(...laps.map(l=>l.split));
    slowest=Math.max(...laps.map(l=>l.split));
    document.getElementById('statsRow').style.display='grid';
    document.getElementById('statFastest').textContent=formatTime(fastest);
    document.getElementById('statSlowest').textContent=formatTime(slowest);
  }
  const reversed=[...laps].reverse();
  el.innerHTML=reversed.map(l=>{
    let cls='',badge='';
    if(laps.length>=2&&l.split===fastest&&l.split!==slowest){cls='fastest';badge='<span class="lap-badge fast">Fast</span>';}
    else if(laps.length>=2&&l.split===slowest&&l.split!==fastest){cls='slowest';badge='<span class="lap-badge slow">Slow</span>';}
    return '<div class="lap '+cls+'"><div class="lap-num">#'+l.num+'</div><div class="lap-time">'+formatTime(l.time)+'</div><div class="lap-split">+'+formatTime(l.split)+badge+'</div></div>';
  }).join('');
}

function formatTime(ms){
  const total=Math.floor(ms/1000);
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=total%60;
  const cs=Math.floor((ms%1000)/10);
  if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0');
}

function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script></body></html>
