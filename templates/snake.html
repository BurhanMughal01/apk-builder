<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Snake</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet"><style>
:root{--bg:#000;--card:#0a1a0a;--elev:#0f2a0f;--text:#22ff88;--muted:#88ffaa;--sub:#008855;--pri:#22ff88;--neon:#ff00ff;--gold:#ffcc00;--red:#ff3355;--grad:linear-gradient(135deg,#22ff88,#00cc66);--bdr:rgba(34,255,136,0.3);--glow:0 0 20px rgba(34,255,136,0.6)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 50% 50%,rgba(34,255,136,0.06),transparent 70%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:50}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.hdr-t{flex:1;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--text)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--glow)}
.main{position:fixed;top:60px;bottom:0;left:0;right:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.main::-webkit-scrollbar{width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:400px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px;text-align:center}
.stat-v{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--pri);line-height:1;margin-bottom:6px;text-shadow:0 0 10px rgba(34,255,136,0.5)}
.stat-l{font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.game-wrap{position:relative;width:min(360px,92vw);aspect-ratio:1;border-radius:20px;overflow:hidden;border:2px solid var(--pri);box-shadow:var(--glow),inset 0 0 40px rgba(34,255,136,0.1);background:#000}
#gameCanvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10}
.overlay.hidden{display:none}
.ov-icon{font-size:64px;margin-bottom:16px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ov-title{font-family:'Press Start 2P',monospace;font-size:20px;color:var(--pri);margin-bottom:12px;text-shadow:0 0 20px rgba(34,255,136,0.8);line-height:1.4}
.ov-sub{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.btn{padding:16px 32px;border-radius:14px;background:var(--grad);color:#000;font-size:14px;font-weight:800;font-family:inherit;box-shadow:var(--glow);margin-bottom:10px;font-family:'Press Start 2P',monospace;letter-spacing:1px}
.btn:active{transform:scale(0.95)}
.btn-secondary{padding:12px 24px;border-radius:12px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;border:1px solid var(--bdr);font-family:inherit}
.controls-hint{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px;width:100%;max-width:400px;font-size:12px;color:var(--muted);line-height:1.8;text-align:center}
.controls-hint strong{color:var(--pri)}
.arrows{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px;margin-top:8px;justify-content:center}
.arrow{background:var(--card);border:1px solid var(--bdr);border-radius:14px;color:var(--pri);display:grid;place-items:center;font-size:24px}
.arrow:active{background:var(--elev);transform:scale(0.95)}
.arrow.empty{background:transparent;border:none;pointer-events:none}
.arrow svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--text);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--bdr);opacity:0;transition:all .3s;pointer-events:none;z-index:200}
.tt.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body>
<header class="hdr"><div class="hdr-t"><div class="logo">🐍</div><span>Snake</span></div><button class="ib" onclick="toggleTheme()"><svg viewBox="0 0 24 24" id="ti"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button></header>

<main class="main">
<div class="stats">
<div class="stat"><div class="stat-v" id="scoreVal">0</div><div class="stat-l">Score</div></div>
<div class="stat"><div class="stat-v" id="highVal">0</div><div class="stat-l">High</div></div>
<div class="stat"><div class="stat-v" id="speedVal">1</div><div class="stat-l">Speed</div></div>
</div>

<div class="game-wrap">
<canvas id="gameCanvas"></canvas>
<div class="overlay" id="overlay">
<div class="ov-icon" id="ovIcon">🐍</div>
<div class="ov-title" id="ovTitle">SNAKE</div>
<div class="ov-sub" id="ovSub">Swipe or use arrow buttons to play</div>
<button class="btn" id="playBtn" onclick="startGame()">PLAY</button>
<button class="btn-secondary" id="resetBtn" onclick="resetGame()">Reset</button>
</div>
</div>

<div class="arrows">
<div class="arrow empty"></div>
<button class="arrow" onclick="setDir(0,-1)"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<div class="arrow empty"></div>
<button class="arrow" onclick="setDir(-1,0)"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
<button class="arrow" onclick="togglePause()" style="font-size:11px;font-weight:800;font-family:'Press Start 2P',monospace" id="pauseBtn">II</button>
<button class="arrow" onclick="setDir(1,0)"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 19l7-7-7-7"/></svg></button>
<div class="arrow empty"></div>
<button class="arrow" onclick="setDir(0,1)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
<div class="arrow empty"></div>
</div>
</main>

<div class="tt" id="toast"><span id="tt-txt">Done</span></div>

<script>
const GRID=20;
let canvas,ctx,cellSize;
let snake=[],dir={x:1,y:0},nextDir={x:1,y:0},food={x:10,y:10},score=0,high=0,speed=1;
let gameRunning=false,gamePaused=false,gameOver=false,tickInterval=null,tickTime=200;
let lastRender=0,rafId=null;
let touchStart=null;
let ttm;

function init(){
  loadHigh();
  setupCanvas();
  resetGame();
  document.addEventListener('keydown',handleKey);
  document.addEventListener('touchstart',onTouchStart,{passive:true});
  document.addEventListener('touchmove',onTouchMove,{passive:true});
  document.addEventListener('touchend',onTouchEnd,{passive:true});
  loop();
}

function setupCanvas(){
  canvas=document.getElementById('gameCanvas');
  ctx=canvas.getContext('2d');
  resize();
  window.addEventListener('resize',resize);
}

function resize(){
  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cellSize=rect.width/GRID;
  draw();
}

function loadHigh(){
  try{high=parseInt(localStorage.getItem('snake_high')||'0');}catch(e){high=0;}
  document.getElementById('highVal').textContent=high;
}
function saveHigh(){try{localStorage.setItem('snake_high',String(high));}catch(e){}}

function resetGame(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;speed=1;gameOver=false;gamePaused=false;gameRunning=false;
  tickTime=200;
  if(tickInterval){clearInterval(tickInterval);tickInterval=null;}
  placeFood();
  updateScore();
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('ovIcon').textContent='🐍';
  document.getElementById('ovTitle').textContent='SNAKE';
  document.getElementById('ovSub').textContent='Swipe or use arrow buttons to play';
  document.getElementById('playBtn').textContent='PLAY';
  document.getElementById('playBtn').style.display='block';
  document.getElementById('pauseBtn').textContent='II';
  draw();
}

function startGame(){
  if(gameOver){resetGame();}
  gameRunning=true;gamePaused=false;gameOver=false;
  document.getElementById('overlay').classList.add('hidden');
  tickTime=200;
  if(tickInterval)clearInterval(tickInterval);
  tickInterval=setInterval(tick,tickTime);
}

function togglePause(){
  if(!gameRunning||gameOver)return;
  gamePaused=!gamePaused;
  document.getElementById('pauseBtn').textContent=gamePaused?'▶':'II';
  if(gamePaused){
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('ovIcon').textContent='⏸';
    document.getElementById('ovTitle').textContent='PAUSED';
    document.getElementById('ovSub').textContent='Take a break';
    document.getElementById('playBtn').textContent='RESUME';
    document.getElementById('playBtn').style.display='block';
    if(tickInterval){clearInterval(tickInterval);tickInterval=null;}
  }else{
    document.getElementById('overlay').classList.add('hidden');
    tickInterval=setInterval(tick,tickTime);
  }
}

function tick(){
  if(!gameRunning||gamePaused||gameOver)return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID){endGame();return;}
  for(let i=0;i<snake.length;i++){if(snake[i].x===head.x&&snake[i].y===head.y){endGame();return;}}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;
    if(score>high){high=score;saveHigh();}
    updateScore();
    placeFood();
    if(score%50===0&&speed<10){speed++;document.getElementById('speedVal').textContent=speed;tickTime=Math.max(80,tickTime-15);if(tickInterval){clearInterval(tickInterval);tickInterval=setInterval(tick,tickTime);}}
    if(navigator.vibrate)navigator.vibrate(30);
  }else{snake.pop();}
  draw();
}

function placeFood(){
  let tries=0;
  while(tries<200){
    const f={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};
    if(!snake.some(s=>s.x===f.x&&s.y===f.y)){food=f;return;}
    tries++;
  }
}

function draw(){
  if(!ctx)return;
  const w=canvas.width/(window.devicePixelRatio||1);
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,w,w);
  // grid
  ctx.strokeStyle='rgba(34,255,136,0.06)';
  ctx.lineWidth=1;
  for(let i=1;i<GRID;i++){
    ctx.beginPath();ctx.moveTo(i*cellSize,0);ctx.lineTo(i*cellSize,w);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*cellSize);ctx.lineTo(w,i*cellSize);ctx.stroke();
  }
  // food
  ctx.shadowColor='#ff3355';ctx.shadowBlur=20;
  ctx.fillStyle='#ff3355';
  const fp=cellSize*0.15;
  ctx.beginPath();
  ctx.arc(food.x*cellSize+cellSize/2,food.y*cellSize+cellSize/2,cellSize/2-fp,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
  // snake
  for(let i=0;i<snake.length;i++){
    const s=snake[i];
    const isHead=i===0;
    ctx.shadowColor='#22ff88';
    ctx.shadowBlur=isHead?20:10;
    if(isHead){ctx.fillStyle='#88ffcc';}
    else{
      const t=1-(i/snake.length)*0.6;
      ctx.fillStyle='rgb('+Math.round(34*t)+','+Math.round(255*t)+','+Math.round(136*t)+')';
    }
    const pad=cellSize*0.08;
    const r=isHead?cellSize*0.4:cellSize*0.3;
    roundRect(s.x*cellSize+pad,s.y*cellSize+pad,cellSize-pad*2,cellSize-pad*2,r);
    ctx.fill();
  }
  ctx.shadowBlur=0;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function endGame(){
  gameRunning=false;gameOver=true;
  if(tickInterval){clearInterval(tickInterval);tickInterval=null;}
  if(navigator.vibrate)navigator.vibrate([100,50,100,50,200]);
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('ovIcon').textContent='💀';
  document.getElementById('ovTitle').textContent='GAME OVER';
  document.getElementById('ovSub').innerHTML='Score: <strong style="color:#22ff88">'+score+'</strong><br>High: <strong style="color:#ffcc00">'+high+'</strong>';
  document.getElementById('playBtn').textContent='PLAY AGAIN';
}

function updateScore(){
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('highVal').textContent=high;
}

function setDir(x,y){
  if(!gameRunning||gamePaused||gameOver)return;
  if(dir.x===-x&&dir.y===-y)return;
  nextDir={x,y};
}

function handleKey(e){
  const k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();setDir(0,-1);}
  else if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();setDir(0,1);}
  else if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();setDir(-1,0);}
  else if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();setDir(1,0);}
  else if(k===' '){e.preventDefault();togglePause();}
}

function onTouchStart(e){const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY};}
function onTouchMove(e){if(!touchStart)return;const t=e.touches[0];const dx=t.clientX-touchStart.x;const dy=t.clientY-touchStart.y;if(Math.abs(dx)>30||Math.abs(dy)>30){if(Math.abs(dx)>Math.abs(dy)){setDir(dx>0?1:-1,0);}else{setDir(0,dy>0?1:-1);}touchStart=null;}}
function onTouchEnd(){touchStart=null;}

function loop(){rafId=requestAnimationFrame(loop);}
function toggleTheme(){}

function showToast(m){const t=document.getElementById('toast');document.getElementById('tt-txt').textContent=m;t.classList.add('show');clearTimeout(ttm);ttm=setTimeout(()=>t.classList.remove('show'),1500);}

init();
</script></body></html>
