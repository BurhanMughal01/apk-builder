<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Real Car Simulator - Burhan Ahmad Mughal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:6px;background:#080a0f;color:#fff;font-family:Segoe UI,Arial,sans-serif;text-align:center;user-select:none;overflow:hidden;touch-action:none}.title{font-size:19px;font-weight:800;color:#f39c12;margin:2px}.credit{font-size:12px;color:#2ecc71;background:#1f2833;padding:5px 9px;border-radius:6px;margin-bottom:6px;display:inline-block}#game-window{position:relative;width:min(360px,96vw);height:min(680px,86vh);min-height:540px;margin:auto;background:#111;border:3px solid #f39c12;border-radius:14px;overflow:hidden;box-shadow:0 0 18px rgba(243,156,18,.35)}.sky{position:absolute;top:0;left:0;width:100%;height:95px;background:linear-gradient(#020024,#090979,#172554)}.city{position:absolute;top:95px;bottom:0;width:18%;background:#182238;overflow:hidden}.city:first-of-type{left:0;border-right:2px solid #555}.city:last-of-type{right:0;border-left:2px solid #555}.bldg{position:absolute;width:75%;background:#3a506b;border:1px solid #0b0c10}.bldg-window{width:6px;height:7px;background:#ffea00;margin:4px;display:inline-block;box-shadow:0 0 5px #ffea00}#road{position:absolute;top:95px;bottom:155px;left:18%;width:64%;background:#292c3b;overflow:hidden;border-left:3px solid #eee;border-right:3px solid #eee}.lane-mark{position:absolute;left:calc(50% - 5px);width:10px;height:48px;background:#f1c40f;border-radius:2px}.car{position:absolute;width:46px;height:72px;border-radius:8px;border:2px solid #fff;box-shadow:0 5px 10px rgba(0,0,0,.65);z-index:5}.glass{width:34px;height:18px;background:#3498db;margin:7px auto;border-radius:3px;border:1px solid #bfe9ff}.light{position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;bottom:5px;box-shadow:0 0 5px #fff}.light.l{left:6px}.light.r{right:6px}#player-car{bottom:18px;background:#e74c3c;transition:left .08s ease}#enemy-car{top:-90px;background:#9b59b6}#dashboard{position:absolute;bottom:0;width:100%;height:155px;background:linear-gradient(#1c2541,#000);border-top:3px solid #f39c12;z-index:10;padding:6px}.dash-top{display:flex;justify-content:space-around;align-items:center}.gauge{width:62px;height:62px;border-radius:50%;border:3px solid #00b4d8;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:10px;color:#aaa}.gauge-val{font-size:16px;font-weight:800;color:#ffea00}.steering{width:62px;height:62px;border:5px solid #888;border-radius:50%;position:relative;background:#222;transition:transform .12s}.steering:before{content:'';position:absolute;top:26px;left:0;width:100%;height:5px;background:#888}.steering:after{content:'';position:absolute;top:26px;left:27px;width:5px;height:24px;background:#888}.controls{display:flex;justify-content:space-between;gap:6px;margin-top:8px;padding:0 4px}.btn{background:#27ae60;color:#fff;border:0;padding:9px 10px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer;min-width:76px}.btn:active{transform:scale(.95)}.btn-horn{background:#e67e22}.btn-pause{background:#8e44ad}.btn-start{background:#2980b9;width:100%;margin-top:6px}.status{font-size:11px;color:#ddd;height:15px;margin-top:3px}@media(max-height:620px){#game-window{height:570px;min-height:0}}
</style></head>
<body>
<div class="title">ریئل کار ڈرائیونگ سمیلیٹر 🚗</div><div class="credit">یہ گیم Burhan Ahmad Mughal کے پرامپٹ سے بنی ہے</div>
<div id="game-window"><div class="sky"></div><div class="city" id="left-buildings"></div>
<div id="road"><div class="lane-mark" style="top:0"></div><div class="lane-mark" style="top:120px"></div><div class="lane-mark" style="top:240px"></div><div class="lane-mark" style="top:360px"></div>
<div id="player-car" class="car"><div class="glass"></div><div class="light l"></div><div class="light r"></div></div><div id="enemy-car" class="car"><div class="glass"></div><div class="light l"></div><div class="light r"></div></div></div>
<div class="city" id="right-buildings"></div>
<div id="dashboard"><div class="dash-top"><div class="gauge">اسپیڈ<div class="gauge-val" id="speed-val">0</div>KM/H</div><div class="steering" id="steering-wheel"></div><div class="gauge">اسکور<div class="gauge-val" id="score-val">0</div>POINTS</div></div>
<div class="controls"><button class="btn" id="left-btn">◀ بائیں</button><button class="btn btn-horn" id="horn-btn">🔊 ہارن</button><button class="btn" id="right-btn">دائیں ▶</button></div><button id="start-btn" class="btn btn-start">گیم اسٹارٹ کریں 🚗</button><button id="pause-btn" class="btn btn-pause" style="display:none;width:100%;margin-top:6px">⏸ روکیں</button><div class="status" id="status">شروع کرنے کے لیے بٹن دبائیں</div></div></div>
<script>
'use strict';const road=document.getElementById('road'),playerCar=document.getElementById('player-car'),enemyCar=document.getElementById('enemy-car'),steering=document.getElementById('steering-wheel'),speedVal=document.getElementById('speed-val'),scoreVal=document.getElementById('score-val'),startBtn=document.getElementById('start-btn'),pauseBtn=document.getElementById('pause-btn'),statusEl=document.getElementById('status');let playerX=0,enemyY=-90,enemyX=0,speed=0,score=0,gameActive=false,paused=false,lastTime=0,animationId=null,audioCtx=null;const lanes=[.18,.5,.82];
function speakVoice(t){if('speechSynthesis'in window){speechSynthesis.cancel();let m=new SpeechSynthesisUtterance(t);m.lang='ur-PK';m.rate=.9;speechSynthesis.speak(m)}}function beep(f=440,d=.15,type='square'){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}catch(e){}}
function playHorn(){beep(220,.18,'sawtooth');setTimeout(()=>beep(165,.18,'sawtooth'),100);speakVoice('ہارن بج رہا ہے')}
function createBuildings(){['left-buildings','right-buildings'].forEach(id=>{let s=document.getElementById(id);s.innerHTML='';for(let i=0;i<7;i++){let b=document.createElement('div');b.className='bldg';b.style.top=(i*90-20)+'px';b.style.height=(60+(i%3)*18)+'px';b.innerHTML='<span class="bldg-window"></span>'.repeat(3);s.appendChild(b)}})}createBuildings();
function laneToX(i){return road.clientWidth*lanes[i]-enemyCar.offsetWidth/2}function setPlayer(){playerCar.style.left=playerX+'px'}function movePlayer(dir){if(!gameActive||paused)return;let step=Math.max(38,road.clientWidth*.30),max=road.clientWidth-playerCar.offsetWidth;playerX=Math.max(4,Math.min(max,playerX+dir*step));setPlayer();steering.style.transform=`rotate(${dir*45}deg)`;setTimeout(()=>steering.style.transform='rotate(0deg)',140);beep(dir<0?330:390,.06)}
function resetEnemy(){let i=Math.floor(Math.random()*3);enemyX=laneToX(i);enemyY=-enemyCar.offsetHeight-10;enemyCar.style.left=enemyX+'px';enemyCar.style.top=enemyY+'px'}
function startGame(){if(gameActive)return;gameActive=true;paused=false;score=0;speed=65;playerX=road.clientWidth/2-playerCar.offsetWidth/2;setPlayer();resetEnemy();startBtn.style.display='none';pauseBtn.style.display='block';pauseBtn.textContent='⏸ روکیں';statusEl.textContent='گاڑی چل رہی ہے — راستہ صاف رکھیں';speakVoice('گیم شروع ہو گئی ہے۔ احتیاط سے گاڑی چلائیں');beep(600,.12);lastTime=performance.now();animationId=requestAnimationFrame(gameLoop)}
function togglePause(){if(!gameActive)return;paused=!paused;pauseBtn.textContent=paused?'▶ دوبارہ چلائیں':'⏸ روکیں';statusEl.textContent=paused?'گیم روک دی گئی ہے':'گاڑی دوبارہ چل رہی ہے';if(!paused){lastTime=performance.now();animationId=requestAnimationFrame(gameLoop)}}
function gameLoop(now){if(!gameActive||paused)return;let dt=Math.min((now-lastTime)/16.67,2);lastTime=now;let roadSpeed=4.2+(speed-60)*.035;enemyY+=roadSpeed*dt;enemyCar.style.top=enemyY+'px';document.querySelectorAll('.lane-mark').forEach(m=>{let t=parseFloat(m.style.top||0)+roadSpeed*1.25*dt;if(t>road.clientHeight)t=-55;m.style.top=t+'px'});score+=dt;speed=Math.min(180,65+Math.floor(score/7));scoreVal.textContent=Math.floor(score/5);speedVal.textContent=Math.floor(speed);if(enemyY>road.clientHeight+20){resetEnemy();score+=4}let py=road.clientHeight-playerCar.offsetHeight-18,ex=enemyX,ey=enemyY;if(playerX<ex+enemyCar.offsetWidth-5&&playerX+playerCar.offsetWidth-5>ex&&py<ey+enemyCar.offsetHeight-5&&py+playerCar.offsetHeight-5>ey){endGame();return}animationId=requestAnimationFrame(gameLoop)}
function endGame(){gameActive=false;paused=false;if(animationId)cancelAnimationFrame(animationId);animationId=null;speedVal.textContent='0';pauseBtn.style.display='none';startBtn.style.display='block';startBtn.textContent='دوبارہ گیم کھیلیں 🔄';statusEl.textContent='حادثہ! دوبارہ کوشش کریں';beep(100,.5,'sawtooth');speakVoice('حادثہ ہو گیا۔ گیم ختم ہو گئی ہے');setTimeout(()=>alert('حادثہ ہو گیا! آپ کا اسکور: '+Math.floor(score/5)),100)}
function resetGame(){if(animationId)cancelAnimationFrame(animationId);animationId=null;gameActive=false;paused=false;score=0;speed=0;speedVal.textContent='0';scoreVal.textContent='0';startBtn.style.display='block';startBtn.textContent='گیم اسٹارٹ کریں 🚗';pauseBtn.style.display='none';statusEl.textContent='شروع کرنے کے لیے بٹن دبائیں';playerX=road.clientWidth/2-playerCar.offsetWidth/2;setPlayer();resetEnemy()}
[['left-btn',()=>movePlayer(-1)],['right-btn',()=>movePlayer(1)],['horn-btn',playHorn],['start-btn',startGame],['pause-btn',togglePause]].forEach(([id,fn])=>document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();fn()}));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){e.preventDefault();movePlayer(-1)}if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){e.preventDefault();movePlayer(1)}if(e.key===' '){e.preventDefault();togglePause()}if(e.key.toLowerCase()==='h'){e.preventDefault();playHorn()}});window.addEventListener('resize',()=>{if(!gameActive){playerX=road.clientWidth/2-playerCar.offsetWidth/2;setPlayer()}});resetGame();
</script></body></html>
