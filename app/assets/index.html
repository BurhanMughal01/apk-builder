<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            user-select: none;
        }

        h2 {
            color: #4CAF50;
            margin: 5px 0;
        }

        .score-board {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #game-canvas {
            background-color: #1e1e1e;
            border: 3px solid #4CAF50;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
        }

        .d-pad {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .row {
            display: flex;
            justify-content: center;
        }

        .btn {
            background-color: #333;
            color: #fff;
            border: 2px solid #4CAF50;
            padding: 12px 20px;
            font-size: 18px;
            margin: 4px;
            border-radius: 8px;
            cursor: pointer;
            width: 60px;
            height: 50px;
            font-weight: bold;
        }

        .btn:active {
            background-color: #4CAF50;
        }

        .btn-start {
            background-color: #4CAF50;
            width: 200px;
            height: 45px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>اسنیک اسنیک گیم 🐍🍎</h2>
    
    <div class="score-board">
        اسکور: <b id="score-text">0</b>
    </div>

    <canvas id="game-canvas" width="300" height="300"></canvas>

    <!-- Mobile Controls -->
    <div class="d-pad">
        <div class="row">
            <button class="btn" onclick="changeDirection('UP')">▲</button>
        </div>
        <div class="row">
            <button class="btn" onclick="changeDirection('LEFT')">►</button>
            <button class="btn" onclick="changeDirection('DOWN')">▼</button>
            <button class="btn" onclick="changeDirection('RIGHT')">◄</button>
        </div>
    </div>

    <button id="start-btn" class="btn btn-start" onclick="startGame()">گیم شروع کریں</button>

    <script>
        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score-text");

        const gridSize = 15;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let gameLoop = null;
        let isPlaying = false;

        function startGame() {
            if (isPlaying) return;
            
            snake = [
                { x: 5 * gridSize, y: 5 * gridSize },
                { x: 4 * gridSize, y: 5 * gridSize }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            isPlaying = true;

            spawnFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 120);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;
        }

        function changeDirection(dir) {
            if (!isPlaying) return;
            if (dir === 'UP' && dy === 0) { dx = 0; dy = -gridSize; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = gridSize; }
            if (dir === 'RIGHT' && dx === 0) { dx = -gridSize; dy = 0; }
            if (dir === 'LEFT' && dx === 0) { dx = gridSize; dy = 0; }
        }

        // Keyboard Controls
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp") changeDirection('UP');
            if (e.key === "ArrowDown") changeDirection('DOWN');
            if (e.key === "ArrowRight") changeDirection('RIGHT');
            if (e.key === "ArrowLeft") changeDirection('LEFT');
        });

        function update() {
            // Move Snake Head
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return gameOver();
            }

            // Self Collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return gameOver();
                }
            }

            snake.unshift(head);

            // Eat Food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food (Snack)
            ctx.fillStyle = "#ff4081";
            ctx.beginPath();
            ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw Snake
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? "#4CAF50" : "#8BC34A";
                ctx.fillRect(snake[i].x, snake[i].y, gridSize - 1, gridSize - 1);
            }
        }

        function gameOver() {
            clearInterval(gameLoop);
            isPlaying = false;
            alert("گیم ختم ہو گیا! آپ کا اسکور: " + score);
        }
    </script>
</body>
</html>
