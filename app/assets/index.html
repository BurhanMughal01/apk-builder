<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasbeeh Pro Max</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --gold: #fbbf24;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.8);
            --accent: #059669;
            --accent-glow: rgba(5, 150, 105, 0.3);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border: rgba(0, 0, 0, 0.08);
            --gold: #d97706;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; background-image: radial-gradient(circle at top, var(--accent-glow) 0%, transparent 40%); }
        .app-container { width: 100%; max-width: 480px; background: var(--card-bg); backdrop-filter: blur(12px); min-height: 100vh; display: flex; flex-direction: column; border-left: 1px solid var(--border); border-right: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.3); position: relative; }

        .screen { display: none; flex-direction: column; flex: 1; padding: 16px; padding-bottom: 50px; }
        .screen.active { display: flex; }

        .top-bar, .nav-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .app-title { font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }
        .tools { display: flex; gap: 8px; align-items: center; }

        select.lang-select { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; font-size: 13px; outline: none; cursor: pointer; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-primary); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

        .stats-card { background: linear-gradient(135deg, var(--accent), #047857); color: white; padding: 16px; border-radius: 16px; margin-bottom: 14px; text-align: center; box-shadow: 0 8px 20px var(--accent-glow); }
        .stat-num { font-size: 28px; font-weight: 800; display: block; }

        .search-box input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-primary); font-size: 14px; outline: none; margin-bottom: 12px; }

        .dhikr-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; max-height: 50vh; }
        .dhikr-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .dhikr-item:hover { border-color: var(--accent); transform: translateY(-2px); }
        .dhikr-item .info h3 { font-size: 16px; margin-bottom: 4px; color: var(--text-primary); }
        .dhikr-item .info p { font-size: 12px; color: var(--text-secondary); }
        .badge { background: var(--accent); color: #fff; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; }

        .btn-primary { background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; margin-top: 10px; cursor: pointer; text-align: center; box-shadow: 0 8px 20px var(--accent-glow); }

        .card-detail { background: var(--card-bg); border-radius: 18px; padding: 18px; border: 1px solid var(--border); margin-bottom: 15px; max-height: 250px; overflow-y: auto; text-align: center; }
        .arabic-text { font-size: 24px; line-height: 2; color: var(--gold); font-weight: 600; margin-bottom: 10px; direction: rtl; }
        .trans-block { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.5; }

        .counter-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ring-container { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .progress-ring { transform: rotate(-90deg); }
        .progress-ring-circle { transition: stroke-dashoffset 0.25s ease; stroke-dasharray: 502; stroke-dashoffset: 502; }
        .counter-content { position: absolute; text-align: center; }
        .count-number { font-size: 52px; font-weight: 800; color: var(--text-primary); }
        .count-target { font-size: 13px; color: var(--text-secondary); }

        .action-row { display: flex; gap: 10px; width: 100%; margin-top: 20px; }
        .btn-sub { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-primary); font-weight: 700; cursor: pointer; }
        .btn-danger { color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-secondary); }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-primary); outline: none; }
        .form-group textarea { height: 75px; resize: none; }

        .backup-bar { display: flex; gap: 8px; margin-top: 8px; }
        .btn-sm { flex: 1; padding: 8px; font-size: 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary); cursor: pointer; text-align: center; }

        .footer-credit { position: absolute; bottom: 12px; left: 0; width: 100%; text-align: center; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
        .footer-credit span { color: var(--gold); font-weight: 700; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <span class="app-title" id="appTitle">📿 Tasbeeh Pro</span>
        <div class="tools">
            <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="ur">اردو</option>
                <option value="ar">العربية</option>
                <option value="tr">Türkçe</option>
            </select>
            <button class="icon-btn" id="soundToggle" onclick="toggleSound()">🔊</button>
            <button class="icon-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
        </div>
    </div>

    <!-- 1. List Screen -->
    <div id="list-screen" class="screen active">
        <div class="stats-card">
            <div class="stat-box"><span class="stat-num" id="totalDailyCount">0</span><span id="labelToday">Today Total</span></div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search Dhikr..." oninput="filterList()">
        </div>
        <div class="dhikr-list" id="dhikrListContainer"></div>
        <button type="button" class="btn-primary" id="addBtnText" onclick="openAddScreen()">+ Add Custom Dhikr</button>
        
        <div class="backup-bar">
            <button type="button" class="btn-sm" onclick="exportData()">💾 Backup Data</button>
            <button type="button" class="btn-sm" onclick="importData()">📂 Restore Data</button>
        </div>
    </div>

    <!-- 2. Detail Screen -->
    <div id="detail-screen" class="screen">
        <div class="nav-bar">
            <button type="button" class="icon-btn" onclick="showScreen('list-screen')">←</button>
            <div class="tools">
                <button class="icon-btn" onclick="changeFontSize(2)">A+</button>
                <button class="icon-btn" onclick="changeFontSize(-2)">A-</button>
            </div>
        </div>
        <div class="card-detail">
            <div class="arabic-text" id="detailArabic"></div>
            <div class="trans-block" id="detailTrans"></div>
            <div class="trans-block" id="detailBenefit"></div>
        </div>
        <div class="counter-section">
            <div class="ring-container" onclick="handleTap()">
                <svg class="progress-ring" width="200" height="200">
                    <circle class="progress-ring-circle-bg" stroke="rgba(255,255,255,0.1)" stroke-width="12" fill="transparent" r="80" cx="100" cy="100"/>
                    <circle class="progress-ring-circle" id="progressCircle" stroke="#10b981" stroke-width="12" stroke-linecap="round" fill="transparent" r="80" cx="100" cy="100"/>
                </svg>
                <div class="counter-content">
                    <div class="count-number" id="countDisplay">0</div>
                    <div class="count-target" id="targetDisplay">Target: 0</div>
                </div>
            </div>
            <div class="action-row">
                <button type="button" class="btn-sub" id="resetBtnText" onclick="resetCurrentCount()">Reset</button>
                <button type="button" class="btn-sub" id="editBtnText" onclick="editCurrentDhikr()">Edit</button>
                <button type="button" class="btn-sub btn-danger" id="deleteBtnText" onclick="deleteCurrentDhikr()">Delete</button>
            </div>
        </div>
    </div>

    <!-- 3. Form Screen -->
    <div id="add-screen" class="screen">
        <div class="nav-bar">
            <button type="button" class="icon-btn" onclick="showScreen('list-screen')">←</button>
            <h3 id="formHeading">Add New Dhikr</h3>
        </div>
        <div class="form-group"><label>Title</label><input type="text" id="customTitle"></div>
        <div class="form-group"><label>Arabic</label><textarea id="customArabic"></textarea></div>
        <div class="form-group"><label>Translation</label><textarea id="customTrans"></textarea></div>
        <div class="form-group"><label>Benefit</label><input type="text" id="customBenefit"></div>
        <div class="form-group"><label>Target</label><input type="number" id="customTarget" value="33"></div>
        <button type="button" class="btn-primary" style="width: 100%;" id="saveBtnText" onclick="saveDhikr()">Save</button>
    </div>

    <!-- Credit Footer -->
    <div class="footer-credit">
        Developed by <span>Burhan Ahmad Mughal</span>
    </div>
</div>

<script>
let memoryCustomDhikrs = [];
let memoryCounts = {};

function getData(key) {
    try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : (key === 'custom_dhikrs' ? memoryCustomDhikrs : memoryCounts);
    } catch(e) {
        return key === 'custom_dhikrs' ? memoryCustomDhikrs : memoryCounts;
    }
}

function setData(key, val) {
    if (key === 'custom_dhikrs') memoryCustomDhikrs = val;
    if (key === 'my_counts') memoryCounts = val;
    try {
        localStorage.setItem(key, JSON.stringify(val));
    } catch(e) {}
}

const uiTranslations = {
    en: { title: "📿 Tasbeeh Pro", search: "🔍 Search Dhikr...", addBtn: "+ Add Custom Dhikr", target: "Target", reset: "Reset", edit: "Edit", delete: "Delete", addHead: "Add New Dhikr", save: "Save Dhikr", today: "Today Total", transLbl: "Translation: ", benefitLbl: "Benefit: " },
    ur: { title: "📿 تسبیح پرو", search: "🔍 ذکر تلاش کریں...", addBtn: "➕ نیا ذکر شامل کریں", target: "ہدف", reset: "ری سیٹ", edit: "ترمیم", delete: "ڈیلیٹ", addHead: "نیا ذکر شامل کریں", save: "محفوظ کریں", today: "آج کی کل تعداد", transLbl: "ترجمہ: ", benefitLbl: "فائدہ: " },
    ar: { title: "📿 التسبيح الذكي", search: "🔍 بحث عن الذكر...", addBtn: "➕ إضافة ذكر جديد", target: "الهدف", reset: "إعادة ضبط", edit: "تعديل", delete: "حذف", addHead: "إضافة ذكر جديد", save: "حفظ", today: "المجموع اليوم", transLbl: "الترجمة: ", benefitLbl: "الفائدة: " },
    tr: { title: "📿 Zikirmatik Pro", search: "🔍 Zikir Ara...", addBtn: "+ Yeni Zikir Ekle", target: "Hedef", reset: "Sıfırla", edit: "Düzenle", delete: "Sil", addHead: "Yeni Zikir Ekle", save: "Kaydet", today: "Bugün Toplam", transLbl: "Anlamı: ", benefitLbl: "Fazileti: " }
};

let currentLang = 'en', soundEnabled = true, fontSize = 24;

// Default Dhikrs with Multi-Language Translations & Benefits
const defaultDhikrs = [
    { 
        id: 1, 
        title: { en: "Ayat al-Kursi", ur: "آیۃ الکرسی", ar: "آية الكرسي", tr: "Ayet'el Kürsi" }, 
        arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", 
        trans: { 
            en: "Allah! There is no deity except Him, the Ever-Living, the Sustainer of all existence.", 
            ur: "اللہ! اس کے سوا کوئی معبود نہیں، وہ زندہ ہے، سب کو سنبھالنے والا ہے۔", 
            ar: "الله لا إله إلا هو الحي القيوم...", 
            tr: "Allah, O'ndan başka ilah yoktur. Diridir, kaimdir." 
        }, 
        benefit: { 
            en: "Protection from all evil, hardship, and Satan.", 
            ur: "ہر قسم کے شر، آفتوں اور شیطان سے مکمل حفاظت۔", 
            ar: "الحماية والوقاية من كل شر والشيطان.", 
            tr: "Her türlü kötülükten ve şeytandan koruma." 
        }, 
        target: 1 
    },
    { 
        id: 2, 
        title: { en: "Surah Al-Ikhlas", ur: "سورۃ الاخلاص", ar: "سورة الإخلاص", tr: "İhlas Suresi" }, 
        arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ۝", 
        trans: { 
            en: "Say, 'He is Allah, [who is] One...'", 
            ur: "کہہ دیجئے، وہ اللہ ایک ہے۔ وہ بے نیاز ہے۔", 
            ar: "قل هو الله أحد، الله الصمد...", 
            tr: "De ki: O Allah tektir. Allah sameddir..." 
        }, 
        benefit: { 
            en: "Reward equal to reading 1/3 of the Quran.", 
            ur: "ایک تہائی قرآن پاک پڑھنے کا ثواب ملتا ہے۔", 
            ar: "تعدل ثلث القرآن الكريم في الأجر.", 
            tr: "Kur'an-ı Kerim'in üçte birine denktir." 
        }, 
        target: 3 
    },
    { 
        id: 3, 
        title: { en: "SubhanAllah", ur: "سبحان اللہ", ar: "سبحان الله", tr: "Sübhanallah" }, 
        arabic: "سُبْحَانَ اللَّهِ", 
        trans: { 
            en: "Glory be to Allah.", 
            ur: "اللہ پاک اور تمام نقائص سے بے عیب ہے۔", 
            ar: "تنزيه الله عن كل نقص.", 
            tr: "Allah her türlü noksandan münezzehtir." 
        }, 
        benefit: { 
            en: "A date-palm tree is planted in Paradise.", 
            ur: "جنت میں پڑھنے والے کے لیے ایک درخت لگایا جاتا ہے۔", 
            ar: "غرس نخلة في الجنة لكل مرة.", 
            tr: "Cennette okuyan için bir ağaç dikilir." 
        }, 
        target: 33 
    },
    { 
        id: 4, 
        title: { en: "Alhamdulillah", ur: "الحمد للہ", ar: "الحمد لله", tr: "Elhamdülillah" }, 
        arabic: "الْحَمْدُ لِلَّهِ", 
        trans: { 
            en: "Praise be to Allah.", 
            ur: "تمام تعریفیں اور شکر اللہ ہی کے لیے ہیں۔", 
            ar: "الثناء والحمد لله رب العالمين.", 
            tr: "Her türlü övgü Allah'a mahsustur." 
        }, 
        benefit: { 
            en: "Fills the scale of good deeds on Judgment Day.", 
            ur: "قیامت کے دن نیکیوں کے ترازو کو بھر دیتا ہے۔", 
            ar: "تملأ الميزان بالحسنات يوم القيامة.", 
            tr: "Kıyamet gününde sevap tartısını doldurur." 
        }, 
        target: 33 
    },
    { 
        id: 5, 
        title: { en: "Allahu Akbar", ur: "اللہ اکبر", ar: "الله أكبر", tr: "Allahü Ekber" }, 
        arabic: "اللَّهُ أَكْبَرُ", 
        trans: { 
            en: "Allah is the Greatest.", 
            ur: "اللہ سب سے بڑا اور عظمت والا ہے۔", 
            ar: "الله أعظم وأكبر من كل شيء.", 
            tr: "Allah en büyüktür." 
        }, 
        benefit: { 
            en: "High spiritual status and immense rewards.", 
            ur: "بلند روحانی درجات اور عظیم اجر و ثواب۔", 
            ar: "رفعة الدرجات والأجر العظيم عند الله.", 
            tr: "Yüksek dereceler ve büyük sevap kazanımı." 
        }, 
        target: 34 
    }
];

let allDhikrs = [], activeDhikrId = null, editingId = null;
let counts = {};

function getLocalizedText(field, lang) {
    if (!field) return '';
    if (typeof field === 'string') return field;
    return field[lang] || field['en'] || Object.values(field)[0] || '';
}

function init() {
    counts = getData('my_counts') || {};
    let customDhikrs = getData('custom_dhikrs') || [];
    allDhikrs = [...defaultDhikrs, ...customDhikrs];
    renderList(allDhikrs);
    updateTotalDailyCount();
}

function renderList(list) {
    const container = document.getElementById('dhikrListContainer');
    if (!container) return;
    container.innerHTML = '';
    list.forEach(item => {
        const titleText = getLocalizedText(item.title, currentLang);
        const div = document.createElement('div');
        div.className = 'dhikr-item';
        div.onclick = () => openDhikrDetail(item.id);
        div.innerHTML = `<div class="info"><h3>${titleText}</h3><p>${uiTranslations[currentLang].target}: ${item.target}</p></div><div class="badge">${counts[item.id] || 0}</div>`;
        container.appendChild(div);
    });
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function openDhikrDetail(id) {
    activeDhikrId = id;
    const dhikr = allDhikrs.find(d => d.id === id);
    if(!dhikr) return;
    
    const transText = getLocalizedText(dhikr.trans, currentLang);
    const benefitText = getLocalizedText(dhikr.benefit, currentLang);

    document.getElementById('detailArabic').innerText = dhikr.arabic || '';
    document.getElementById('detailTrans').innerText = transText ? uiTranslations[currentLang].transLbl + transText : '';
    document.getElementById('detailBenefit').innerText = benefitText ? uiTranslations[currentLang].benefitLbl + benefitText : '';
    document.getElementById('targetDisplay').innerText = `${uiTranslations[currentLang].target}: ${dhikr.target || 0}`;
    
    const isCustom = !defaultDhikrs.some(d => d.id === id);
    document.getElementById('editBtnText').style.display = isCustom ? 'block' : 'none';
    document.getElementById('deleteBtnText').style.display = isCustom ? 'block' : 'none';
    updateCounterDisplay();
    showScreen('detail-screen');
}

function handleTap() {
    if (!activeDhikrId) return;
    counts[activeDhikrId] = (counts[activeDhikrId] || 0) + 1;
    setData('my_counts', counts);
    if (soundEnabled) playClickSound();
    if (navigator.vibrate) navigator.vibrate(30);
    updateCounterDisplay();
    updateTotalDailyCount();
    renderList(allDhikrs);
}

function updateCounterDisplay() {
    const current = counts[activeDhikrId] || 0;
    const dhikr = allDhikrs.find(d => d.id === activeDhikrId);
    const target = dhikr ? dhikr.target : 33;
    document.getElementById('countDisplay').innerText = current;
    const circle = document.getElementById('progressCircle');
    if(circle && circle.r) {
        const radius = circle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        const offset = circumference - Math.min(current / target, 1) * circumference;
        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = offset;
    }
}

function updateTotalDailyCount() {
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    document.getElementById('totalDailyCount').innerText = total;
}

function resetCurrentCount() {
    if (!activeDhikrId) return;
    counts[activeDhikrId] = 0;
    setData('my_counts', counts);
    updateCounterDisplay();
    updateTotalDailyCount();
    renderList(allDhikrs);
}

function openAddScreen() {
    editingId = null;
    document.getElementById('customTitle').value = '';
    document.getElementById('customArabic').value = '';
    document.getElementById('customTrans').value = '';
    document.getElementById('customBenefit').value = '';
    document.getElementById('customTarget').value = 33;
    showScreen('add-screen');
}

function editCurrentDhikr() {
    const dhikr = allDhikrs.find(d => d.id === activeDhikrId);
    if(!dhikr) return;
    editingId = dhikr.id;
    document.getElementById('customTitle').value = getLocalizedText(dhikr.title, currentLang);
    document.getElementById('customArabic').value = dhikr.arabic || '';
    document.getElementById('customTrans').value = getLocalizedText(dhikr.trans, currentLang);
    document.getElementById('customBenefit').value = getLocalizedText(dhikr.benefit, currentLang);
    document.getElementById('customTarget').value = dhikr.target || 33;
    showScreen('add-screen');
}

function deleteCurrentDhikr() {
    if (confirm("Delete this Dhikr?")) {
        let customDhikrs = getData('custom_dhikrs') || [];
        customDhikrs = customDhikrs.filter(d => d.id !== activeDhikrId);
        setData('custom_dhikrs', customDhikrs);
        init();
        showScreen('list-screen');
    }
}

function saveDhikr() {
    const title = document.getElementById('customTitle').value.trim();
    if (!title) return alert('Title is required');
    let customDhikrs = getData('custom_dhikrs') || [];
    const targetVal = parseInt(document.getElementById('customTarget').value) || 33;
    const arabicVal = document.getElementById('customArabic').value;
    const transVal = document.getElementById('customTrans').value;
    const benefitVal = document.getElementById('customBenefit').value;

    if (editingId) {
        customDhikrs = customDhikrs.map(d => d.id === editingId ? { ...d, title, arabic: arabicVal, trans: transVal, benefit: benefitVal, target: targetVal } : d);
    } else {
        customDhikrs.push({ id: Date.now(), title, arabic: arabicVal, trans: transVal, benefit: benefitVal, target: targetVal });
    }
    setData('custom_dhikrs', customDhikrs);
    init();
    showScreen('list-screen');
}

function changeLanguage(langKey) {
    currentLang = langKey;
    const t = uiTranslations[langKey];
    document.getElementById('appTitle').innerText = t.title;
    document.getElementById('searchInput').placeholder = t.search;
    document.getElementById('addBtnText').innerText = t.addBtn;
    document.getElementById('resetBtnText').innerText = t.reset;
    document.getElementById('editBtnText').innerText = t.edit;
    document.getElementById('deleteBtnText').innerText = t.delete;
    document.getElementById('saveBtnText').innerText = t.save;
    document.getElementById('labelToday').innerText = t.today;
    
    renderList(allDhikrs);

    if (activeDhikrId) {
        openDhikrDetail(activeDhikrId);
    }
}

function toggleTheme() {
    const body = document.documentElement;
    const currentTheme = body.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    body.setAttribute('data-theme', newTheme);
    document.getElementById('themeToggle').innerText = newTheme === 'light' ? '☀️' : '🌙';
}

function toggleSound() { 
    soundEnabled = !soundEnabled; 
    document.getElementById('soundToggle').innerText = soundEnabled ? '🔊' : '🔇'; 
}

function changeFontSize(delta) { 
    fontSize = Math.max(16, Math.min(36, fontSize + delta)); 
    document.getElementById('detailArabic').style.fontSize = fontSize + 'px'; 
}

let globalAudioCtx = null;
function playClickSound() {
    try {
        if (!globalAudioCtx) {
            globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (globalAudioCtx.state === 'suspended') {
            globalAudioCtx.resume();
        }
        const osc = globalAudioCtx.createOscillator();
        const gain = globalAudioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, globalAudioCtx.currentTime);

        gain.gain.setValueAtTime(0.15, globalAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, globalAudioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(globalAudioCtx.destination);

        osc.start();
        osc.stop(globalAudioCtx.currentTime + 0.05);
    } catch(e) {}
}

function filterList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    renderList(allDhikrs.filter(d => {
        const title = getLocalizedText(d.title, currentLang).toLowerCase();
        return title.includes(q);
    }));
}

// Data Backup & Restore Functions
function exportData() {
    const data = { counts, customDhikrs: getData('custom_dhikrs') || [] };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tasbeeh_backup.json';
    a.click();
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = event => {
            try {
                const parsed = JSON.parse(event.target.result);
                if (parsed.counts) setData('my_counts', parsed.counts);
                if (parsed.customDhikrs) setData('custom_dhikrs', parsed.customDhikrs);
                init();
                alert('Data restored successfully!');
            } catch(err) {
                alert('Invalid Backup File');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

window.onload = init;
</script>
