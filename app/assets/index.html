<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML to APK Converter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.box{background:#1a1a2e;border-radius:20px;padding:36px 28px;max-width:480px;width:100%;box-shadow:0 0 60px rgba(243,156,18,.15);border:1px solid rgba(243,156,18,.2)}
h1{color:#f39c12;font-size:26px;text-align:center;margin-bottom:8px}
.sub{color:#8899aa;text-align:center;font-size:14px;margin-bottom:26px}
.field{margin-bottom:16px}
label{display:block;color:#8899aa;font-size:13px;margin-bottom:6px}
input[type=text]{width:100%;padding:13px;background:#0a0a1a;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:15px;outline:none;font-family:inherit}
input[type=text]:focus{border-color:#f39c12}
.file-lbl{display:block;padding:28px 20px;border:2px dashed rgba(255,255,255,.15);border-radius:12px;text-align:center;cursor:pointer;transition:.2s}
.file-lbl:hover{border-color:#f39c12;background:rgba(243,156,18,.05)}
.file-lbl input{display:none}
.file-lbl .ic{font-size:38px;margin-bottom:8px}
.file-lbl .tx{color:#8899aa;font-size:14px}
.fname{color:#2ecc71;font-size:13px;margin-top:8px;display:none}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#f39c12,#e67e22);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:16px;padding:14px;border-radius:10px;font-size:14px;text-align:center;display:none;line-height:1.6}
.status.show{display:block}
.status.info{background:rgba(52,152,219,.15);color:#5dade2;border:1px solid rgba(52,152,219,.3)}
.status.success{background:rgba(46,204,113,.15);color:#2ecc71;border:1px solid rgba(46,204,113,.3)}
.status.error{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3)}
.download{display:block;margin-top:12px;padding:14px;background:#2ecc71;color:#fff;text-decoration:none;border-radius:10px;text-align:center;font-weight:700}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.credit{text-align:center;color:#444;font-size:11px;margin-top:16px}
</style>
</head>
<body>
<div class="box">
<h1>🚀 HTML to APK</h1>
<p class="sub">Convert your HTML into an Android APK — Free & Fast</p>

<div class="field">
<label>App Name</label>
<input type="text" id="appname" placeholder="My App" value="My App" />
</div>

<div class="field">
<label>HTML File</label>
<label class="file-lbl" for="file">
<div class="ic">📁</div>
<div class="tx">Click to upload index.html</div>
<input type="file" id="file" accept=".html,.htm" />
<div class="fname" id="fname"></div>
</label>
</div>

<button class="btn" id="go" onclick="build()">🚀 Build My APK</button>

<div class="status" id="status"></div>
<div class="credit">Built by Burhan Ahmad Mughal</div>
</div>

<script>
// آپ کے Cloudflare Worker کا لنک
const API_URL = 'https://apk-builder-api.buisch2314.workers.dev';

document.getElementById('file').addEventListener('change', e => {
    const f = e.target.files[0];
    const fn = document.getElementById('fname');
    if (f) { fn.textContent = '✅ ' + f.name; fn.style.display = 'block'; }
});

function show(msg, type) {
    const s = document.getElementById('status');
    s.className = 'status show ' + type;
    s.innerHTML = msg;
}

async function build() {
    const appname = document.getElementById('appname').value.trim() || 'My App';
    const file = document.getElementById('file').files[0];

    if (!file) return show('⚠️ Please select an HTML file', 'error');

    document.getElementById('go').disabled = true;
    show('📤 Uploading your HTML...', 'info');

    const formData = new FormData();
    formData.append('htmlfile', file);
    formData.append('appName', appname);

    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            body: formData
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Upload failed');

        show('⏳ <strong>Building your APK...</strong><br>This takes about 1-2 minutes.<br><span class="spinner"></span>Please wait...', 'info');

        // وقت گزرنے کا حساب
        const startTime = Date.now();
        const startBuild = Math.floor(startTime / 1000) - 60; // 60 sec buffer
        let attempts = 0;
        const maxAttempts = 60; // 10 minutes max

        const interval = setInterval(async () => {
            attempts++;

            if (attempts > maxAttempts) {
                clearInterval(interval);
                show('⏱️ Timeout. Check GitHub manually.', 'error');
                document.getElementById('go').disabled = false;
                return;
            }

            try {
                // تمام releases حاصل کریں (latest صرف نہیں)
                const r = await fetch('https://api.github.com/repos/BurhanMughal01/apk-builder/releases?per_page=10');
                
                if (r.ok) {
                    const releases = await r.json();
                    
                    // پرانی سے نئی تک چیک کریں
                    for (const rel of releases) {
                        const created = Math.floor(new Date(rel.published_at).getTime() / 1000);
                        
                        if (created < startBuild) continue;
                        
                        const apk = rel.assets?.find(a => a.name.endsWith('.apk'));
                        
                        if (apk) {
                            clearInterval(interval);
                            show('🎉 <strong>APK Ready!</strong><br>Click below to download.', 'success');
                            
                            const btn = document.createElement('a');
                            btn.href = apk.browser_download_url;
                            btn.className = 'download';
                            btn.textContent = '⬇️ Download APK (' + Math.round(apk.size/1024) + ' KB)';
                            btn.target = '_blank';
                            document.getElementById('status').appendChild(btn);
                            
                            document.getElementById('go').disabled = false;
                            return;
                        }
                    }
                }
            } catch (e) {
                // Polling continues on error
            }
        }, 10000);

    } catch (err) {
        show('❌ Error: ' + err.message, 'error');
        document.getElementById('go').disabled = false;
    }
}
</script>
</body>
</html>
