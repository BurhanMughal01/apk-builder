<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Tap Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { margin-bottom: 5px; color: #4CAF50; }
        .stats { font-size: 18px; margin: 15px 0; }
        #game-board {
            width: 300px;
            height: 300px;
            border: 3px solid #4CAF50;
            border-radius: 15px;
            margin: 0 auto;
            position: relative;
            background-color: #1e1e1e;
            overflow: hidden;
            touch-action: manipulation;
        }
        #target {
            width: 50px;
            height: 50px;
            background-color: #ff4081;
            border-radius: 50%;
            position: absolute;
            display: none;
            cursor: pointer;
            box-shadow: 0 0 15px #ff4081;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn:disabled { background-color: #555; }
    </style>
</head>
<body>

    <h1>Reflex Tap</h1>
    <p>Tap the pink target as many times as you can in 100 seconds!</p>

    <div class="stats">
        <span>Score: <b id="score">0</b></span> | 
        <span>Time Left: <b id="time">100</b>s</span>
    </div>

    <div id="game-board">
        <div id="target" onclick="hitTarget()"></div>
    </div>

    <button id="start-btn" class="btn" onclick="startGame()">Start Game</button>

    <script>
        let score = 0;
        let timeLeft = 100;
        let timer = null;
        const target = document.getElementById('target');
        const board = document.getElementById('game-board');

        function startGame() {
            score = 0;
            timeLeft = 100;
            document.getElementById('score').innerText = score;
            document.getElementById('time').innerText = timeLeft;
            document.getElementById('start-btn').disabled = true;

            moveTarget();
            target.style.display = 'block';

            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('time').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    target.style.display = 'none';
                    document.getElementById('start-btn').disabled = false;
                    alert('Game Over! Your final score is: ' + score);
                }
            }, 1000);
        }

        function hitTarget() {
            score++;
            document.getElementById('score').innerText = score;
            moveTarget();
        }

        function moveTarget() {
            const maxX = board.clientWidth - 50;
            const maxY = board.clientHeight - 50;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';
        }
    </script>
</body>
</html>
