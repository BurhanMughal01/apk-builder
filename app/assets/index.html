<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dodge Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        h2 { margin: 5px; color: #ff9800; }
        .credit {
            font-size: 15px;
            color: #4caf50;
            margin-bottom: 12px;
            font-weight: bold;
            background: #252525;
            padding: 8px;
            border-radius: 6px;
            display: inline-block;
        }
        #game-container {
            position: relative;
            width: 280px;
            height: 400px;
            background-color: #333;
            border: 4px solid #fff;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 10px;
        }
        #player-car {
            position: absolute;
            bottom: 10px;
            left: 115px;
            width: 50px;
            height: 70px;
            background-color: #2196F3;
            border-radius: 8px;
            border: 2px solid #fff;
        }
        #enemy-car {
            position: absolute;
            top: -80px;
            left: 30px;
            width: 50px;
            height: 70px;
            background-color: #f44336;
            border-radius: 8px;
            border: 2px solid #fff;
        }
        .controls {
            margin-top: 15px;
        }
        .btn {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-start {
            background-color: #4CAF50;
            width: 280px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>کار ڈاج گیم</h2>
    <div class="credit">یہ گیم Burhan Ahmad Mughal کے پرامپٹ سے بنی ہے</div>
    
    <div style="margin-bottom: 8px; font-size: 18px;">اسکور: <b id="score">0</b></div>

    <div id="game-container">
        <div id="player-car"></div>
        <div id="enemy-car"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="moveLeft()">◀ بائیں</button>
        <button class="btn" onclick="moveRight()">دائیں ▶</button>
    </div>
    
    <button id="start-btn" class="btn btn-start" onclick="startGame()">گیم شروع کریں</button>

    <script>
        let playerX = 115;
        let enemyY = -80;
        let enemyX = 30;
        let score = 0;
        let gameInterval = null;
        let isPlaying = false;

        const player = document.getElementById('player-car');
        const enemy = document.getElementById('enemy-car');
        const scoreDisplay = document.getElementById('score');

        function moveLeft() {
            if (playerX > 20 && isPlaying) {
                playerX -= 80;
                player.style.left = playerX + 'px';
            }
        }

        function moveRight() {
            if (playerX < 185 && isPlaying) {
                playerX += 80;
                player.style.left = playerX + 'px';
            }
        }

        function startGame() {
            if (isPlaying) return;
            isPlaying = true;
            score = 0;
            enemyY = -80;
            playerX = 115;
            player.style.left = playerX + 'px';
            scoreDisplay.innerText = score;
            resetEnemy();

            gameInterval = setInterval(updateGame, 20);
        }

        function resetEnemy() {
            enemyY = -80;
            const positions = [35, 115, 195];
            enemyX = positions[Math.floor(Math.random() * positions.length)];
            enemy.style.left = enemyX + 'px';
        }

        function updateGame() {
            enemyY += 6;
            enemy.style.top = enemyY + 'px';

            if (enemyY > 400) {
                score++;
                scoreDisplay.innerText = score;
                resetEnemy();
            }

            // Collision Detection
            if (enemyY > 310 && enemyY < 380 && Math.abs(playerX - enemyX) < 40) {
                clearInterval(gameInterval);
                isPlaying = false;
                alert('گیم ختم ہو گیا! آپ کا اسکور: ' + score);
            }
        }
    </script>
</body>
</html>
