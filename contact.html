<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — APKForge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero" style="padding:140px 0 40px">
    <div class="container" style="text-align:center">
      <h1>Get in <span class="gradient-text">touch</span></h1>
      <p class="hero-desc" style="margin:0 auto">Questions, feedback, or partnership inquiry? We usually reply within 24 hours.</p>
    </div>
  </section>

  <section class="section">
    <div class="container-narrow container">
      <div class="card" style="padding:40px">
        <form id="contactForm">
          <div class="form-group">
            <label class="label">Name</label>
            <input type="text" class="input" required>
          </div>
          <div class="form-group">
            <label class="label">Email</label>
            <input type="email" class="input" required>
          </div>
          <div class="form-group">
            <label class="label">Subject</label>
            <select class="select">
              <option>General question</option>
              <option>Bug report</option>
              <option>Feature request</option>
              <option>Partnership</option>
              <option>Billing</option>
            </select>
          </div>
          <div class="form-group">
            <label class="label">Message</label>
            <textarea class="textarea" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Send Message</button>
        </form>
      </div>

      <div class="grid grid-3" style="margin-top:40px">
        <div class="card" style="text-align:center">
          <div class="card-icon" style="margin:0 auto 16px">📧</div>
          <h3>Email</h3>
          <p>support@apkforge.com</p>
        </div>
        <div class="card" style="text-align:center">
          <div class="card-icon" style="margin:0 auto 16px">💬</div>
          <h3>WhatsApp</h3>
          <p>+92 300 0000000</p>
        </div>
        <div class="card" style="text-align:center">
          <div class="card-icon" style="margin:0 auto 16px">🐦</div>
          <h3>Twitter</h3>
          <p>@apkforge</p>
        </div>
      </div>
    </div>
  </section>

  <script src="nav.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', e => {
      e.preventDefault();
      showToast('Message sent! We will reply within 24 hours. ✉️', 'success');
      e.target.reset();
    });
  </script>
</body>
</html>
