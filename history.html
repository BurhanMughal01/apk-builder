<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — APKForge</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .build-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; transition: all var(--t); }
    .build-row:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .build-icon-lg { width: 52px; height: 52px; border-radius: var(--radius); display: grid; place-items: center; font-size: 1.75rem; background: var(--bg-alt); flex-shrink: 0; }
    .status-pill { padding: 4px 12px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: white; }
    .status-pill.queued { background: #64748b; }
    .status-pill.building { background: #f59e0b; }
    .status-pill.success { background: #10b981; }
    .status-pill.failed { background: #ef4444; }
    .empty-state { text-align: center; padding: 60px 24px; }
  </style>
</head>
<body>

  <section class="hero" style="padding:120px 0 40px">
    <div class="container">
      <h1>Build <span class="gradient-text">History</span></h1>
      <p class="hero-desc">Your complete build log, realtime updated.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div id="loading" style="text-align:center;padding:60px;color:var(--text-muted)">Loading builds...</div>
      <div id="buildsContainer"></div>
    </div>
  </section>

  <script src="supabase.js"></script>
  <script>
    let userId;

    async function init() {
      const user = await Auth.requireAuth();
      if (!user) return;
      userId = user.id;

      await loadBuilds();

      Builds.subscribeToUserBuilds(userId, () => loadBuilds());
    }

    async function loadBuilds() {
      try {
        const builds = await Builds.list(userId, 200);
        render(builds);
      } catch (e) {
        document.getElementById('loading').textContent = 'Error: ' + e.message;
      }
    }

    function render(builds) {
      document.getElementById('loading').style.display = 'none';

      if (!builds.length) {
        document.getElementById('buildsContainer').innerHTML =
          '<div class="card empty-state">' +
          '<div style="font-size:4rem;margin-bottom:16px">📦</div>' +
          '<h2 style="margin-bottom:12px">No builds yet</h2>' +
          '<p style="color:var(--text-muted);margin-bottom:24px">اپنی پہلی APK بنائیں!</p>' +
          '<a href="build.html" class="btn btn-primary btn-lg">🚀 Build Now</a>' +
          '</div>';
        return;
      }

      document.getElementById('buildsContainer').innerHTML = builds.map(b => `
        <div class="build-row">
          <div style="display:flex;align-items:center;gap:16px;flex:1;min-width:250px">
            <div class="build-icon-lg">${iconFor(b.status)}</div>
            <div>
              <h4 style="margin-bottom:4px">${esc(b.app_name)}</h4>
              <div style="font-size:0.8125rem;color:var(--text-muted)">
                ${esc(b.package_name)} · ${esc(b.version || '1.0.0')} · ${timeAgo(b.created_at)}
              </div>
              ${b.error_message ? '<div style="color:var(--danger);font-size:0.8125rem;margin-top:4px">⚠ ' + esc(b.error_message) + '</div>' : ''}
            </div>
          </div>
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <span class="status-pill ${b.status}">${b.status}</span>
            ${b.apk_url ? '<a href="' + b.apk_url + '" class="btn btn-primary btn-sm" download>⬇ Download</a>' : ''}
          </div>
        </div>
      `).join('');
    }

    function iconFor(s) {
      return { queued: '⏳', building: '🔨', success: '✅', failed: '❌', cancelled: '🚫' }[s] || '❓';
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function timeAgo(d) {
      const s = Math.floor((Date.now() - new Date(d)) / 1000);
      if (s < 60) return 'ابھی';
      if (s < 3600) return Math.floor(s/60) + 'm ago';
      if (s < 86400) return Math.floor(s/3600) + 'h ago';
      return Math.floor(s/86400) + 'd ago';
    }

    init();
  </script>
</body>
</html>
