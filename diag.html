<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic</title>
<style>
body{font-family:monospace;padding:16px;background:#111;color:#eee;font-size:13px;line-height:1.6}
h2{color:#6366f1;font-size:14px;margin:16px 0 8px;border-bottom:1px solid #333;padding-bottom:4px}
.ok{color:#10b981}
.err{color:#ef4444}
.warn{color:#f59e0b}
pre{background:#1a1a1a;padding:10px;border-radius:6px;overflow-x:auto;font-size:11px;white-space:pre-wrap;word-break:break-all;margin:6px 0}
button{background:#6366f1;color:#fff;padding:10px 20px;border:none;border-radius:6px;font-size:14px;font-weight:700;margin:8px 0;width:100%}
</style>
</head>
<body>
<h2>🔍 APKForge Diagnostic</h2>
<div id="results"></div>

<button onclick="runDiag()">▶ Run Full Diagnostic</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
function log(msg, type) {
  type = type || 'info';
  const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : type === 'warn' ? 'warn' : '';
  document.getElementById('results').innerHTML += 
    '<div class="' + cls + '">' + msg + '</div>';
}

function logPre(msg) {
  document.getElementById('results').innerHTML += '<pre>' + msg + '</pre>';
}

async function runDiag() {
  document.getElementById('results').innerHTML = '';
  
  // 1. Supabase CDN loaded?
  log('1️⃣ Supabase CDN:', 'info');
  if (typeof window.supabase !== 'undefined') {
    log('   ✅ Loaded (v' + (window.supabase.version || 'unknown') + ')', 'ok');
  } else {
    log('   ❌ NOT loaded — CDN block ho raha hai', 'err');
    return;
  }
  
  // 2. Supabase URL/Key
  log('2️⃣ Testing Supabase connection...', 'info');
  const url = 'https://hmfesroapkllwnvvholb.supabase.co';
  const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtZmVzcm9hcGtsbHdudnZob2xiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODYwNTEsImV4cCI6MjEwNDk2MjA1MX0.R8ngiq5m79gt-VBVze33BVHRpiVXRV3q0ZoR1QWqJtk';
  
  try {
    const { createClient } = window.supabase;
    const testDb = createClient(url, key);
    const { data, error } = await testDb.from('profiles').select('count').limit(1);
    if (error) {
      log('   ⚠️ Connected but query failed: ' + error.message, 'warn');
    } else {
      log('   ✅ Supabase connected successfully', 'ok');
    }
  } catch(e) {
    log('   ❌ Connection failed: ' + e.message, 'err');
  }
  
  // 3. Worker API test
  log('3️⃣ Testing Worker API...', 'info');
  try {
    const res = await fetch('https://apk-builder-api.buisch2314.workers.dev/health', { 
      method: 'GET',
      mode: 'cors'
    });
    if (res.ok) {
      const data = await res.json();
      log('   ✅ Worker OK: ' + JSON.stringify(data), 'ok');
    } else {
      log('   ❌ Worker returned: ' + res.status, 'err');
    }
  } catch(e) {
    log('   ❌ Worker blocked: ' + e.message, 'err');
    logPre('Ye issue hai! Browser Worker ko access nahi kar pa raha.');
    return;
  }
  
  // 4. Load supabase.js
  log('4️⃣ Loading supabase.js...', 'info');
  try {
    await loadScript('supabase.js');
    if (typeof window.Auth !== 'undefined') {
      log('   ✅ Auth loaded', 'ok');
    } else {
      log('   ❌ Auth NOT loaded', 'err');
    }
    if (typeof window.API !== 'undefined') {
      log('   ✅ API loaded', 'ok');
    } else {
      log('   ❌ API NOT loaded', 'err');
    }
    if (typeof window.Profile !== 'undefined') {
      log('   ✅ Profile loaded', 'ok');
    } else {
      log('   ❌ Profile NOT loaded', 'err');
    }
  } catch(e) {
    log('   ❌ supabase.js failed: ' + e.message, 'err');
  }
  
  // 5. Session check
  log('5️⃣ Checking auth session...', 'info');
  try {
    if (typeof window.Auth !== 'undefined') {
      const session = await window.Auth.getSession();
      if (session) {
        log('   ✅ Logged in as: ' + session.user.email, 'ok');
      } else {
        log('   ⚠️ Not logged in (build ke liye login zaroori)', 'warn');
      }
    }
  } catch(e) {
    log('   ❌ Session check failed: ' + e.message, 'err');
  }
  
  // 6. Test build.html load
  log('6️⃣ Fetching build.html...', 'info');
  try {
    const res = await fetch('build.html');
    const html = await res.text();
    log('   ✅ build.html: ' + html.length + ' bytes', 'ok');
    
    // Check key elements
    const checks = [
      ['id="splashPreview"', 'Splash preview element'],
      ['id="styleGrid"', 'Style grid'],
      ['id="colorGrid"', 'Color grid'],
      ['id="templateGrid"', 'Template grid'],
      ['function updatePreview', 'updatePreview function'],
      ['function startBuild', 'startBuild function'],
      ['function renderTemplates', 'renderTemplates function']
    ];
    
    log('   Checking elements:', 'info');
    checks.forEach(function(c) {
      if (html.indexOf(c[0]) > -1) {
        log('      ✅ ' + c[1], 'ok');
      } else {
        log('      ❌ MISSING: ' + c[1], 'err');
      }
    });
    
  } catch(e) {
    log('   ❌ Failed: ' + e.message, 'err');
  }
  
  log('');
  log('═══════════════════════════════', 'info');
  log('📋 Screenshot bhejein — main dekh kar fix dunga', 'ok');
}

function loadScript(src) {
  return new Promise(function(resolve, reject) {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = function() { reject(new Error('Load failed: ' + src)); };
    document.body.appendChild(s);
  });
}
</script>
</body>
</html>
