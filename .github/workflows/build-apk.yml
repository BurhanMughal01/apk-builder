name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/assets/index.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      
      - name: Read App Name
        id: appname
        run: |
          NAME=$(grep -oP '(?<=<string name="app_name">).*?(?=</string>)' app/res/values/strings.xml | head -1)
          if [ -z "$NAME" ]; then NAME="My App"; fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
      
      - name: Read Package Name
        id: pkg
        run: |
          if [ -f package_name.txt ]; then
            PKG=$(cat package_name.txt | tr -d '[:space:]')
          else
            PKG="com.burhan.myapp2"
          fi
          if [ -z "$PKG" ]; then PKG="com.burhan.myapp2"; fi
          echo "name=$PKG" >> $GITHUB_OUTPUT
          P=$(echo $PKG | tr '.' '/')
          echo "path=$P" >> $GITHUB_OUTPUT
      
      - name: Update Package in Manifest
        run: |
          PKG="${{ steps.pkg.outputs.name }}"
          sed -i "s|package=\"[^\"]*\"|package=\"$PKG\"|" app/AndroidManifest.xml
      
      - name: Move Java Files to Package Folder
        run: |
          PKG_PATH="${{ steps.pkg.outputs.path }}"
          mkdir -p app/src/$PKG_PATH
          if [ -d app/src/com/burhan/myapp2 ]; then
            cp -f app/src/com/burhan/myapp2/*.java app/src/$PKG_PATH/ 2>/dev/null || true
          fi
          for f in app/src/$PKG_PATH/*.java; do
            if [ -f "$f" ]; then
              sed -i "s|^package .*;|package ${{ steps.pkg.outputs.name }};|" "$f"
            fi
          done
      
      - name: Remove icon if missing
        run: |
          if [ ! -f app/res/mipmap-hdpi/ic_launcher.png ]; then
            sed -i 's|android:icon="@mipmap/ic_launcher"||g' app/AndroidManifest.xml
          fi
      
      - name: Add Beautiful Splash Screen
        run: |
          python3 << 'PYEOF'
          import os
          name = os.environ.get('APP_NAME', 'App')
          with open('app/assets/index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          splash = '''<div id="__splash" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0a0a1a;">
          <style>
          #__splash *{margin:0;padding:0;box-sizing:border-box}
          #__splash .sp-bg{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);background-size:400% 400%;animation:__gradient 8s ease infinite}
          @keyframes __gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
          #__splash .sp-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%);animation:__pulse 3s ease-in-out infinite;pointer-events:none}
          @keyframes __pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.6}50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}}
          #__splash .sp-content{position:relative;z-index:2;text-align:center;color:#fff;animation:__fadein 1s ease}
          @keyframes __fadein{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
          #__splash .sp-icon{font-size:72px;margin-bottom:20px;animation:__float 3s ease-in-out infinite;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.3))}
          @keyframes __float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
          #__splash .sp-name{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin-bottom:12px;text-shadow:0 4px 20px rgba(0,0,0,0.3);color:#fff}
          #__splash .sp-tag{font-size:13px;opacity:0.85;letter-spacing:3px;text-transform:uppercase;margin-bottom:40px;font-weight:600;color:#fff}
          #__splash .sp-dots{display:flex;gap:8px;justify-content:center;margin-bottom:30px}
          #__splash .sp-dot{width:10px;height:10px;border-radius:50%;background:#fff;opacity:0.4;animation:__bounce 1.4s ease-in-out infinite}
          #__splash .sp-dot:nth-child(2){animation-delay:0.2s}
          #__splash .sp-dot:nth-child(3){animation-delay:0.4s}
          @keyframes __bounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-12px);opacity:1}}
          #__splash .sp-bar{width:180px;height:3px;background:rgba(255,255,255,0.2);border-radius:3px;margin:0 auto;overflow:hidden;position:relative}
          #__splash .sp-bar-in{position:absolute;top:0;left:0;height:100%;width:0%;background:#fff;border-radius:3px;animation:__load 2s ease forwards;box-shadow:0 0 12px rgba(255,255,255,0.8)}
          @keyframes __load{from{width:0%}to{width:100%}}
          #__splash .sp-footer{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:2px;text-transform:uppercase;z-index:2}
          </style>
          <div class="sp-bg"></div>
          <div class="sp-glow"></div>
          <div class="sp-content">
            <div class="sp-icon">&#128640;</div>
            <div class="sp-name">''' + name + '''</div>
            <div class="sp-tag">POWERED BY APKFORGE</div>
            <div class="sp-dots">
              <div class="sp-dot"></div>
              <div class="sp-dot"></div>
              <div class="sp-dot"></div>
            </div>
            <div class="sp-bar"><div class="sp-bar-in"></div></div>
          </div>
          <div class="sp-footer">Loading your experience...</div>
          <script>
          setTimeout(function(){
            var s = document.getElementById("__splash");
            if(s){
              s.style.transition = "opacity 0.6s ease, transform 0.6s ease";
              s.style.opacity = "0";
              s.style.transform = "scale(1.05)";
              setTimeout(function(){ s.remove(); }, 700);
            }
          }, 2500);
          </script>
          </div>'''

          if '</body>' in html.lower():
              idx = html.lower().rfind('</body>')
              html = html[:idx] + splash + html[idx:]
          else:
              html += splash
          with open('app/assets/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print('Beautiful splash added for: ' + name)
          PYEOF
        env:
          APP_NAME: ${{ steps.appname.outputs.name }}
      
      - name: Compile Resources
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          $BT/aapt2 compile --dir app/res -o compiled.zip
          $BT/aapt2 link -o app-unsigned.apk -I $PLATFORM \
            --manifest app/AndroidManifest.xml \
            -R compiled.zip --java app/src \
            --min-sdk-version 21 --target-sdk-version 34 \
            --auto-add-overlay
      
      - name: Compile Java
        run: |
          PKG_PATH="${{ steps.pkg.outputs.path }}"
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          javac --release 8 -cp $PLATFORM -d app/build \
            app/src/$PKG_PATH/MainActivity.java \
            app/src/$PKG_PATH/R.java
      
      - name: Build DEX
        run: |
          PKG_PATH="${{ steps.pkg.outputs.path }}"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          $BT/d8 --output app/ app/build/$PKG_PATH/*.class \
            --lib $PLATFORM --min-api 21
      
      - name: Add Files to APK
        run: |
          zip -j app-unsigned.apk app/classes.dex
          cd app && zip -r ../app-unsigned.apk assets/ && cd ..
      
      - name: Create Keystore
        run: |
          keytool -genkeypair -v -keystore key.jks -alias mykey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=App, O=Org, C=PK" 2>/dev/null || true
      
      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BT/apksigner sign --ks key.jks --ks-pass pass:123456 \
            --key-pass pass:123456 --min-sdk-version 21 \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out output.apk app-unsigned.apk
      
      - name: Get Timestamp
        id: ts
        run: echo "time=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ steps.ts.outputs.time }}
          name: "${{ steps.appname.outputs.name }} - ${{ steps.ts.outputs.time }}"
          files: output.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}