name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/assets/index.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      
      - name: Read App Name
        id: appname
        run: |
          NAME=$(grep -oP '(?<=<string name="app_name">).*?(?=</string>)' app/res/values/strings.xml | head -1)
          if [ -z "$NAME" ]; then NAME="My App"; fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
      
      - name: Read Package Name
        id: pkg
        run: |
          if [ -f package_name.txt ]; then
            PKG=$(cat package_name.txt | tr -d '[:space:]')
          else
            PKG="com.burhan.myapp2"
          fi
          if [ -z "$PKG" ]; then PKG="com.burhan.myapp2"; fi
          echo "name=$PKG" >> $GITHUB_OUTPUT
          P=$(echo $PKG | tr '.' '/')
          echo "path=$P" >> $GITHUB_OUTPUT
      
      - name: Update Package in Manifest
        run: |
          PKG="${{ steps.pkg.outputs.name }}"
          sed -i "s|package=\"[^\"]*\"|package=\"$PKG\"|" app/AndroidManifest.xml
          cat app/AndroidManifest.xml | head -5
      
      - name: Move Java Files to Package Folder
        run: |
          PKG_PATH="${{ steps.pkg.outputs.path }}"
          mkdir -p app/src/$PKG_PATH
          if [ -d app/src/com/burhan/myapp2 ]; then
            cp -f app/src/com/burhan/myapp2/*.java app/src/$PKG_PATH/ 2>/dev/null || true
          fi
          for f in app/src/$PKG_PATH/*.java; do
            if [ -f "$f" ]; then
              sed -i "s|^package .*;|package ${{ steps.pkg.outputs.name }};|" "$f"
            fi
          done
          echo "=== Java files ==="
          find app/src -name "*.java"
      
      - name: Remove icon if missing
        run: |
          if [ ! -f app/res/mipmap-hdpi/ic_launcher.png ]; then
            sed -i 's|android:icon="@mipmap/ic_launcher"||g' app/AndroidManifest.xml
          fi
      
      - name: Generate Professional Splash Screen
        run: |
          python3 << 'PYEOF'
          import os, re, json, random
          name = os.environ.get('APP_NAME', 'App')
          
          cfg = {'style':'gradient','color':'indigo','icon':'🚀','tagline':'POWERED BY APKFORGE','duration':'2500'}
          if os.path.exists('splash_config.json'):
            try:
              with open('splash_config.json','r',encoding='utf-8') as f: cfg.update(json.load(f))
            except: pass
          
          COLORS = {
            'indigo':['#6366f1','#8b5cf6','#ec4899'],'blue':['#0ea5e9','#3b82f6','#6366f1'],
            'green':['#10b981','#06b6d4','#14b8a6'],'orange':['#f39c12','#e67e22','#ef4444'],
            'pink':['#ec4899','#f43f5e','#f97316'],'red':['#ef4444','#dc2626','#991b1b'],
            'teal':['#14b8a6','#06b6d4','#0891b2'],'purple':['#a855f7','#8b5cf6','#6366f1'],
            'sunset':['#f97316','#f43f5e','#a855f7'],'ocean':['#0ea5e9','#06b6d4','#10b981'],
            'gold':['#fbbf24','#f59e0b','#d97706'],'dark':['#1e293b','#334155','#0f172a'],
            'emerald':['#059669','#10b981','#34d399'],'royal':['#1e40af','#3b82f6','#60a5fa'],
            'crimson':['#dc2626','#f43f5e','#fb7185'],'violet':['#7c3aed','#a855f7','#c084fc'],
            'cyan':['#0891b2','#06b6d4','#22d3ee'],'lime':['#65a30d','#84cc16','#a3e635'],
            'rose':['#e11d48','#f43f5e','#fb7185'],'midnight':['#0f172a','#1e293b','#334155']
          }
          c = COLORS.get(cfg['color'], COLORS['indigo']); c1,c2,c3 = c[0],c[1],c[2]
          style, icon = cfg['style'], cfg['icon']
          tagline = cfg['tagline'].replace("'","&#39;").replace('<','&lt;').replace('>','&gt;')
          duration = cfg['duration']
          
          if style=='gradient' or style=='aurora':
            bg='background:linear-gradient(135deg,'+c1+' 0%,'+c2+' 50%,'+c3+' 100%);background-size:400% 400%;animation:__gm 8s ease infinite';tc='#fff';ac='#fff'
          elif style=='minimal':bg='background:#0a0a1a';tc=c1;ac=c1
          elif style=='particles':bg='background:linear-gradient(180deg,'+c1+','+c3+')';tc='#fff';ac='#fff'
          elif style=='neon':bg='background:#0a0a1a';tc=c1;ac=c1
          elif style=='glass':bg='background:radial-gradient(circle at 30% 30%,'+c1+'33,transparent 50%),radial-gradient(circle at 70% 70%,'+c3+'33,transparent 50%),#0a0a1a';tc=c1;ac=c1
          elif style=='waves':bg='background:linear-gradient(180deg,'+c1+','+c3+')';tc='#fff';ac='#fff'
          elif style=='matrix':bg='background:#000';tc=c1;ac=c1
          elif style=='stars':bg='background:radial-gradient(ellipse at center,'+c2+','+c1+',#000)';tc='#fff';ac='#fff'
          elif style=='bokeh':bg='background:linear-gradient(135deg,'+c1+','+c3+')';tc='#fff';ac='#fff'
          elif style=='geometric':bg='background:#0a0a1a';tc='#fff';ac=c1
          elif style=='cosmic':bg='background:radial-gradient(ellipse at 50% 30%,'+c2+','+c1+' 40%,#000 100%)';tc='#fff';ac='#fff'
          else:bg='background:linear-gradient(135deg,'+c1+','+c2+')';tc='#fff';ac='#fff'
          
          icon_sh = 'filter:drop-shadow(0 8px 24px rgba(0,0,0,0.3))'
          if style=='neon': icon_sh='filter:drop-shadow(0 0 30px '+c1+') drop-shadow(0 0 60px '+c1+')'
          
          particles=''
          if style=='particles':
            random.seed(42)
            for i in range(15):
              t=random.randint(5,95);l=random.randint(5,95);s=random.randint(3,8);d=random.randint(0,30)/10
              particles+='<div style="position:absolute;top:'+str(t)+'%;left:'+str(l)+'%;width:'+str(s)+'px;height:'+str(s)+'px;background:rgba(255,255,255,0.6);border-radius:50%;animation:__pf '+str(d)+'s ease-in-out infinite alternate;"></div>'
          elif style=='waves':
            particles='<div style="position:absolute;bottom:0;left:0;right:0;height:40%;background:repeating-linear-gradient(90deg,transparent 0,transparent 20px,rgba(255,255,255,.05) 20px,rgba(255,255,255,.05) 40px)"></div>'
          elif style=='matrix':
            for p in [10,30,50,70,90]:
              particles+='<div style="position:absolute;top:0;left:'+str(p)+'%;width:2px;height:100%;background:linear-gradient(180deg,transparent,'+c1+',transparent);opacity:.5;animation:__mx 3s linear infinite;"></div>'
          elif style=='stars':
            random.seed(7)
            for i in range(20):
              t=random.randint(5,95);l=random.randint(5,95);s=random.randint(1,3)
              particles+='<div style="position:absolute;top:'+str(t)+'%;left:'+str(l)+'%;width:'+str(s)+'px;height:'+str(s)+'px;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff;animation:__tw 3s infinite;"></div>'
          elif style=='bokeh':
            particles='<div style="position:absolute;top:20%;left:30%;width:80px;height:80px;background:rgba(255,255,255,.08);border-radius:50%;filter:blur(20px)"></div><div style="position:absolute;top:60%;left:70%;width:100px;height:100px;background:rgba(255,255,255,.06);border-radius:50%;filter:blur(30px)"></div>'
          elif style=='geometric':
            particles='<div style="position:absolute;inset:0;background-image:linear-gradient(45deg,'+c1+'11 25%,transparent 25%),linear-gradient(-45deg,'+c1+'11 25%,transparent 25%);background-size:60px 60px"></div>'
          elif style=='cosmic':
            random.seed(3)
            for i in range(25):
              t=random.randint(5,95);l=random.randint(5,95);s=random.randint(2,5)
              particles+='<div style="position:absolute;top:'+str(t)+'%;left:'+str(l)+'%;width:'+str(s)+'px;height:'+str(s)+'px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff;animation:__tw 4s infinite;"></div>'
          
          splash='''<div id="__splash" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;'''+bg+'''">
          <style>
          #__splash *{margin:0;padding:0;box-sizing:border-box}
          @keyframes __gm{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
          @keyframes __fi{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
          @keyframes __bd{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-12px);opacity:1}}
          @keyframes __ld{from{width:0%}to{width:100%}}
          @keyframes __pu{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}}
          @keyframes __ic{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
          @keyframes __pf{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
          @keyframes __mx{0%{opacity:0;transform:translateY(-100%)}100%{opacity:.5;transform:translateY(100%)}}
          @keyframes __tw{0%,100%{opacity:.3}50%{opacity:1}}
          #__splash .__glw{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,0.12) 0%,transparent 70%);animation:__pu 3s ease-in-out infinite;pointer-events:none}
          #__splash .__cnt{position:relative;z-index:2;text-align:center;animation:__fi 0.9s ease}
          #__splash .__icn{font-size:76px;margin-bottom:22px;display:block;animation:__ic 3s ease-in-out infinite;'''+icon_sh+'''}
          #__splash .__nm{font-size:34px;font-weight:800;letter-spacing:-0.5px;margin-bottom:14px;color:'''+tc+''';text-shadow:0 4px 20px rgba(0,0,0,0.3);padding:0 20px}
          #__splash .__tg{font-size:12px;opacity:0.85;letter-spacing:3px;text-transform:uppercase;margin-bottom:40px;font-weight:700;color:'''+tc+'''}
          #__splash .__dt{display:flex;gap:9px;justify-content:center;margin-bottom:28px}
          #__splash .__d{width:9px;height:9px;border-radius:50%;background:'''+ac+''';opacity:0.4;animation:__bd 1.4s ease-in-out infinite}
          #__splash .__d:nth-child(2){animation-delay:.2s}
          #__splash .__d:nth-child(3){animation-delay:.4s}
          #__splash .__bw{width:180px;height:3px;background:rgba(255,255,255,0.2);border-radius:3px;margin:0 auto;overflow:hidden}
          #__splash .__bi{height:100%;width:0%;background:'''+ac+''';border-radius:3px;animation:__ld '''+str(int(int(duration)*0.8))+'''ms ease forwards;box-shadow:0 0 12px '''+ac+'''}
          #__splash .__ft{position:absolute;bottom:36px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,0.55);letter-spacing:2px;text-transform:uppercase;z-index:2}
          </style>
          <div class="__glw"></div>'''+particles+'''
          <div class="__cnt">
            <span class="__icn">'''+icon+'''</span>
            <div class="__nm">'''+name+'''</div>
            <div class="__tg">'''+tagline+'''</div>
            <div class="__dt"><div class="__d"></div><div class="__d"></div><div class="__d"></div></div>
            <div class="__bw"><div class="__bi"></div></div>
          </div>
          <div class="__ft">Loading experience...</div>
          <script>
          setTimeout(function(){
            var s=document.getElementById("__splash");
            if(s){s.style.transition="opacity 0.6s ease, transform 0.6s ease";s.style.opacity="0";s.style.transform="scale(1.05)";setTimeout(function(){s.remove()},700);}
          },'''+duration+''');
          </script>
          </div>'''
          
          with open('app/assets/index.html','r',encoding='utf-8') as f: html=f.read()
          m=re.search(r'<body[^>]*>',html,re.IGNORECASE)
          if m:
            idx=m.end();html=html[:idx]+splash+html[idx:]
          else:html=splash+html
          with open('app/assets/index.html','w',encoding='utf-8') as f: f.write(html)
          print('Splash: '+style+', color='+cfg['color']+', icon='+icon)
          PYEOF
        env:
          APP_NAME: ${{ steps.appname.outputs.name }}
      
      - name: Compile Resources
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          $BT/aapt2 compile --dir app/res -o compiled.zip
          $BT/aapt2 link -o app-unsigned.apk -I $PLATFORM \
            --manifest app/AndroidManifest.xml \
            -R compiled.zip --java app/src \
            --min-sdk-version 21 --target-sdk-version 34 \
            --auto-add-overlay
      
      - name: Compile Java
        run: |
          PKG_PATH="${{ steps.pkg.outputs.path }}"
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          javac --release 8 -cp $PLATFORM -d app/build \
            app/src/$PKG_PATH/MainActivity.java \
            app/src/$PKG_PATH/R.java
      
      - name: Build DEX
        run: |
          PKG_PATH="${{ steps.pkg.outputs.path }}"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          $BT/d8 --output app/ app/build/$PKG_PATH/*.class \
            --lib $PLATFORM --min-api 21
      
      - name: Add Files to APK
        run: |
          zip -j app-unsigned.apk app/classes.dex
          cd app && zip -r ../app-unsigned.apk assets/ && cd ..
      
      - name: Create Keystore
        run: |
          keytool -genkeypair -v -keystore key.jks -alias mykey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=App, O=Org, C=PK" 2>/dev/null || true
      
      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BT/apksigner sign --ks key.jks --ks-pass pass:123456 \
            --key-pass pass:123456 --min-sdk-version 21 \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out output.apk app-unsigned.apk
      
      - name: Get Timestamp
        id: ts
        run: echo "time=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ steps.ts.outputs.time }}
          name: "${{ steps.appname.outputs.name }} - ${{ steps.ts.outputs.time }}"
          files: output.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}