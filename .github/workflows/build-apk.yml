name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/assets/index.html'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Android SDK Components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          test -f $ANDROID_HOME/platforms/android-34/android.jar && echo "✅ SDK ready" || echo "❌ SDK MISSING"
      
      - name: Compile and Link resources
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          $BT/aapt2 compile --dir app/res -o compiled.zip
          $BT/aapt2 link -o app-unsigned.apk -I $PLATFORM \
            --manifest app/AndroidManifest.xml \
            -R compiled.zip --java app/src \
            --min-sdk-version 21 --target-sdk-version 34 \
            --auto-add-overlay
          echo "=== APK after aapt2 ==="
          ls -lh app-unsigned.apk
      
      - name: Compile Java
        run: |
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          javac --release 8 -cp $PLATFORM -d app/build \
            app/src/com/burhan/myapp2/MainActivity.java \
            app/src/com/burhan/myapp2/R.java
      
      - name: Build DEX
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          $BT/d8 --output app/ app/build/com/burhan/myapp2/*.class \
            --lib $PLATFORM --min-api 21
          echo "=== DEX file ==="
          ls -lh app/classes.dex
      
      - name: Add files to APK
        run: |
          echo "=== Adding classes.dex ==="
          zip -j app-unsigned.apk app/classes.dex
          
          echo "=== Adding assets ==="
          cd app
          zip -r ../app-unsigned.apk assets/
          cd ..
          
          echo "=== Final APK contents ==="
          ls -lh app-unsigned.apk
          unzip -l app-unsigned.apk
          
          echo "=== Essential files check ==="
          unzip -l app-unsigned.apk | grep -q "AndroidManifest.xml" && echo "✅ AndroidManifest.xml FOUND" || echo "❌ MISSING"
          unzip -l app-unsigned.apk | grep -q "classes.dex" && echo "✅ classes.dex FOUND" || echo "❌ MISSING"
          unzip -l app-unsigned.apk | grep -q "assets/index.html" && echo "✅ index.html FOUND" || echo "❌ MISSING"
      
      - name: Create keystore
        run: |
          keytool -genkeypair -v -keystore key.jks -alias mykey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=App, O=Org, C=PK" 2>/dev/null || true
      
      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BT/apksigner sign --ks key.jks --ks-pass pass:123456 \
            --key-pass pass:123456 --min-sdk-version 21 \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out output.apk app-unsigned.apk
          echo "=== Signed APK ==="
          ls -lh output.apk
          $BT/apksigner verify --verbose output.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: output.apk
          retention-days: 30