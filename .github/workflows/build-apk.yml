name: Build APK v3

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:
    inputs:
      buildId:
        description: 'Build ID'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          mkdir -p cmdline-tools
          mv latest cmdline-tools/
          cd $HOME/android-sdk
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Update build status to building
        run: |
          BUILD_ID="${{ github.event.client_payload.data.id }}"
          curl -s -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/builds?id=eq.$BUILD_ID" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"building\",\"started_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Generate config files
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" > payload.json
          python3 .github/scripts/generate_config.py

      - name: Generate splash resources
        run: |
          mkdir -p app/res/drawable
          python3 .github/scripts/generate_splash.py || echo "Splash gen skipped"

      - name: Compile resources
        run: |
          cd app
          aapt2 compile --dir res -o compiled_res.zip || aapt2 compile -o compiled_res.zip res/**/*.xml
          cd ..

      - name: Link resources
        run: |
          mkdir -p app/gen
          aapt2 link -o app-unsigned.apk \
            -I $ANDROID_HOME/platforms/android-34/android.jar \
            --manifest app/AndroidManifest.xml \
            --java app/gen \
            -A app/assets \
            app/compiled_res.zip || echo "Trying alternate method"

      - name: Compile Java
        run: |
          find app/src -name "*.java" > sources.txt
          find app/gen -name "*.java" >> sources.txt
          javac -source 17 -target 17 \
            -bootclasspath $ANDROID_HOME/platforms/android-34/android.jar \
            -d app/classes @sources.txt

      - name: D8 to DEX
        run: |
          mkdir -p app/dex
          find app/classes -name "*.class" > classes.txt
          d8 --release --min-api 21 --output app/dex/ @classes.txt
          cd app/dex && zip -r ../../app-unsigned.apk classes.dex && cd ../..

      - name: Zipalign
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            app-unsigned.apk app-aligned.apk

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app.keystore

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks app.keystore \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app-release.apk \
            app-aligned.apk

      - name: Upload APK to Supabase Storage
        id: upload
        run: |
          BUILD_ID="${{ github.event.client_payload.data.id }}"
          FILE="apkforge-${BUILD_ID}.apk"
          mv app-release.apk "$FILE"

          curl -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/apks/$FILE" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$FILE"

          APK_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/apks/$FILE"
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV

      - name: Update build record success
        run: |
          BUILD_ID="${{ github.event.client_payload.data.id }}"
          curl -s -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/builds?id=eq.$BUILD_ID" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"success\",\"apk_url\":\"$APK_URL\",\"completed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Notify on failure
        if: failure()
        run: |
          BUILD_ID="${{ github.event.client_payload.data.id }}"
          curl -s -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/builds?id=eq.$BUILD_ID" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"error_message\":\"Build failed in CI\"}"
